<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="orchestra-api-base" content="">
<title>Baton - a live score</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="knowledge.css">
<link rel="stylesheet" href="ribbon.css">
<link rel="stylesheet" href="selection.css">
<link rel="stylesheet" href="attention.css">
</head>
<body>

<a class="skip" href="#pit">Skip to the pit</a>

<header class="plate">
  <h1 class="plate-title">Baton</h1>
  <p class="plate-sub">a live score</p>
  <nav class="plate-nav" aria-label="Move to a section">
    <a href="#pit">The pit <span class="plate-count" id="plate-pit"></span></a>
    <a href="#map">The map <span class="plate-count" id="plate-map"></span></a>
    <a href="#staves">The staves <span class="plate-count" id="plate-staves"></span></a>
    <a href="#record">The record <span class="plate-count" id="plate-record"></span></a>
    <a href="#project">The project <span class="plate-count" id="plate-project"></span></a>
  </nav>
  <p class="plate-state">
    <span class="plate-mark" id="plate-mark"></span>
  </p>
  <p class="plate-facts" id="snapshot-line">No snapshot loaded.</p>
</header>

<div class="notice" id="notice" hidden></div>
<div class="notice fixture" id="fixture-notice" hidden></div>

<div class="rail" id="rail" hidden></div>

<main class="sheet">

  <!-- The hall: what is playing now. The run's axis is the page spine, one
       time grid for the whole page; the seats sit on their tiers under it. -->
  <section class="pit" id="pit" tabindex="-1" aria-labelledby="pit-title">
    <div class="pit-head">
      <h2 id="pit-title" class="movement">The pit</h2>
      <p class="doc-counts" id="doc-counts"></p>
    </div>
    <div id="ribbon" class="doc-ribbon"></div>
    <div id="attention-band" class="lane-strip"></div>
  </section>

  <!-- The written surfaces and the record. The record is a rail beside them, so a
       selection from the map or the staves never moves the reader away from where
       they made it. -->

  <!-- Read prior sessions from the selected actor's recorded workspace. -->
  <section class="project" id="project" tabindex="-1" aria-labelledby="project-title">
    <div class="movement-row">
      <h2 id="project-title" class="movement">The project</h2>
      <p class="doc-scope" id="project-state" role="status"></p>
      <button type="button" id="project-load" class="doc-scope-btn">Read the project</button>
    </div>
    <div id="project-body" class="project-body"></div>
  </section>

  <div class="work">
  <div class="work-main">

  <!-- The map: the whole recorded ensemble. -->
  <section class="map" id="map" tabindex="-1" aria-labelledby="map-title">
    <div class="movement-row">
      <h2 id="map-title" class="movement">The map</h2>
      <div class="doc-scope-row">
        <span id="map-scope" class="doc-scope" role="status">Universal knowledge</span>
        <button type="button" id="map-scope-all" class="doc-scope-btn" aria-pressed="false">All held
          records</button>
      </div>
    </div>
    <div class="map-frame">
      <div id="knowledge-whole" class="doc-whole-mount"></div>
    </div>
  </section>

  <!-- The written score: one staff per actor. -->
  <section class="paper" id="staves" tabindex="-1" aria-labelledby="staves-title">
    <div class="staves-col">
      <div class="movement-row">
        <h2 id="staves-title" class="movement">The staves</h2>
        <div class="doc-tools">
          <label class="doc-find">
            <span class="doc-find-label">Find an actor</span>
            <input type="search" id="doc-find" autocomplete="off"
              placeholder="name or role" aria-controls="roster">
          </label>
          <button type="button" id="doc-ended" aria-pressed="false">Show quiet seats</button>
          <button type="button" id="reconnect">Reconnect</button>
        </div>
      </div>
      <ul class="doc-roster" id="roster"></ul>
    </div>
  </section>

  </div>

  <aside class="record-col" id="record" tabindex="-1" aria-labelledby="selection-title">
    <h2 id="selection-title" class="movement">The actor you selected</h2>
    <div id="selection" class="doc-selection"></div>
  </aside>

  </div>

</main>

<script src="order.js" defer></script>
<script src="attention.js" defer></script>
<script src="knowledge.js" defer></script>
<script src="ribbon.js" defer></script>
<script src="selection.js" defer></script>
<script src="document.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
