<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="orchestra-api-base" content="">
<title>Orchestra live view</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="page-head">
  <div>
    <h1>Orchestra live view</h1>
    <p class="subtitle" id="snapshot-line">No snapshot loaded.</p>
  </div>
  <dl class="conn" aria-label="Connection state">
    <div><dt>Stream</dt><dd id="conn-state">idle</dd></div>
    <div><dt>Cursor</dt><dd id="cursor-state">none</dd></div>
    <div><dt>Generation</dt><dd id="generation-state">none</dd></div>
    <div><dt>Contract</dt><dd id="contract-state">want 1</dd></div>
  </dl>
</header>

<div class="notice" id="notice" hidden></div>
<div class="notice fixture" id="fixture-notice" hidden></div>

<div class="toolbar" role="search">
  <label class="field">Search
    <input type="search" id="search" placeholder="id, model, branch, capability" autocomplete="off">
  </label>
  <label class="field">Status
    <select id="status-filter">
      <option value="all">all</option>
      <option value="running">running</option>
      <option value="waiting">waiting</option>
      <option value="completed">completed</option>
      <option value="failed">failed</option>
      <option value="stopped">stopped</option>
      <option value="pending">pending</option>
      <option value="unknown">unknown</option>
    </select>
  </label>
  <label class="field">Ensemble
    <select id="ensemble-filter">
      <option value="all">all</option>
    </select>
  </label>
  <button type="button" id="clear-filters">Clear</button>
  <button type="button" id="reconnect">Reconnect</button>
</div>

<main class="layout">
  <section class="tree-pane" aria-labelledby="tree-title">
    <h2 id="tree-title">Hierarchy</h2>
    <p class="count" id="tree-count"></p>
    <p class="legend">Statuses show recorded coordinator state. Process liveness is unknown unless observed.</p>
    <ul class="tree" id="tree" role="tree" aria-label="Orchestra hierarchy"></ul>
  </section>

  <div class="side">
    <section class="detail" aria-labelledby="detail-title">
      <h2 id="detail-title">Selected actor</h2>
      <div id="detail"><p class="muted">Select an actor in the hierarchy.</p></div>
    </section>

    <section class="transitions" aria-labelledby="transitions-title">
      <h2 id="transitions-title">Recent committed transitions</h2>
      <ol id="transitions"></ol>
    </section>
  </div>
</main>

<script src="app.js" defer></script>
</body>
</html>
