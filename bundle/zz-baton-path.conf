# Persistent keeper service PATH for baton2-native-homelab.service (#893).
# Install as /etc/systemd/system/baton2-native-homelab.service.d/zz-baton-path.conf
# The zz- prefix sorts after the existing node-path.conf, whose content is
# preserved: its Node bin directory is included below. Do not edit or
# remove node-path.conf. The ExecStartPre hook writes the service PATH to
# the runner .path file, which the runner entry script reads before it
# starts the listener. Root activation: install this file, then
# systemctl daemon-reload, then restart the service through its supported
# lifecycle when no job is running on this runner.
[Service]
Environment=PATH=/run/baton2-native-homelab/home/.local/bin:/run/baton2-native-homelab/home/.local/share/baton2/releases/2.0.0-output-checkpoint-6a70-pr813-821-20261018/bin:/run/baton2-native-homelab/runner/externals/node24/bin:/run/baton2-native-homelab/home/.local/share/baton-native-clients/muse-stable:/run/baton2-native-homelab/home/.local/share/baton-native-clients/codex-0.154.0-linux-x64/bin:/run/baton2-native-homelab/home/.local/share/baton-native-clients/omp-17.4.0-linux-x64:/run/baton2-native-homelab/home/.local/share/baton-native-clients/dsh-0.2.1-rc.2/node_modules/.bin:/run/baton2-native-homelab/home/.local/share/claude/versions:/usr/local/bin:/usr/bin:/bin
ExecStartPre=/bin/sh -c "printf '%%s' \"$$PATH\" > /run/baton2-native-homelab/runner/.path"
