<!doctype html><html><head><meta charset="utf-8"></head><body><canvas id="out" width="8" height="8"></canvas>
<script type="module">
// bakes the 1776 v8 writing hands (see unfinished3.hand.js) to web/assets via bake_unfinished3_hand.mjs:
// per sleeve, the hand (box A, fine) and the whole arm (box B, coarse), each as colour and height
import { renderHand } from './unfinished3.hand.js';
const q = new URLSearchParams(location.search), sc = +(q.get('scale') || 1), only = q.get('only');
const BOXES = { hand: [-6, -24, 27, 9], arm: [-8, -108, 96, 10] };
if (q.get('box')) BOXES.hand = q.get('box').split(',').map(Number);   // previews: a custom box for the hand
const PXCM = { hand: 30 * sc, arm: 10 * sc };
window.baked = {};
for (const s of ['1776', '2024']) for (const part of ['hand', 'arm']) for (const mode of ['color', 'height']) {
  const key = `${s}_${part}${mode === 'height' ? '_h' : ''}`; if (only && !key.match(only)) continue;
  const box = BOXES[part], px = Math.round((box[2] - box[0]) * PXCM[part]);
  const h = renderHand({ sleeve: s, px, box, mode });
  window.baked[key] = { url: h.cv.toDataURL('image/png'), box, cmPx: h.cmPx, tilt: h.tilt };
}
window.sceneReady = true;
</script></body></html>
