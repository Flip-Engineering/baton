name: baton-ci

on:
  pull_request:
  push:
    branches:
      - master
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: baton-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verification-only gate (node ${{ matrix.node }})
    runs-on: [self-hosted, atari-homelab]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: impl/package-lock.json

      - name: Clean install
        working-directory: impl
        run: npm ci

      - name: Full existing suite
        working-directory: impl
        run: npm test

      - name: Contract manifest validation
        working-directory: impl
        run: npm run test:contracts:validate

      - name: CLI/MCP/Web surface audits
        working-directory: impl
        run: npm run test:surfaces

      - name: Unified surface tests
        working-directory: impl
        run: npm run test:unified-surfaces

      - name: Production convergence tests
        working-directory: impl
        run: npm run test:production-convergence

      - name: Expected-red convergence gate
        working-directory: impl
        run: npm run test:contracts

      - name: Packed install and executable smoke
        working-directory: impl
        run: npm run test:package

      - name: Generate machine release status
        if: matrix.node == 22
        working-directory: impl
        env:
          BATON_RELEASE_GATE: passed
          BATON_CONTRACT_GATE: passed
        run: node scripts/generate-release-status.mjs --output "$RUNNER_TEMP/baton-status.json"

      - name: Upload release status
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: baton-status
          path: ${{ runner.temp }}/baton-status.json
          if-no-files-found: error
