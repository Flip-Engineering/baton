name: bend2-native-development

'on':
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bend2-native.yml'
      - '.github/scripts/record-native-checks.py'
      - '.github/scripts/reuse-native-target.py'
      - '.github/scripts/reuse-native-main.py'
      - '.github/scripts/test-reuse-native-main.py'
      - '.github/scripts/prepare-native-compiler.py'
      - '.github/scripts/repl-package.py'
      - 'LICENSE'
      - 'NOTICE'
      - 'bend2/src/**'
      - 'bend2/scripts/build-native.sh'
      - 'bend2/scripts/package-native.py'
      - 'bend2/scripts/stage-repl-compiler.py'
      - 'bend2/scripts/stage-native-install.py'
      - 'bend2/scripts/check-install.py'
      - 'bend2/compiler/**'
      - 'bend2/scripts/smoke-native-artifact.py'
      - 'bend2/scripts/*.mjs'
      - 'bend2/harness/**'
      - 'bend2/ui/**'
      - 'bend2/context/**'
      - 'docs/bend2/reference/toolchain/install-2.0.25.sh'
      - 'docs/bend2/reference/upstream/LICENSE'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bend2-native.yml'
      - '.github/scripts/record-native-checks.py'
      - '.github/scripts/reuse-native-target.py'
      - '.github/scripts/reuse-native-main.py'
      - '.github/scripts/test-reuse-native-main.py'
      - '.github/scripts/prepare-native-compiler.py'
      - '.github/scripts/repl-package.py'
      - 'LICENSE'
      - 'NOTICE'
      - 'bend2/src/**'
      - 'bend2/scripts/build-native.sh'
      - 'bend2/scripts/package-native.py'
      - 'bend2/scripts/stage-repl-compiler.py'
      - 'bend2/scripts/stage-native-install.py'
      - 'bend2/scripts/check-install.py'
      - 'bend2/compiler/**'
      - 'bend2/scripts/smoke-native-artifact.py'
      - 'bend2/scripts/*.mjs'
      - 'bend2/harness/**'
      - 'bend2/ui/**'
      - 'bend2/context/**'
      - 'docs/bend2/reference/toolchain/install-2.0.25.sh'
      - 'docs/bend2/reference/upstream/LICENSE'
  workflow_dispatch:
    inputs:
      inspect_host:
        description: 'Collect read-only homelab resource and process facts; skip native builds'
        required: false
        default: false
        type: boolean
      release_version:
        description: 'Release archive version; leave blank for a development archive'
        required: false
        default: ''
        type: string
      target_commit:
        description: 'Exact target commit for the affected behavior comparison'
        required: true
        type: string
      target_build_run:
        description: 'Completed workflow run containing the exact target build evidence; leave blank to build target'
        required: false
        default: ''
        type: string
      retained_main_handoff:
        description: 'Homelab completed Main handoff path or single-match glob; $HOME uses the selected runner home'
        required: false
        default: ''
        type: string
      retained_main_handoff_sha256:
        description: 'Exact SHA256 of the completed Main handoff'
        required: false
        default: ''
        type: string
      retained_target_main_handoff:
        description: 'Completed Main handoff for building the exact target; leave target_build_run blank'
        required: false
        default: ''
        type: string
      retained_target_main_handoff_sha256:
        description: 'Exact SHA256 of the completed target Main handoff'
        required: false
        default: ''
        type: string
      retained_compiler_archive:
        description: 'Pinned compiler archive on the homelab; $RUNNER_TEMP uses the selected runner namespace'
        required: false
        default: ''
        type: string
      retained_compiler_archive_sha256:
        description: 'Exact SHA256 of the selected pinned compiler archive'
        required: false
        default: ''
        type: string
      retained_target_compiler_archive:
        description: 'Pinned target compiler archive on the homelab; omission uses the global compiler archive pair'
        required: false
        default: ''
        type: string
      retained_target_compiler_archive_sha256:
        description: 'Exact SHA256 of the target compiler archive; supply both target archive inputs together'
        required: false
        default: ''
        type: string
      retained_ccache:
        description: 'Measured private ccache wrapper on the homelab; leave blank for direct native compilation'
        required: false
        default: ''
        type: string
      linux_runner:
        description: 'Linux qualification host'
        required: true
        default: homelab
        type: choice
        options: [homelab, hosted]

permissions:
  contents: read

env:
  BATON2_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  host-inspector:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_host
    runs-on: [self-hosted, Linux, X64, baton2-native-linux-x64]
    timeout-minutes: 3
    steps:
      - name: Capture bounded read-only host facts
        shell: bash
        run: |
          set -euo pipefail
          export BATON_INSPECT_ROOT="$RUNNER_TEMP/baton-inspection-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$BATON_INSPECT_ROOT"
          python3 -u - <<'PY'
          import datetime, json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['BATON_INSPECT_ROOT'])
          report = {'immediate': {
              'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'meminfo': pathlib.Path('/proc/meminfo').read_text(),
              'pressure': {name: pathlib.Path('/proc/pressure/' + name).read_text()
                           for name in ('cpu', 'memory', 'io')},
          }, 'processes': []}
          print(json.dumps({'phase': 'immediate', **report['immediate']}), flush=True)
          reader = """import json, os, pathlib, sys
          pid = sys.argv[1]
          base = pathlib.Path('/proc') / pid
          result = {'pid': int(pid), 'files': {}}
          for name in ('stat', 'limits', 'cwd', 'status'):
              try:
                  path = base / name
                  value = os.readlink(path) if name == 'cwd' else path.read_text()
                  result['files'][name] = value
              except OSError as error:
                  result['files'][name] = {'error': str(error)}
          print(json.dumps(result), flush=True)
          """
          for pid in ('3427953', '3730453', '3735539'):
              try:
                  child = subprocess.run([sys.executable, '-u', '-c', reader, pid],
                                         capture_output=True, text=True, timeout=2, check=False)
                  if child.returncode == 0 and child.stdout:
                      row = json.loads(child.stdout)
                  else:
                      row = {'pid': int(pid), 'error': 'probe subprocess exit',
                             'returncode': child.returncode, 'stderr': child.stderr[-1000:]}
              except subprocess.TimeoutExpired:
                  row = {'pid': int(pid), 'error': 'probe subprocess exceeded 2 seconds'}
              report['processes'].append(row)
              print(json.dumps({'phase': 'process', **row}), flush=True)
          output = root / 'inspection.json'
          output.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({'phase': 'complete', 'path': str(output),
                            'process_count': len(report['processes'])}), flush=True)

          PY
      - name: Retain complete inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton-host-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baton-inspection-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
  linux-candidate:
    if: ${{ !inputs.inspect_host }}
    runs-on: ${{ fromJSON(inputs.linux_runner == 'homelab' && '["self-hosted", "Linux", "X64", "baton2-native-linux-x64"]' || '["ubuntu-24.04"]') }}
    env:
      CC: ${{ inputs.linux_runner == 'homelab' && '/usr/bin/clang-19' || 'clang' }}
      BEND_NO_TELEMETRY: '1'
      BUN_JSC_maxPerThreadStackUsage: '67108864'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.BATON2_SOURCE_SHA }}
          persist-credentials: false
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Select homelab browser executable
        if: inputs.linux_runner == 'homelab'
        shell: bash
        run: printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify retained Main evidence acceptance and refusals
        shell: bash
        run: python3 .github/scripts/test-reuse-native-main.py --helper .github/scripts/reuse-native-main.py
      - name: Prepare candidate toolchain and TypeScript runtime
        shell: bash
        env:
          BATON2_RETAINED_COMPILER_ARCHIVE: ${{ inputs.retained_compiler_archive }}
          BATON2_RETAINED_COMPILER_SHA256: ${{ inputs.retained_compiler_archive_sha256 }}
          BATON2_RETAINED_CCACHE: ${{ inputs.retained_ccache }}
          BATON2_LINUX_RUNNER: ${{ inputs.linux_runner }}
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/baton2-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run"
          mkdir -p "$run/toolchain-home" "$run/evidence" "$run/generated"
          printf 'BATON2_LINUX_RUN=%s\n' "$run" >> "$GITHUB_ENV"
          python3 .github/scripts/prepare-native-compiler.py --run "$run" \
            --archive "$BATON2_RETAINED_COMPILER_ARCHIVE" \
            --archive-sha256 "$BATON2_RETAINED_COMPILER_SHA256" \
            --ccache "$BATON2_RETAINED_CCACHE" --github-env "$GITHUB_ENV" \
            --runner "$BATON2_LINUX_RUNNER" \
            > "$run/evidence/compiler-selection.stdout" 2> "$run/evidence/compiler-selection.stderr"
          printf 'BEND=%s\n' "$run/toolchain-home/bin/bend" >> "$GITHUB_ENV"
          sha256sum "$run/toolchain-home/bin/bend" > "$run/evidence/compiler.sha256"
          npm install --prefix "$run/typescript-runtime" --ignore-scripts --no-audit --no-fund \
            typescript@5.9.3 > "$run/evidence/typescript-install.stdout" 2> "$run/evidence/typescript-install.stderr"
          printf 'BATON2_CONTEXT_TYPESCRIPT=%s\n' "$run/typescript-runtime/node_modules/typescript" >> "$GITHUB_ENV"
      - name: Verify optional retained Main compilation
        shell: bash
        env:
          BATON2_RETAINED_MAIN_HANDOFF: ${{ inputs.retained_main_handoff }}
          BATON2_RETAINED_MAIN_SHA256: ${{ inputs.retained_main_handoff_sha256 }}
          BATON2_LINUX_RUNNER: ${{ inputs.linux_runner }}
        run: |
          set -euo pipefail
          printf 'BATON2_MAIN_GENERATED_C=\nBATON2_MAIN_GENERATED_C_ROOT=\nBATON2_MAIN_GENERATED_C_PROOF=\nBATON2_MAIN_GENERATED_C_PROOF_SHA256=\nBATON2_MAIN_C_VERIFIER=\n' >> "$GITHUB_ENV"
          if [[ -n "$BATON2_RETAINED_MAIN_HANDOFF" && "$BATON2_LINUX_RUNNER" != homelab ]]; then
            printf '%s\n' 'Retained Main compilation requires the homelab runner.' >&2
            exit 1
          fi
          python3 .github/scripts/reuse-native-main.py prepare \
            --source "$GITHUB_WORKSPACE" --run "$BATON2_LINUX_RUN" \
            --handoff "$BATON2_RETAINED_MAIN_HANDOFF" \
            --handoff-sha256 "$BATON2_RETAINED_MAIN_SHA256" \
            --compiler "$BEND" \
            --compiler-archive "$BATON2_LINUX_RUN/bend-2.0.25-linux-x64.tar.gz" \
            --github-env "$GITHUB_ENV" \
            > "$BATON2_LINUX_RUN/evidence/main-c-reuse.stdout" \
            2> "$BATON2_LINUX_RUN/evidence/main-c-reuse.stderr"
          python3 - "$BATON2_RETAINED_MAIN_HANDOFF" "$BATON2_LINUX_RUN/evidence/main-c-reuse.json" <<'PY'
          import json, sys
          if sys.argv[1] and json.load(open(sys.argv[2]))['status'] != 'reused':
              raise SystemExit('The requested retained Main did not qualify for reuse; inspect retained evidence.')
          PY
      - name: Run complete native checks and affected candidate tests
        shell: bash
        run: |
          set -euo pipefail
          unset BEND_GENERATED_C
          ulimit -s unlimited
          ulimit -a > "$BATON2_LINUX_RUN/evidence/limits.txt"
          "$CC" --version > "$BATON2_LINUX_RUN/evidence/clang.txt"
          node --version > "$BATON2_LINUX_RUN/evidence/node.txt"
          python3 --version > "$BATON2_LINUX_RUN/evidence/python.txt"
          uname -a > "$BATON2_LINUX_RUN/evidence/host.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, runpy, subprocess, sys, time
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          run = pathlib.Path(os.environ['BATON2_LINUX_RUN'])
          evidence = run / 'evidence'
          recorder = root / '.github/scripts/record-native-checks.py'
          selected = runpy.run_path(str(recorder))['SELECTED']
          subprocess.run([sys.executable, str(recorder), 'shim', str(run / 'python-shim'), str(evidence / 'selected')], check=True)
          check_environment = dict(os.environ, PATH=str(run / 'python-shim') + os.pathsep + os.environ['PATH'])
          records = []
          def record(label, argv):
              started = time.time()
              with (evidence / (label + '.stdout')).open('wb') as stdout, (evidence / (label + '.stderr')).open('wb') as stderr:
                  result = subprocess.run(argv, cwd=root, stdout=stdout, stderr=stderr, env=check_environment)
              row = {'label': label, 'argv': argv, 'cwd': str(root), 'exit_code': result.returncode,
                     'elapsed_seconds': time.time() - started, 'stdout': label + '.stdout', 'stderr': label + '.stderr'}
              records.append(row)
              (evidence / 'results.json').write_text(json.dumps(records, indent=2) + '\n')
              if result.returncode:
                  raise SystemExit(result.returncode)
          record('complete-native', ['sh', 'bend2/scripts/check-native.sh'])
          main_binary = root / '.scratch/bend2/baton2'
          main_receipt = main_binary.with_name(main_binary.name + '.build.json')
          main_build = None
          if main_receipt.is_file():
              verification = subprocess.check_output([
                  sys.executable, str(root / '.github/scripts/reuse-native-main.py'), 'verify-build',
                  '--receipt', str(main_receipt), '--source', str(main_binary) + '.c',
                  '--entry', str(root / 'bend2/src/host/native-entry.c'),
                  '--output', str(main_binary)], text=True)
              main_build = json.loads(verification)
          selected_results = {name: json.loads((evidence / 'selected' / (name + '.json')).read_text()) for name in selected}
          assert all(result['judged'] and result['exit_code'] == 0 for result in selected_results.values())
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, text=True).strip()
          commit = git('rev-parse', 'HEAD')
          assert commit == os.environ['BATON2_SOURCE_SHA'], (commit, os.environ['BATON2_SOURCE_SHA'])
          assert not git('status', '--porcelain', '--untracked-files=no'), 'Checks changed tracked source'
          paths = subprocess.check_output(['git', 'ls-files', '-z'], cwd=root).decode().split('\0')
          source = {path: hashlib.sha256((root / path).read_bytes()).hexdigest()
                    for path in paths if path and (root / path).is_file()}
          (run / 'generated/source-manifest.json').write_text(json.dumps(source, indent=2) + '\n')
          c = root / '.scratch/bend2/baton2.c'
          binary = root / '.scratch/bend2/baton2'
          linux_binary = run / 'generated/baton2-linux-x64'
          linux_binary.write_bytes(binary.read_bytes())
          linux_binary.chmod(0o755)
          (run / 'generated/baton2.c').write_bytes(c.read_bytes())
          if main_build is not None:
              shutil.copyfile(binary.with_name(binary.name + '.o'), run / 'generated/baton2.o')
              shutil.copyfile(main_receipt, run / 'generated/baton2.build.json')
              object_copy_dir = run / 'generated/baton2-shard-objects'
              object_copy_dir.mkdir()
              for row in main_build['retained_objects']:
                  original = pathlib.Path(row['path'])
                  copied = object_copy_dir / row['object_name']
                  shutil.copyfile(original, copied)
                  row['copy_path'] = str(pathlib.Path('baton2-shard-objects') / row['object_name'])
                  row['size_bytes'] = copied.stat().st_size
                  row['sha256'] = hashlib.sha256(copied.read_bytes()).hexdigest()
              main_build = {key: main_build[key] for key in (
                  'route', 'receipt_sha256', 'output_sha256', 'object_sha256', 'retained_objects')}
          main_c_reuse = json.loads((run / 'generated/main-c-reuse.json').read_text())
          subprocess.run([sys.executable, str(root / '.github/scripts/reuse-native-main.py'), 'verify-transfer',
                          '--source', str(root), '--generated', str(run / 'generated')], check=True,
                         stdout=(evidence / 'main-c-reuse-verification.stdout').open('wb'),
                         stderr=(evidence / 'main-c-reuse-verification.stderr').open('wb'))
          handoff = {'schema': 'baton2-generated-c-handoff-v1', 'source_commit': commit,
                     'source_tree': git('rev-parse', 'HEAD^{tree}'), 'platform': platform.platform(),
                     'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'compiler_archive_sha256': hashlib.sha256((run / 'bend-2.0.25-linux-x64.tar.gz').read_bytes()).hexdigest(),
                     'compiler_binary_sha256': hashlib.sha256(pathlib.Path(os.environ['BEND']).read_bytes()).hexdigest(),
                     'compiler_selection_sha256': hashlib.sha256((run / 'generated/compiler-selection.json').read_bytes()).hexdigest(),
                     'generated_c_sha256': hashlib.sha256(c.read_bytes()).hexdigest(), 'generated_c_size': c.stat().st_size,
                     'linux_binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                     'linux_binary_path': 'baton2-linux-x64', 'linux_binary_size': linux_binary.stat().st_size,
                     'source_manifest_sha256': hashlib.sha256((run / 'generated/source-manifest.json').read_bytes()).hexdigest(),
                     'checks': records, 'selected_results': selected_results, 'main_c_reuse': main_c_reuse,
                     'main_native_build': main_build}
          (run / 'generated/handoff-manifest.json').write_text(json.dumps(handoff, indent=2) + '\n')
          if main_build is not None:
              verify_sharded_transfer = runpy.run_path(
                  str(root / '.github/scripts/reuse-native-main.py'))['verify_sharded_transfer']
              verify_sharded_transfer(main_build, run / 'generated/baton2.build.json',
                                      run / 'generated')
          PY
      - name: Retain required REPL compiler source inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/repl-package.py" source \
            --source "$GITHUB_WORKSPACE/bend2/compiler/upstream" \
            --output "$BATON2_LINUX_RUN/generated/repl-source"
      - name: Retain native object cache statistics
        if: always() && env.BATON2_CCACHE != ''
        shell: bash
        run: |
          "$BATON2_CCACHE" --show-stats \
            > "$BATON2_LINUX_RUN/evidence/native-object-cache-stats.stdout" \
            2> "$BATON2_LINUX_RUN/evidence/native-object-cache-stats.stderr"
      - name: Retain complete candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-linux-candidate-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ env.BATON2_LINUX_RUN }}/evidence/
          if-no-files-found: error
      - name: Retain requested Main compilation origin
        if: always() && inputs.retained_main_handoff != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-main-c-origin-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ env.BATON2_LINUX_RUN }}/generated/main-c-reuse.json
            ${{ env.BATON2_LINUX_RUN }}/generated/main-c-origin/
            ${{ env.BATON2_LINUX_RUN }}/generated/main-c-builds/
          if-no-files-found: error
      - name: Retain generated C and producer results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-generated-c-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ env.BATON2_LINUX_RUN }}/generated/
            ${{ env.BATON2_LINUX_RUN }}/evidence/
          if-no-files-found: error

  linux-target:
    if: ${{ !inputs.inspect_host }}
    permissions:
      contents: read
      actions: read
    runs-on: ${{ fromJSON(inputs.linux_runner == 'homelab' && '["self-hosted", "Linux", "X64", "baton2-native-linux-x64"]' || '["ubuntu-24.04"]') }}
    env:
      CC: ${{ inputs.linux_runner == 'homelab' && '/usr/bin/clang-19' || 'clang' }}
      BEND_NO_TELEMETRY: '1'
      BUN_JSC_maxPerThreadStackUsage: '67108864'
      BATON2_TARGET_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.target_commit }}
      BATON2_TARGET_BUILD_RUN: ${{ inputs.target_build_run }}
    steps:
      - name: Checkout candidate test contracts and target history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.BATON2_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Select homelab browser executable
        if: inputs.linux_runner == 'homelab'
        shell: bash
        run: printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Download completed target build evidence
        if: inputs.target_build_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.target_build_run }}
          pattern: baton2-linux-target-*-1
          merge-multiple: true
          path: ${{ runner.temp }}/baton2-target-build-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build exact target and measure affected candidate tests
        shell: bash
        env:
          BATON2_RETAINED_TARGET_MAIN_HANDOFF: ${{ inputs.retained_target_main_handoff }}
          BATON2_RETAINED_TARGET_MAIN_SHA256: ${{ inputs.retained_target_main_handoff_sha256 }}
          BATON2_RETAINED_TARGET_COMPILER_ARCHIVE: ${{ inputs.retained_target_compiler_archive }}
          BATON2_RETAINED_TARGET_COMPILER_SHA256: ${{ inputs.retained_target_compiler_archive_sha256 }}
          BATON2_RETAINED_COMPILER_ARCHIVE: ${{ inputs.retained_compiler_archive }}
          BATON2_RETAINED_COMPILER_SHA256: ${{ inputs.retained_compiler_archive_sha256 }}
          BATON2_RETAINED_CCACHE: ${{ inputs.retained_ccache }}
          BATON2_LINUX_RUNNER: ${{ inputs.linux_runner }}
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/baton2-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run"
          mkdir -p "$run/toolchain-home" "$run/evidence"
          printf 'BATON2_TARGET_RUN=%s\n' "$run" >> "$GITHUB_ENV"
          [[ "$BATON2_TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$run/source" > "$run/evidence/clone.stdout" 2> "$run/evidence/clone.stderr"
          git -C "$run/source" checkout --detach "$BATON2_TARGET_COMMIT" >> "$run/evidence/clone.stdout" 2>> "$run/evidence/clone.stderr"
          test "$(git -C "$run/source" rev-parse HEAD)" = "$BATON2_TARGET_COMMIT"
          archive="$run/bend-2.0.25-linux-x64.tar.gz"
          if [[ -n "$BATON2_RETAINED_TARGET_MAIN_HANDOFF" ]]; then
            test -z "$BATON2_TARGET_BUILD_RUN"
            test "$BATON2_LINUX_RUNNER" = homelab
            mkdir -p "$run/generated"
            if [[ -n "$BATON2_RETAINED_TARGET_COMPILER_ARCHIVE" || -n "$BATON2_RETAINED_TARGET_COMPILER_SHA256" ]]; then
              BATON2_RETAINED_COMPILER_ARCHIVE="$BATON2_RETAINED_TARGET_COMPILER_ARCHIVE"
              BATON2_RETAINED_COMPILER_SHA256="$BATON2_RETAINED_TARGET_COMPILER_SHA256"
            fi
            python3 .github/scripts/prepare-native-compiler.py --run "$run" \
              --archive "$BATON2_RETAINED_COMPILER_ARCHIVE" \
              --archive-sha256 "$BATON2_RETAINED_COMPILER_SHA256" \
              --ccache "$BATON2_RETAINED_CCACHE" --github-env "$run/evidence/target-build.env" \
              --runner "$BATON2_LINUX_RUNNER" \
              > "$run/evidence/compiler-selection.stdout" 2> "$run/evidence/compiler-selection.stderr"
            python3 .github/scripts/reuse-native-main.py prepare \
              --source "$run/source" --run "$run" \
              --handoff "$BATON2_RETAINED_TARGET_MAIN_HANDOFF" \
              --handoff-sha256 "$BATON2_RETAINED_TARGET_MAIN_SHA256" \
              --compiler "$run/toolchain-home/bin/bend" --compiler-archive "$archive" \
              --github-env "$run/evidence/target-build.env" \
              > "$run/evidence/main-c-reuse.stdout" 2> "$run/evidence/main-c-reuse.stderr"
            python3 - "$run/evidence/main-c-reuse.json" <<'PY'
          import json, sys
          if json.load(open(sys.argv[1]))['status'] != 'reused':
              raise SystemExit('The requested retained target Main did not qualify for reuse; inspect retained evidence.')
          PY
          else
            test -z "$BATON2_RETAINED_TARGET_MAIN_SHA256"
            curl --proto '=https' --tlsv1.2 -fsSL \
              https://github.com/bendlang/bend/releases/download/v2.0.25/bend-2.0.25-linux-x64.tar.gz \
              -o "$archive" > "$run/evidence/compiler-download.stdout" 2> "$run/evidence/compiler-download.stderr"
            printf '91c0e2640f8d2e3e73fd3dd62ed4d178ce9a6f7ce8f8980b4dc4abf7a6f9ccd4  %s\n' "$archive" | \
              sha256sum -c - > "$run/evidence/compiler-archive-check.stdout"
            tar -xzf "$archive" -C "$run/toolchain-home" --strip-components=1
          fi
          export BEND="$run/toolchain-home/bin/bend"
          sha256sum "$BEND" > "$run/evidence/compiler.sha256"
          export BATON2_TARGET_RUN="$run"
          unset BEND_GENERATED_C
          ulimit -s unlimited
          ulimit -a > "$run/evidence/limits.txt"
          "$CC" --version > "$run/evidence/clang.txt"
          node --version > "$run/evidence/node.txt"
          python3 --version > "$run/evidence/python.txt"
          uname -a > "$run/evidence/host.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, runpy, shutil, subprocess, sys, time
          candidate = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          run = pathlib.Path(os.environ['BATON2_TARGET_RUN'])
          target = run / 'source'
          evidence = run / 'evidence'
          recorder = candidate / '.github/scripts/record-native-checks.py'
          selected = runpy.run_path(str(recorder))['SELECTED']
          subprocess.run([sys.executable, str(recorder), 'shim', str(run / 'python-shim'), str(evidence / 'selected')], check=True)
          check_environment = dict(os.environ, PATH=str(run / 'python-shim') + os.pathsep + os.environ['PATH'])
          if os.environ.get('BATON2_RETAINED_TARGET_MAIN_HANDOFF'):
              for line in (evidence / 'target-build.env').read_text().splitlines():
                  key, value = line.split('=', 1)
                  check_environment[key] = value
          records = []
          def record(label, argv):
              started = time.time()
              with (evidence / (label + '.stdout')).open('wb') as stdout, (evidence / (label + '.stderr')).open('wb') as stderr:
                  result = subprocess.run(argv, cwd=target, stdout=stdout, stderr=stderr, env=check_environment)
              records.append({'label': label, 'argv': argv, 'cwd': str(target), 'exit_code': result.returncode,
                              'elapsed_seconds': time.time() - started, 'stdout': label + '.stdout', 'stderr': label + '.stderr'})
              (evidence / 'results.json').write_text(json.dumps(records, indent=2) + '\n')
              return result.returncode
          previous = os.environ.get('BATON2_TARGET_BUILD_RUN')
          if previous:
              transfer = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baton2-target-build-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
              status = record('target-build-reuse', [sys.executable, str(candidate / '.github/scripts/reuse-native-target.py'),
                              str(transfer), str(target), str(evidence), os.environ['BATON2_TARGET_COMMIT'], previous])
          else:
              status = record('target-build', ['sh', 'bend2/scripts/build-native.sh'])
          if status:
              raise SystemExit(status)
          if os.environ.get('BATON2_RETAINED_TARGET_MAIN_HANDOFF'):
              generated = run / 'generated'
              shutil.copyfile(target / '.scratch/bend2/baton2.c', generated / 'baton2.c')
              status = record('target-main-c-reuse-verification', [sys.executable,
                  str(candidate / '.github/scripts/reuse-native-main.py'), 'verify-transfer',
                  '--source', str(target), '--generated', str(generated)])
              if status:
                  raise SystemExit(status)
              shutil.copyfile(target / '.scratch/bend2/baton2', generated / 'baton2-linux-x64')
              shutil.copytree(generated, evidence / 'target-main-c-generated')
          contracts = {}
          for name in selected:
              relative = 'bend2/test/' + name
              original = candidate / relative
              contracts[relative] = hashlib.sha256(original.read_bytes()).hexdigest()
              shutil.copyfile(original, target / relative)
          for original in sorted((candidate / 'bend2/test').glob('*.c')):
              relative = 'bend2/test/' + original.name
              contracts[relative] = hashlib.sha256(original.read_bytes()).hexdigest()
              shutil.copyfile(original, target / relative)
          (evidence / 'comparison.json').write_text(json.dumps({
              'target_commit': os.environ['BATON2_TARGET_COMMIT'], 'candidate_commit': os.environ['BATON2_SOURCE_SHA'],
              'test_contracts': contracts,
              'method': 'Candidate test contracts and C fixtures execute against the exact target production build and target helpers.'
          }, indent=2) + '\n')
          for name in selected:
              record('target-' + name, ['python3', 'bend2/test/' + name, '-v'])
          outcomes = {name: json.loads((evidence / 'selected' / (name + '.json')).read_text()) for name in selected}
          assert all(result['judged'] for result in outcomes.values()), 'Target comparison is incomplete'
          PY
      - name: Retain complete target comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-linux-target-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ env.BATON2_TARGET_RUN }}/evidence/
          if-no-files-found: error

  darwin-arm64:
    if: ${{ !inputs.inspect_host }}
    needs: [linux-candidate, linux-target]
    runs-on: macos-15
    env:
      BATON2_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.BATON2_SOURCE_SHA }}
          persist-credentials: false

      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download qualified generated C and complete producer results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baton2-generated-c-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baton2-generated-c-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download complete target comparison
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baton2-linux-target-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baton2-target-results-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create owned build clone and install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/baton2-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run"
          mkdir -p "$run/toolchain"
          printf 'BATON2_NATIVE_RUN=%s\n' "$run" >> "$GITHUB_ENV"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$run/build-source" > "$run/clone.log" 2>&1
          git -C "$run/build-source" checkout --detach "$BATON2_SOURCE_SHA" >> "$run/clone.log" 2>&1
          test "$(git -C "$run/build-source" rev-parse HEAD)" = "$BATON2_SOURCE_SHA"
          archive="$run/toolchain/bend-2.0.25-darwin-arm64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/bendlang/bend/releases/download/v2.0.25/bend-2.0.25-darwin-arm64.tar.gz \
            -o "$archive" > "$run/toolchain/download.log" 2>&1
          printf 'c5bb22ba029d5909da9c6db82aa037278a66d1cf8a5572f433879f7dcd866c31  %s\n' "$archive" | \
            shasum -a 256 -c - > "$run/toolchain/archive-check.log" 2>&1
          test ! -e "$run/toolchain-home"
          BEND_HOME="$run/toolchain-home" sh "$run/build-source/docs/bend2/reference/toolchain/install-2.0.25.sh" \
            > "$run/toolchain/install.log" 2>&1
          npm install --prefix "$run/typescript-runtime" --ignore-scripts --no-audit --no-fund \
            typescript@5.9.3 > "$run/typescript-install.stdout" 2> "$run/typescript-install.stderr"

      - name: Prepare required Darwin REPL runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/repl-package.py" runtime \
            --output "$BATON2_NATIVE_RUN/repl-runtime"

      - name: Verify generated C against exact producer source and results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, runpy, subprocess
          root = pathlib.Path(os.environ['BATON2_NATIVE_RUN']) / 'build-source'
          transfer = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baton2-generated-c-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          generated = transfer / 'generated'
          handoff = json.loads((generated / 'handoff-manifest.json').read_text())
          assert handoff['source_commit'] == os.environ['BATON2_SOURCE_SHA']
          assert handoff['source_tree'] == subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], cwd=root, text=True).strip()
          assert handoff['workflow_run_id'] == os.environ['GITHUB_RUN_ID']
          assert handoff['workflow_run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          compilers = runpy.run_path(str(root / '.github/scripts/reuse-native-main.py'))['COMPILER_ARCHIVES']
          assert handoff['compiler_archive_sha256'] in compilers
          selection_path = generated / 'compiler-selection.json'
          assert hashlib.sha256(selection_path.read_bytes()).hexdigest() == handoff['compiler_selection_sha256']
          selection = json.loads(selection_path.read_text())
          assert selection['schema'] == 'baton2-linux-compiler-selection-v1'
          assert selection['compiler_archive_sha256'] == handoff['compiler_archive_sha256']
          assert selection['compiler_binary_sha256'] == handoff['compiler_binary_sha256']
          identity = compilers[handoff['compiler_archive_sha256']]
          assert all(selection[key] == value for key, value in identity.items())
          if 'binary_sha256' in identity:
              assert handoff['compiler_binary_sha256'] == identity['binary_sha256']
          manifest_path = generated / 'source-manifest.json'
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == handoff['source_manifest_sha256']
          source = json.loads(manifest_path.read_text())
          paths = subprocess.check_output(['git', 'ls-files', '-z'], cwd=root).decode().split('\0')
          current = {path: hashlib.sha256((root / path).read_bytes()).hexdigest()
                     for path in paths if path and (root / path).is_file()}
          assert current == source, 'Transferred C producer source differs from package source'
          c = generated / 'baton2.c'
          assert c.stat().st_size == handoff['generated_c_size']
          assert hashlib.sha256(c.read_bytes()).hexdigest() == handoff['generated_c_sha256']
          assert handoff['linux_binary_path'] == 'baton2-linux-x64'
          linux_binary = generated / handoff['linux_binary_path']
          assert linux_binary.is_file() and not linux_binary.is_symlink()
          assert linux_binary.stat().st_size == handoff['linux_binary_size']
          assert hashlib.sha256(linux_binary.read_bytes()).hexdigest() == handoff['linux_binary_sha256']
          native_build = handoff.get('main_native_build')
          if native_build is not None:
              object_file = generated / 'baton2.o'
              build_receipt = generated / 'baton2.build.json'
              assert object_file.is_file() and not object_file.is_symlink()
              assert build_receipt.is_file() and not build_receipt.is_symlink()
              assert hashlib.sha256(object_file.read_bytes()).hexdigest() == native_build['object_sha256']
              assert hashlib.sha256(build_receipt.read_bytes()).hexdigest() == native_build['receipt_sha256']
              assert hashlib.sha256(linux_binary.read_bytes()).hexdigest() == native_build['output_sha256']
              subprocess.run(['python3', str(root / '.github/scripts/reuse-native-main.py'),
                  'verify-sharded-transfer', '--handoff', str(generated / 'handoff-manifest.json'),
                  '--generated', str(generated)], check=True)
          main_c_reuse = json.loads((generated / 'main-c-reuse.json').read_text())
          assert main_c_reuse == handoff['main_c_reuse']
          subprocess.run(['python3', str(root / '.github/scripts/reuse-native-main.py'), 'verify-transfer',
                          '--source', str(root), '--generated', str(generated)], check=True)
          assert {row['label'] for row in handoff['checks']} == {'complete-native'}
          assert all(row['exit_code'] == 0 for row in handoff['checks'])
          recorder = root / '.github/scripts/record-native-checks.py'
          selected = runpy.run_path(str(recorder))['SELECTED']
          assert set(handoff['selected_results']) == set(selected)
          assert all(row['judged'] and row['exit_code'] == 0 for row in handoff['selected_results'].values())
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baton2-target-results-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          subprocess.run(['python3', str(recorder), 'compare', str(transfer / 'evidence/selected'),
                          str(target / 'selected'), str(pathlib.Path(os.environ['BATON2_NATIVE_RUN']) / 'selected-comparison.json')], check=True)
          (pathlib.Path(os.environ['BATON2_NATIVE_RUN']) / 'generated-c-verification.json').write_text(json.dumps({
              'status': 'verified', 'source_commit': handoff['source_commit'],
              'generated_c_sha256': handoff['generated_c_sha256'], 'producer': handoff
          }, indent=2) + '\n')
          PY

      - name: Build and package native artifact
        shell: bash
        run: |
          set -euo pipefail
          export BUN_JSC_maxPerThreadStackUsage=67108864
          unset BEND_GENERATED_C
          settings="$BATON2_NATIVE_RUN/build-settings"
          test ! -e "$settings"
          mkdir "$settings"
          clang --version > "$settings/clang.txt"
          node --version > "$settings/node.txt"
          python3 --version > "$settings/python.txt"
          uname -a > "$settings/host.txt"
          printf 'GITHUB_SHA=%s\nGITHUB_RUN_ID=%s\nGITHUB_RUN_ATTEMPT=%s\nBUN_JSC_maxPerThreadStackUsage=%s\nBEND_ARGUMENT=%s\nCC=%s\nBEND_GENERATED_C=%s\n' \
            "$BATON2_SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$BUN_JSC_maxPerThreadStackUsage" "$BATON2_NATIVE_RUN/toolchain-home/bin/bend" \
            "${CC:-clang}" "${BEND_GENERATED_C:-}" > "$settings/environment.txt"
          cp "$BATON2_NATIVE_RUN/build-source/.github/workflows/bend2-native.yml" "$settings/workflow.yml"
          shasum -a 256 "$BATON2_NATIVE_RUN/toolchain-home/bin/bend" > "$settings/compiler.sha256"
          stat -L -f '%z' "$BATON2_NATIVE_RUN/toolchain-home/bin/bend" > "$settings/compiler.size"
          file -L "$BATON2_NATIVE_RUN/toolchain-home/bin/bend" > "$settings/compiler.file"
          ulimit -a > "$settings/limits-soft-before.txt"
          ulimit -H -a > "$settings/limits-hard-before.txt"
          requested_stack_kib=65536
          hard_stack_kib=$(ulimit -H -s)
          chosen_stack_kib="$requested_stack_kib"
          case "$hard_stack_kib" in
            unlimited) ;;
            ''|*[!0-9]*)
              printf 'Invalid inherited stack hard limit: %s\n' "$hard_stack_kib" \
                > "$settings/stack-selection.stderr"
              exit 1
              ;;
            *)
              if [ "$hard_stack_kib" -lt "$chosen_stack_kib" ]; then
                chosen_stack_kib="$hard_stack_kib"
              fi
              ;;
          esac
          printf 'requested_kib=%s\ninherited_hard_kib=%s\nchosen_kib=%s\n' \
            "$requested_stack_kib" "$hard_stack_kib" "$chosen_stack_kib" \
            > "$settings/stack-selection.txt"
          stack_status=0
          ulimit -S -s "$chosen_stack_kib" > "$settings/stack-setting.stdout" \
            2> "$settings/stack-setting.stderr" || stack_status=$?
          printf '%s\n' "$stack_status" > "$settings/stack-setting.status"
          ulimit -a > "$settings/limits-soft-after.txt"
          ulimit -H -a > "$settings/limits-hard-after.txt"
          ulimit -s > "$settings/stack-kib.txt"
          test "$stack_status" -eq 0
          test "$(cat "$settings/stack-kib.txt")" = "$chosen_stack_kib"
          package_args=(
            --output "$BATON2_NATIVE_RUN/package"
            --bend "$BATON2_NATIVE_RUN/toolchain-home/bin/bend"
            --compiler-archive "$BATON2_NATIVE_RUN/toolchain/bend-2.0.25-darwin-arm64.tar.gz"
            --generated-c "$RUNNER_TEMP/baton2-generated-c-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/generated/baton2.c"
            --context-typescript-package "$BATON2_NATIVE_RUN/typescript-runtime/node_modules/typescript"
          )
          runtime_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["binary"]["sha256"])' "$BATON2_NATIVE_RUN/repl-runtime/runtime.json")
          package_args+=(
            --repl-compiler-source "$RUNNER_TEMP/baton2-generated-c-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/generated/repl-source/source"
            --repl-runtime "$BATON2_NATIVE_RUN/repl-runtime/bun"
            --repl-runtime-sha256 "$runtime_sha"
            --repl-runtime-notices "$BATON2_NATIVE_RUN/repl-runtime/Bun-NOTICES"
          )
          if [[ -n "$BATON2_RELEASE_VERSION" ]]; then
            package_args+=(--release-version "$BATON2_RELEASE_VERSION")
          fi
          python3 "$BATON2_NATIVE_RUN/build-source/bend2/scripts/package-native.py" "${package_args[@]}" \
            > "$BATON2_NATIVE_RUN/package-command.stdout" \
            2> "$BATON2_NATIVE_RUN/package-command.stderr"

      - name: Bind complete producer and comparison evidence to the package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, tarfile
          run = pathlib.Path(os.environ['BATON2_NATIVE_RUN'])
          package = run / 'package'
          manifest = json.loads((package / 'manifest.json').read_text())
          assert manifest['source']['commit'] == os.environ['BATON2_SOURCE_SHA']
          assert not manifest['source']['status'], 'Package source is dirty'
          payload = package / manifest['archive_root']
          provenance = payload / 'share/baton2/generated-c-provenance'
          transfer = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baton2-generated-c-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          shutil.copytree(transfer / 'generated', provenance)
          shutil.copytree(transfer / 'evidence', provenance / 'producer-results')
          selected_repl = [row for row in manifest.get('selected_dependencies', []) if row['id'] == 'bend2-repl-compiler']
          assert len(selected_repl) == 1 and selected_repl[0]['required'] is True
          shutil.copyfile(run / 'repl-runtime/runtime.json', provenance / 'repl-runtime.json')
          runtime = json.loads((run / 'repl-runtime/runtime.json').read_text())
          dependency = selected_repl[0]
          compiler_manifest = payload / dependency['path'] / dependency['manifest']
          assert hashlib.sha256(compiler_manifest.read_bytes()).hexdigest() == dependency['sha256']
          compiler = json.loads(compiler_manifest.read_text())
          assert compiler['runtimeSha256'] == runtime['binary']['sha256']
          assert hashlib.sha256((payload / dependency['path'] / 'notices/Bun-NOTICES').read_bytes()).hexdigest() == runtime['notices']['sha256']
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baton2-target-results-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          shutil.copytree(target, provenance / 'target-comparison')
          shutil.copyfile(run / 'generated-c-verification.json', provenance / 'verification.json')
          shutil.copyfile(run / 'selected-comparison.json', provenance / 'selected-comparison.json')
          assets = [{'path': str(path.relative_to(payload)), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                     'size': path.stat().st_size} for path in sorted(provenance.rglob('*')) if path.is_file()]
          manifest['build']['generated_c_provenance'] = {'path': str(provenance.relative_to(payload)), 'assets': assets}
          manifest['binary']['sha256'] = hashlib.sha256((payload / 'bin/baton2').read_bytes()).hexdigest()
          manifest['build']['typescript_package_lock_sha256'] = hashlib.sha256((run / 'typescript-runtime/package-lock.json').read_bytes()).hexdigest()
          for path in (payload / 'manifest.json', package / 'manifest.json'):
              path.write_text(json.dumps(manifest, indent=2) + '\n')
          result = json.loads((package / 'result.json').read_text())
          archive = package / result['archive']['path']
          replacement = package / (archive.name + '.new')
          with tarfile.open(replacement, 'x:gz') as output:
              output.add(payload, arcname=manifest['archive_root'])
          replacement.replace(archive)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (package / 'SHA256SUMS').write_text(digest + '  ' + archive.name + '\n')
          result['archive']['sha256'] = digest
          (package / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          PY

      - name: Exercise extracted artifact with build path unavailable
        shell: bash
        run: |
          set -euo pipefail
          build="$BATON2_NATIVE_RUN/build-source"
          retained="$BATON2_NATIVE_RUN/build-source-retained"
          test ! -e "$retained"
          mv "$build" "$retained"
          trap 'mv "$retained" "$build"' EXIT
          package="$BATON2_NATIVE_RUN/package"
          sums="$package/SHA256SUMS"
          test "$(wc -l < "$sums")" -eq 1
          read -r sha archive_name < "$sums"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          test "$archive_name" = "$(basename "$archive_name")"
          [[ "$archive_name" == baton2-*-darwin-arm64-"$BATON2_SOURCE_SHA".tar.gz ]]
          printf '%s  %s\n' "$sha" "$archive_name" | cmp - "$sums"
          (cd "$package" && shasum -a 256 -c SHA256SUMS)
          archive="$package/$archive_name"
          python3 "$GITHUB_WORKSPACE/bend2/scripts/smoke-native-artifact.py" \
            --archive "$archive" --sha256 "$sha" \
            --manifest "$package/manifest.json" \
            --unavailable-source "$build" --output "$BATON2_NATIVE_RUN/smoke" \
            > "$BATON2_NATIVE_RUN/smoke-command.stdout" \
            2> "$BATON2_NATIVE_RUN/smoke-command.stderr"
          installed_prefix=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["extracted_prefix"])' "$BATON2_NATIVE_RUN/smoke/summary.json")
          python3 "$GITHUB_WORKSPACE/.github/scripts/repl-package.py" smoke \
            --prefix "$installed_prefix" --output "$BATON2_NATIVE_RUN/repl-smoke" \
            > "$BATON2_NATIVE_RUN/repl-smoke-command.stdout" \
            2> "$BATON2_NATIVE_RUN/repl-smoke-command.stderr"

      - name: Retain native artifact and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-${{ github.event_name == 'workflow_dispatch' && inputs.release_version || 'development' }}-darwin-arm64-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ env.BATON2_NATIVE_RUN }}/package/
            ${{ env.BATON2_NATIVE_RUN }}/smoke/
            ${{ env.BATON2_NATIVE_RUN }}/toolchain/
            ${{ env.BATON2_NATIVE_RUN }}/build-settings/
            ${{ env.BATON2_NATIVE_RUN }}/generated-c-verification.json
            ${{ env.BATON2_NATIVE_RUN }}/selected-comparison.json
            ${{ env.BATON2_NATIVE_RUN }}/typescript-runtime/package-lock.json
            ${{ env.BATON2_NATIVE_RUN }}/repl-runtime/
            ${{ env.BATON2_NATIVE_RUN }}/repl-smoke/
            ${{ env.BATON2_NATIVE_RUN }}/repl-smoke-command.*
            ${{ env.BATON2_NATIVE_RUN }}/typescript-install.stdout
            ${{ env.BATON2_NATIVE_RUN }}/typescript-install.stderr
            ${{ env.BATON2_NATIVE_RUN }}/clone.log
            ${{ env.BATON2_NATIVE_RUN }}/package-command.stdout
            ${{ env.BATON2_NATIVE_RUN }}/package-command.stderr
            ${{ env.BATON2_NATIVE_RUN }}/smoke-command.stdout
            ${{ env.BATON2_NATIVE_RUN }}/smoke-command.stderr
          if-no-files-found: error
          include-hidden-files: true
