name: bend2-native-development

'on':
  pull_request:
    paths:
      - '.github/workflows/bend2-native.yml'
      - '.github/scripts/record-native-checks.py'
      - '.github/scripts/queue-native-checks.py'
      - '.github/scripts/reuse-native-target.py'
      - '.github/scripts/package-native-target-handoff.py'
      - '.github/scripts/reuse-native-main.py'
      - '.github/scripts/reuse-native-recovery.py'
      - '.github/scripts/test-reuse-native-recovery.py'
      - '.github/scripts/prepare-native-compiler.py'
      - '.github/scripts/repl-package.py'
      - 'LICENSE'
      - 'NOTICE'
      - 'bend2/src/**'
      - 'bend2/test/**'
      - 'bend2/scripts/build-native.sh'
      - 'bend2/scripts/darwin-arm64-clang.sh'
      - 'bend2/scripts/package-native.py'
      - 'bend2/scripts/stage-repl-compiler.py'
      - 'bend2/scripts/check-install.py'
      - 'bend2/scripts/stage-native-install.py'
      - 'bend2/compiler/**'
      - 'bend2/scripts/smoke-native-artifact.py'
      - 'bend2/scripts/*.mjs'
      - 'bend2/harness/**'
      - 'bend2/ui/**'
      - 'bend2/context/**'
      - 'docs/bend2/reference/toolchain/install-2.0.25.sh'
      - 'docs/bend2/reference/upstream/LICENSE'
# Push-triggered automatic validation stays disabled until the shared host
# admission from #677/#819 is installed. Dispatch an exact source commit.
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release archive version; leave blank for a development archive'
        required: false
        default: ''
        type: string
      source_commit:
        description: 'Exact candidate source commit; leave blank for the dispatched ref'
        required: false
        default: ''
        type: string
      reuse_generated_c_producer:
        description: 'Existing generated-C producer run and attempt as RUN_ID/ATTEMPT; skips Linux candidate production'
        required: false
        default: ''
        type: string
      target_commit:
        description: 'Optional exact target commit for the post-package affected behavior comparison'
        required: false
        default: ''
        type: string
      retained_main_handoff:
        description: 'Homelab completed Main handoff path or single-match glob; $HOME uses the selected runner home'
        required: false
        default: ''
        type: string
      retained_main_handoff_sha256:
        description: 'Exact SHA256 of the completed Main handoff'
        required: false
        default: ''
        type: string
      retained_compiler_archive:
        description: 'Pinned compiler archive on the homelab; $RUNNER_TEMP uses the selected runner namespace'
        required: false
        default: '/var/tmp/baton2-compile-queue/toolchains/compiler-unit-process-cleanup-sol-20261028/bend-2.0.25-linux-x64-compiler-unit-process-cleanup-sol-20261028.tar.gz'
        type: string
      retained_compiler_archive_sha256:
        description: 'Exact SHA256 of the selected pinned compiler archive'
        required: false
        default: '113a272649904e80144b1954dba8b4999249efa408a6ce1ca346906114986c4d'
        type: string
      retained_ccache:
        description: 'Measured private ccache wrapper on the homelab; leave blank for direct native compilation'
        required: false
        default: ''
        type: string
      compiler_diagnostics:
        description: 'Record compiler stages and memory observations during this run'
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  contents: read

concurrency:
  group: bend2-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BATON2_SOURCE_SHA: ${{ inputs.source_commit || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
  BEND_COMPILER_DIAGNOSTICS: ${{ inputs.compiler_diagnostics && '1' || '' }}

jobs:
  linux-candidate:
    if: ${{ inputs.reuse_generated_c_producer == '' }}
    timeout-minutes: 4320
    runs-on:
      group: baton2-native-homelab
      labels: [self-hosted, Linux, X64, baton2-native-linux-x64]
    env:
      CC: /usr/bin/clang-19
      BEND_NO_TELEMETRY: '1'
      BUN_JSC_maxPerThreadStackUsage: '67108864'
    steps:
      - name: Validate exact source commit
        shell: bash
        run: '[[ "$BATON2_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.BATON2_SOURCE_SHA }}
          persist-credentials: false
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Select homelab browser executable
        shell: bash
        run: printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prepare candidate compiler
        shell: bash
        env:
          BATON2_RETAINED_COMPILER_ARCHIVE: ${{ inputs.retained_compiler_archive || '/var/tmp/baton2-compile-queue/toolchains/compiler-unit-process-cleanup-sol-20261028/bend-2.0.25-linux-x64-compiler-unit-process-cleanup-sol-20261028.tar.gz' }}
          BATON2_RETAINED_COMPILER_SHA256: ${{ inputs.retained_compiler_archive_sha256 || '113a272649904e80144b1954dba8b4999249efa408a6ce1ca346906114986c4d' }}
          BATON2_RETAINED_CCACHE: ${{ inputs.retained_ccache }}
          BATON2_LINUX_RUNNER: homelab
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/baton2-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run"
          mkdir -p "$run/toolchain-home" "$run/evidence" "$run/generated"
          printf 'BATON2_LINUX_RUN=%s\n' "$run" >> "$GITHUB_ENV"
          python3 .github/scripts/prepare-native-compiler.py --run "$run" \
            --archive "$BATON2_RETAINED_COMPILER_ARCHIVE" \
            --archive-sha256 "$BATON2_RETAINED_COMPILER_SHA256" \
            --ccache "$BATON2_RETAINED_CCACHE" --github-env "$GITHUB_ENV" \
            --runner "$BATON2_LINUX_RUNNER" \
            > "$run/evidence/compiler-selection.stdout" 2> "$run/evidence/compiler-selection.stderr"
          printf 'BEND=%s\n' "$run/toolchain-home/bin/bend" >> "$GITHUB_ENV"
          sha256sum "$run/toolchain-home/bin/bend" > "$run/evidence/compiler.sha256"
      - name: Verify optional retained Main compilation
        shell: bash
        env:
          BATON2_RETAINED_MAIN_HANDOFF: ${{ inputs.retained_main_handoff }}
          BATON2_RETAINED_MAIN_SHA256: ${{ inputs.retained_main_handoff_sha256 }}
          BATON2_LINUX_RUNNER: homelab
        run: |
          set -euo pipefail
          printf 'BATON2_MAIN_GENERATED_C=\nBATON2_MAIN_GENERATED_C_ROOT=\nBATON2_MAIN_GENERATED_C_PROOF=\nBATON2_MAIN_GENERATED_C_PROOF_SHA256=\nBATON2_MAIN_C_VERIFIER=\n' >> "$GITHUB_ENV"
          if [[ -n "$BATON2_RETAINED_MAIN_HANDOFF" && "$BATON2_LINUX_RUNNER" != homelab ]]; then
            printf '%s\n' 'Retained Main compilation requires the homelab runner.' >&2
            exit 1
          fi
          python3 .github/scripts/reuse-native-main.py prepare \
            --source "$GITHUB_WORKSPACE" --run "$BATON2_LINUX_RUN" \
            --handoff "$BATON2_RETAINED_MAIN_HANDOFF" \
            --handoff-sha256 "$BATON2_RETAINED_MAIN_SHA256" \
            --compiler "$BEND" \
            --compiler-archive "$BATON2_LINUX_RUN/bend-2.0.25-linux-x64.tar.gz" \
            --github-env "$GITHUB_ENV" \
            > "$BATON2_LINUX_RUN/evidence/main-c-reuse.stdout" \
            2> "$BATON2_LINUX_RUN/evidence/main-c-reuse.stderr"
      - name: Select the Main C producer
        id: route
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BATON2_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          BATON2_ORIGIN_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/native-producer-route.py route \
            --source "$GITHUB_WORKSPACE" --run "$BATON2_LINUX_RUN" --event "$GITHUB_EVENT_NAME" \
            --base "$BATON2_PULL_REQUEST_BASE" --head "$BATON2_SOURCE_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            > "$BATON2_LINUX_RUN/evidence/producer-route.stdout" \
            2> "$BATON2_LINUX_RUN/evidence/producer-route.stderr"
      - name: Produce Main C from the base commit
        if: ${{ steps.route.outputs.producer == 'base' }}
        shell: bash
        env:
          BATON2_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          unset BEND_GENERATED_C
          ulimit -s unlimited
          ulimit -a > "$BATON2_LINUX_RUN/evidence/limits.txt"
          "$CC" --version > "$BATON2_LINUX_RUN/evidence/clang.txt"
          uname -a > "$BATON2_LINUX_RUN/evidence/host.txt"
          python3 .github/scripts/native-producer-route.py produce \
            --source "$GITHUB_WORKSPACE" --run "$BATON2_LINUX_RUN" --base "$BATON2_PULL_REQUEST_BASE"
      - name: Produce exact-source Main C and Linux binary
        if: ${{ steps.route.outputs.producer != 'base' }}
        shell: bash
        run: |
          set -euo pipefail
          unset BEND_GENERATED_C
          ulimit -s unlimited
          ulimit -a > "$BATON2_LINUX_RUN/evidence/limits.txt"
          "$CC" --version > "$BATON2_LINUX_RUN/evidence/clang.txt"
          uname -a > "$BATON2_LINUX_RUN/evidence/host.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, runpy, subprocess, sys, time
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          run = pathlib.Path(os.environ['BATON2_LINUX_RUN'])
          evidence = run / 'evidence'
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, text=True).strip()
          commit = git('rev-parse', 'HEAD')
          assert commit == os.environ['BATON2_SOURCE_SHA'], (commit, os.environ['BATON2_SOURCE_SHA'])
          assert not git('status', '--porcelain', '--untracked-files=no'), 'Checks changed tracked source'
          source_tree = git('rev-parse', 'HEAD^{tree}')
          checks = [{'label': 'exact-source-identity', 'exit_code': 0,
                     'source_commit': commit, 'source_tree': source_tree}]
          compiler_selection = json.loads((run / 'generated/compiler-selection.json').read_text())
          compiler_archive_sha256 = hashlib.sha256((run / 'bend-2.0.25-linux-x64.tar.gz').read_bytes()).hexdigest()
          assert compiler_selection['compiler_archive_sha256'] == compiler_archive_sha256
          assert compiler_selection['compiler_binary_sha256'] == hashlib.sha256(pathlib.Path(os.environ['BEND']).read_bytes()).hexdigest()
          compilers = runpy.run_path(str(root / '.github/scripts/reuse-native-main.py'))['COMPILER_ARCHIVES']
          assert compiler_archive_sha256 in compilers
          compiler_identity = compilers[compiler_archive_sha256]
          assert all(compiler_selection[key] == value for key, value in compiler_identity.items())
          if 'binary_sha256' in compiler_identity:
              assert compiler_selection['compiler_binary_sha256'] == compiler_identity['binary_sha256']
          checks.append({'label': 'pinned-compiler-identity', 'exit_code': 0,
                         'archive_sha256': compiler_archive_sha256,
                         'binary_sha256': compiler_selection['compiler_binary_sha256'],
                         'selection_sha256': hashlib.sha256((run / 'generated/compiler-selection.json').read_bytes()).hexdigest()})
          queue = runpy.run_path(str(root / '.github/scripts/queue-native-checks.py'))
          os.environ['BATON2_QUEUE_RUN_ROOT'] = str(run / 'compile-queue')
          build_environment = queue['environment'](run)
          argv = ['sh', 'bend2/scripts/build-native.sh']
          started = time.time()
          with (evidence / 'main-native-build.stdout').open('wb') as stdout, \
               (evidence / 'main-native-build.stderr').open('wb') as stderr:
              result = subprocess.run(argv, cwd=root, stdout=stdout, stderr=stderr, env=build_environment)
          build_check = {'label': 'main-native-build', 'argv': argv, 'cwd': str(root),
                   'exit_code': result.returncode, 'elapsed_seconds': time.time() - started,
                   'stdout': 'main-native-build.stdout', 'stderr': 'main-native-build.stderr'}
          checks.append(build_check)
          (evidence / 'producer-checks.json').write_text(json.dumps(checks, indent=2) + '\n')
          if result.returncode:
              raise SystemExit(result.returncode)
          assert not git('status', '--porcelain', '--untracked-files=no'), 'Main build changed tracked source'
          paths = subprocess.check_output(['git', 'ls-files', '-z'], cwd=root).decode().split('\0')
          source = {path: hashlib.sha256((root / path).read_bytes()).hexdigest()
                    for path in paths if path and (root / path).is_file()}
          (run / 'generated/source-manifest.json').write_text(json.dumps(source, indent=2) + '\n')
          c = root / '.scratch/bend2/baton2.c'
          binary = root / '.scratch/bend2/baton2'
          linux_binary = run / 'generated/baton2-linux-x64'
          linux_binary.write_bytes(binary.read_bytes())
          linux_binary.chmod(0o755)
          (run / 'generated/baton2.c').write_bytes(c.read_bytes())
          main_c_reuse = json.loads((run / 'generated/main-c-reuse.json').read_text())
          verify_argv = [sys.executable, str(root / '.github/scripts/reuse-native-main.py'), 'verify-transfer',
                         '--source', str(root), '--generated', str(run / 'generated')]
          started = time.time()
          with (evidence / 'main-c-reuse-verification.stdout').open('wb') as stdout, \
               (evidence / 'main-c-reuse-verification.stderr').open('wb') as stderr:
              verified = subprocess.run(verify_argv, cwd=root, stdout=stdout, stderr=stderr)
          checks.append({'label': 'main-c-reuse-transfer-verification', 'argv': verify_argv,
                         'cwd': str(root), 'exit_code': verified.returncode,
                         'elapsed_seconds': time.time() - started,
                         'stdout': 'main-c-reuse-verification.stdout',
                         'stderr': 'main-c-reuse-verification.stderr'})
          (evidence / 'producer-checks.json').write_text(json.dumps(checks, indent=2) + '\n')
          if verified.returncode:
              raise SystemExit(verified.returncode)
          handoff = {'schema': 'baton2-generated-c-handoff-v1', 'source_commit': commit,
                     'source_tree': source_tree, 'platform': platform.platform(),
                     'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'compiler_archive_sha256': compiler_archive_sha256,
                     'compiler_binary_sha256': hashlib.sha256(pathlib.Path(os.environ['BEND']).read_bytes()).hexdigest(),
                     'compiler_selection_sha256': hashlib.sha256((run / 'generated/compiler-selection.json').read_bytes()).hexdigest(),
                     'generated_c_sha256': hashlib.sha256(c.read_bytes()).hexdigest(), 'generated_c_size': c.stat().st_size,
                     'linux_binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                     'linux_binary_path': 'baton2-linux-x64', 'linux_binary_size': linux_binary.stat().st_size,
                     'source_manifest_sha256': hashlib.sha256((run / 'generated/source-manifest.json').read_bytes()).hexdigest(),
                     'checks': checks, 'main_c_reuse': main_c_reuse}
          (run / 'generated/handoff-manifest.json').write_text(json.dumps(handoff, indent=2) + '\n')
          PY
      - name: Cancel candidate compile queue requests
        if: cancelled() && env.BATON2_LINUX_RUN != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$BATON2_LINUX_RUN/queue-config.json" ]]; then
            python3 .github/scripts/queue-native-checks.py cancel "$BATON2_LINUX_RUN"
          fi
      - name: Retain required REPL compiler source inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/repl-package.py" source \
            --source "$GITHUB_WORKSPACE/bend2/compiler/upstream" \
            --output "$BATON2_LINUX_RUN/generated/repl-source"
      - name: Retain native object cache statistics
        if: always() && env.BATON2_CCACHE != ''
        shell: bash
        run: |
          "$BATON2_CCACHE" --show-stats \
            > "$BATON2_LINUX_RUN/evidence/native-object-cache-stats.stdout" \
            2> "$BATON2_LINUX_RUN/evidence/native-object-cache-stats.stderr"
      - name: Retain Main producer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-linux-producer-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ env.BATON2_LINUX_RUN }}/evidence/
          if-no-files-found: error
      - name: Retain requested Main compilation origin
        if: always() && inputs.retained_main_handoff != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-main-c-origin-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ env.BATON2_LINUX_RUN }}/generated/main-c-reuse.json
            ${{ env.BATON2_LINUX_RUN }}/generated/main-c-origin/
            ${{ env.BATON2_LINUX_RUN }}/generated/main-c-builds/
          if-no-files-found: error
      - name: Retain generated C and producer results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-generated-c-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ env.BATON2_LINUX_RUN }}/generated/
            ${{ env.BATON2_LINUX_RUN }}/evidence/
          if-no-files-found: error

  linux-native-qualification:
    needs: [darwin-arm64]
    if: ${{ !cancelled() && inputs.reuse_generated_c_producer == '' }}
    timeout-minutes: 4320
    runs-on:
      group: baton2-native-homelab
      labels: [self-hosted, Linux, X64, baton2-native-linux-x64]
    env:
      CC: /usr/bin/clang-19
      BEND_NO_TELEMETRY: '1'
      BUN_JSC_maxPerThreadStackUsage: '67108864'
    steps:
      - name: Validate exact source commit
        shell: bash
        run: '[[ "$BATON2_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.BATON2_SOURCE_SHA }}
          persist-credentials: false
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Select homelab browser executable
        shell: bash
        run: printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prepare qualification compiler and TypeScript runtime
        shell: bash
        env:
          BATON2_RETAINED_COMPILER_ARCHIVE: ${{ inputs.retained_compiler_archive || '/var/tmp/baton2-compile-queue/toolchains/compiler-unit-process-cleanup-sol-20261028/bend-2.0.25-linux-x64-compiler-unit-process-cleanup-sol-20261028.tar.gz' }}
          BATON2_RETAINED_COMPILER_SHA256: ${{ inputs.retained_compiler_archive_sha256 || '113a272649904e80144b1954dba8b4999249efa408a6ce1ca346906114986c4d' }}
          BATON2_RETAINED_CCACHE: ${{ inputs.retained_ccache }}
          BATON2_LINUX_RUNNER: homelab
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/baton2-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run"
          mkdir -p "$run/toolchain-home" "$run/evidence"
          printf 'BATON2_QUALIFICATION_RUN=%s\n' "$run" >> "$GITHUB_ENV"
          python3 .github/scripts/prepare-native-compiler.py --run "$run" \
            --archive "$BATON2_RETAINED_COMPILER_ARCHIVE" \
            --archive-sha256 "$BATON2_RETAINED_COMPILER_SHA256" \
            --ccache "$BATON2_RETAINED_CCACHE" --github-env "$GITHUB_ENV" \
            --runner "$BATON2_LINUX_RUNNER" \
            > "$run/evidence/compiler-selection.stdout" 2> "$run/evidence/compiler-selection.stderr"
          printf 'BEND=%s\n' "$run/toolchain-home/bin/bend" >> "$GITHUB_ENV"
          sha256sum "$run/toolchain-home/bin/bend" > "$run/evidence/compiler.sha256"
          npm install --prefix "$run/typescript-runtime" --ignore-scripts --no-audit --no-fund \
            typescript@5.9.3 > "$run/evidence/typescript-install.stdout" 2> "$run/evidence/typescript-install.stderr"
          printf 'BATON2_CONTEXT_TYPESCRIPT=%s\n' "$run/typescript-runtime/node_modules/typescript" >> "$GITHUB_ENV"
      - name: Verify optional retained Main compilation
        shell: bash
        env:
          BATON2_RETAINED_MAIN_HANDOFF: ${{ inputs.retained_main_handoff }}
          BATON2_RETAINED_MAIN_SHA256: ${{ inputs.retained_main_handoff_sha256 }}
          BATON2_LINUX_RUNNER: homelab
        run: |
          set -euo pipefail
          printf 'BATON2_MAIN_GENERATED_C=\nBATON2_MAIN_GENERATED_C_ROOT=\nBATON2_MAIN_GENERATED_C_PROOF=\nBATON2_MAIN_GENERATED_C_PROOF_SHA256=\nBATON2_MAIN_C_VERIFIER=\n' >> "$GITHUB_ENV"
          if [[ -n "$BATON2_RETAINED_MAIN_HANDOFF" && "$BATON2_LINUX_RUNNER" != homelab ]]; then
            printf '%s\n' 'Retained Main compilation requires the homelab runner.' >&2
            exit 1
          fi
          python3 .github/scripts/reuse-native-main.py prepare \
            --source "$GITHUB_WORKSPACE" --run "$BATON2_QUALIFICATION_RUN" \
            --handoff "$BATON2_RETAINED_MAIN_HANDOFF" \
            --handoff-sha256 "$BATON2_RETAINED_MAIN_SHA256" \
            --compiler "$BEND" \
            --compiler-archive "$BATON2_QUALIFICATION_RUN/bend-2.0.25-linux-x64.tar.gz" \
            --github-env "$GITHUB_ENV" \
            > "$BATON2_QUALIFICATION_RUN/evidence/main-c-reuse.stdout" \
            2> "$BATON2_QUALIFICATION_RUN/evidence/main-c-reuse.stderr"
      - name: Run and record complete native checks and selected candidate tests
        shell: bash
        run: |
          set -euo pipefail
          unset BEND_GENERATED_C
          ulimit -s unlimited
          ulimit -a > "$BATON2_QUALIFICATION_RUN/evidence/limits.txt"
          "$CC" --version > "$BATON2_QUALIFICATION_RUN/evidence/clang.txt"
          node --version > "$BATON2_QUALIFICATION_RUN/evidence/node.txt"
          python3 --version > "$BATON2_QUALIFICATION_RUN/evidence/python.txt"
          uname -a > "$BATON2_QUALIFICATION_RUN/evidence/host.txt"
          python3 - <<'PY'
          import json, os, pathlib, runpy, subprocess, sys, time
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          run = pathlib.Path(os.environ['BATON2_QUALIFICATION_RUN'])
          evidence = run / 'evidence'
          recorder = root / '.github/scripts/record-native-checks.py'
          selected = runpy.run_path(str(recorder))['SELECTED']
          subprocess.run([sys.executable, str(recorder), 'shim', str(run / 'python-shim'), str(evidence / 'selected')], check=True)
          queue = runpy.run_path(str(root / '.github/scripts/queue-native-checks.py'))
          os.environ['BATON2_QUEUE_RUN_ROOT'] = str(run / 'compile-queue')
          check_environment = queue['environment'](run)
          check_environment['PATH'] = str(run / 'python-shim') + os.pathsep + check_environment['PATH']
          records = []
          def record(label, argv):
              started = time.time()
              with (evidence / (label + '.stdout')).open('wb') as stdout, (evidence / (label + '.stderr')).open('wb') as stderr:
                  result = subprocess.run(argv, cwd=root, stdout=stdout, stderr=stderr, env=check_environment)
              row = {'label': label, 'argv': argv, 'cwd': str(root), 'exit_code': result.returncode,
                     'elapsed_seconds': time.time() - started, 'stdout': label + '.stdout', 'stderr': label + '.stderr'}
              records.append(row)
              (evidence / 'results.json').write_text(json.dumps(records, indent=2) + '\n')
              if result.returncode:
                  raise SystemExit(result.returncode)
          record('complete-native', ['sh', 'bend2/scripts/check-native.sh'])
          selected_results = {name: json.loads((evidence / 'selected' / (name + '.json')).read_text()) for name in selected}
          assert all(result['judged'] and result['exit_code'] == 0 for result in selected_results.values())
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['BATON2_SOURCE_SHA']
          assert not git('status', '--porcelain', '--untracked-files=no'), 'Checks changed tracked source'
          (evidence / 'qualification-summary.json').write_text(json.dumps({
              'schema': 'baton2-native-qualification-v1', 'source_commit': git('rev-parse', 'HEAD'),
              'checks': records, 'selected_results': selected_results
          }, indent=2) + '\n')
          PY
      - name: Cancel qualification compile queue requests
        if: cancelled() && env.BATON2_QUALIFICATION_RUN != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$BATON2_QUALIFICATION_RUN/queue-config.json" ]]; then
            python3 .github/scripts/queue-native-checks.py cancel "$BATON2_QUALIFICATION_RUN"
          fi
      - name: Retain complete native qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-linux-candidate-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ env.BATON2_QUALIFICATION_RUN }}/evidence/
          if-no-files-found: error

  linux-target:
    needs: [darwin-arm64]
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.target_commit != '') }}
    timeout-minutes: 4320
    permissions:
      contents: read
      actions: read
    runs-on:
      group: baton2-native-homelab
      labels: [self-hosted, Linux, X64, baton2-native-linux-x64]
    env:
      CC: /usr/bin/clang-19
      BEND_NO_TELEMETRY: '1'
      BUN_JSC_maxPerThreadStackUsage: '67108864'
      BATON2_TARGET_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.target_commit }}
      BATON2_RETAINED_COMPILER_ARCHIVE: ${{ inputs.retained_compiler_archive || '/var/tmp/baton2-compile-queue/toolchains/compiler-unit-process-cleanup-sol-20261028/bend-2.0.25-linux-x64-compiler-unit-process-cleanup-sol-20261028.tar.gz' }}
      BATON2_RETAINED_COMPILER_SHA256: ${{ inputs.retained_compiler_archive_sha256 || '113a272649904e80144b1954dba8b4999249efa408a6ce1ca346906114986c4d' }}
    steps:
      - name: Validate exact source commit
        shell: bash
        run: '[[ "$BATON2_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout candidate test contracts and target history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.BATON2_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Select homelab browser executable
        shell: bash
        run: printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build exact target and measure affected candidate tests
        shell: bash
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/baton2-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run"
          mkdir -p "$run/toolchain-home" "$run/evidence" "$run/generated"
          printf 'BATON2_TARGET_RUN=%s\n' "$run" >> "$GITHUB_ENV"
          [[ "$BATON2_TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$run/source" > "$run/evidence/clone.stdout" 2> "$run/evidence/clone.stderr"
          git -C "$run/source" checkout --detach "$BATON2_TARGET_COMMIT" >> "$run/evidence/clone.stdout" 2>> "$run/evidence/clone.stderr"
          test "$(git -C "$run/source" rev-parse HEAD)" = "$BATON2_TARGET_COMMIT"
          python3 .github/scripts/prepare-native-compiler.py --run "$run" \
            --archive "$BATON2_RETAINED_COMPILER_ARCHIVE" \
            --archive-sha256 "$BATON2_RETAINED_COMPILER_SHA256" --runner homelab \
            > "$run/evidence/compiler-selection.stdout" 2> "$run/evidence/compiler-selection.stderr"
          export BEND="$run/toolchain-home/bin/bend"
          sha256sum "$BEND" > "$run/evidence/compiler.sha256"
          export BATON2_TARGET_RUN="$run"
          unset BEND_GENERATED_C
          ulimit -s unlimited
          ulimit -a > "$run/evidence/limits.txt"
          "$CC" --version > "$run/evidence/clang.txt"
          node --version > "$run/evidence/node.txt"
          python3 --version > "$run/evidence/python.txt"
          uname -a > "$run/evidence/host.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, runpy, shutil, subprocess, sys, time
          candidate = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          run = pathlib.Path(os.environ['BATON2_TARGET_RUN'])
          target = run / 'source'
          evidence = run / 'evidence'
          recorder = candidate / '.github/scripts/record-native-checks.py'
          selected = runpy.run_path(str(recorder))['SELECTED']
          subprocess.run([sys.executable, str(recorder), 'shim', str(run / 'python-shim'), str(evidence / 'selected')], check=True)
          queue = runpy.run_path(str(candidate / '.github/scripts/queue-native-checks.py'))
          check_environment = queue['environment'](run)
          check_environment['PATH'] = str(run / 'python-shim') + os.pathsep + check_environment['PATH']
          records = []
          def record(label, argv, environment=check_environment):
              started = time.time()
              with (evidence / (label + '.stdout')).open('wb') as stdout, (evidence / (label + '.stderr')).open('wb') as stderr:
                  result = subprocess.run(argv, cwd=target, stdout=stdout, stderr=stderr, env=environment)
              records.append({'label': label, 'argv': argv, 'cwd': str(target), 'exit_code': result.returncode,
                              'elapsed_seconds': time.time() - started, 'stdout': label + '.stdout', 'stderr': label + '.stderr'})
              (evidence / 'results.json').write_text(json.dumps(records, indent=2) + '\n')
              return result.returncode
          status = record('target-build', [sys.executable, str(candidate / '.github/scripts/reuse-native-target.py'),
                          str(target), str(evidence)])
          if status:
              raise SystemExit(status)
          contracts = {}
          for name in selected:
              relative = 'bend2/test/' + name
              original = candidate / relative
              contracts[relative] = hashlib.sha256(original.read_bytes()).hexdigest()
              shutil.copyfile(original, target / relative)
          (evidence / 'comparison.json').write_text(json.dumps({
              'target_commit': os.environ['BATON2_TARGET_COMMIT'], 'candidate_commit': os.environ['BATON2_SOURCE_SHA'],
              'test_contracts': contracts,
              'method': 'Candidate test contracts execute against the exact target production build and target helpers.'
          }, indent=2) + '\n')
          for name in selected:
              record('target-' + name, ['python3', 'bend2/test/' + name, '-v'])
          outcomes = {name: json.loads((evidence / 'selected' / (name + '.json')).read_text()) for name in selected}
          assert all(result['judged'] for result in outcomes.values()), 'Target comparison is incomplete'
          PY
      - name: Retain reusable exact target build
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/package-native-target-handoff.py \
            --source "$BATON2_TARGET_RUN/source" --run "$BATON2_TARGET_RUN" \
            --target-commit "$BATON2_TARGET_COMMIT" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --compiler "$BEND" --compiler-archive "$BATON2_TARGET_RUN/bend-2.0.25-linux-x64.tar.gz" \
            --cc "$CC" \
            > "$BATON2_TARGET_RUN/evidence/target-handoff.stdout" \
            2> "$BATON2_TARGET_RUN/evidence/target-handoff.stderr"
      - name: Cancel target compile queue requests
        if: cancelled() && env.BATON2_TARGET_RUN != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$BATON2_TARGET_RUN/queue-config.json" ]]; then
            python3 .github/scripts/queue-native-checks.py cancel "$BATON2_TARGET_RUN"
          fi
      - name: Retain complete target comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-linux-target-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ env.BATON2_TARGET_RUN }}/evidence/
          if-no-files-found: error

  darwin-arm64:
    needs: [linux-candidate]
    if: ${{ !cancelled() && (needs.linux-candidate.result == 'success' || inputs.reuse_generated_c_producer != '') }}
    runs-on:
      group: baton2-native-homelab
      labels: [self-hosted, Linux, X64, baton2-native-linux-x64, baton2-native-darwin-cross]
    env:
      BATON2_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
      BATON2_RETAINED_COMPILER_ARCHIVE: ${{ inputs.retained_compiler_archive || '/var/tmp/baton2-compile-queue/toolchains/compiler-unit-process-cleanup-sol-20261028/bend-2.0.25-linux-x64-compiler-unit-process-cleanup-sol-20261028.tar.gz' }}
      BATON2_RETAINED_COMPILER_SHA256: ${{ inputs.retained_compiler_archive_sha256 || '113a272649904e80144b1954dba8b4999249efa408a6ce1ca346906114986c4d' }}
      CC: /usr/bin/clang-19
    steps:
      - name: Validate generated C reuse selection
        id: generated-c-producer
        shell: bash
        env:
          BATON2_REUSE_GENERATED_C_PRODUCER: ${{ inputs.reuse_generated_c_producer }}
        run: |
          set -euo pipefail
          if [[ -z "$BATON2_REUSE_GENERATED_C_PRODUCER" ]]; then
            producer_run_id="$GITHUB_RUN_ID"
            producer_attempt="$GITHUB_RUN_ATTEMPT"
          else
            [[ "$BATON2_REUSE_GENERATED_C_PRODUCER" =~ ^([1-9][0-9]*)/([1-9][0-9]*)$ ]]
            producer_run_id="${BASH_REMATCH[1]}"
            producer_attempt="${BASH_REMATCH[2]}"
          fi
          printf 'BATON2_GENERATED_C_RUN_ID=%s\nBATON2_GENERATED_C_RUN_ATTEMPT=%s\n' \
            "$producer_run_id" "$producer_attempt" >> "$GITHUB_ENV"
          printf 'run_id=%s\nattempt=%s\n' "$producer_run_id" "$producer_attempt" \
            >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.BATON2_SOURCE_SHA }}
          persist-credentials: false

      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download selected exact-source Main C and producer checks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baton2-generated-c-${{ env.BATON2_SOURCE_SHA }}-${{ steps.generated-c-producer.outputs.attempt }}
          path: ${{ runner.temp }}/baton2-generated-c-${{ github.run_id }}-${{ github.run_attempt }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.generated-c-producer.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Create owned build clone and install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/baton2-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run"
          mkdir -p "$run/toolchain"
          printf 'BATON2_NATIVE_RUN=%s\n' "$run" >> "$GITHUB_ENV"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$run/build-source" > "$run/clone.log" 2>&1
          git -C "$run/build-source" checkout --detach "$BATON2_SOURCE_SHA" >> "$run/clone.log" 2>&1
          test "$(git -C "$run/build-source" rev-parse HEAD)" = "$BATON2_SOURCE_SHA"
          compiler_run="$run/compiler-selection"
          mkdir -p "$compiler_run/evidence" "$compiler_run/toolchain-home"
          python3 "$run/build-source/.github/scripts/prepare-native-compiler.py" \
            --run "$compiler_run" --archive "$BATON2_RETAINED_COMPILER_ARCHIVE" \
            --archive-sha256 "$BATON2_RETAINED_COMPILER_SHA256" --runner homelab \
            --github-env "$GITHUB_ENV" > "$run/toolchain-selection.stdout" \
            2> "$run/toolchain-selection.stderr"
          npm install --prefix "$run/typescript-runtime" --ignore-scripts --no-audit --no-fund \
            typescript@5.9.3 > "$run/typescript-install.stdout" 2> "$run/typescript-install.stderr"

      - name: Prepare required Darwin REPL runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/repl-package.py" runtime \
            --output "$BATON2_NATIVE_RUN/repl-runtime" --target-platform darwin-arm64

      - name: Verify generated C against exact producer source and results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, runpy, subprocess
          root = pathlib.Path(os.environ['BATON2_NATIVE_RUN']) / 'build-source'
          transfer = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baton2-generated-c-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          generated = transfer / 'generated'
          handoff = json.loads((generated / 'handoff-manifest.json').read_text())
          base_produced = handoff.get('producer_kind') == 'base'
          if base_produced:
              assert handoff['consumer_source_commit'] == os.environ['BATON2_SOURCE_SHA']
              assert handoff['consumer_source_tree'] == subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], cwd=root, text=True).strip()
          else:
              assert handoff['source_commit'] == os.environ['BATON2_SOURCE_SHA']
              assert handoff['source_tree'] == subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], cwd=root, text=True).strip()
          assert handoff['workflow_run_id'] == os.environ['BATON2_GENERATED_C_RUN_ID']
          assert handoff['workflow_run_attempt'] == os.environ['BATON2_GENERATED_C_RUN_ATTEMPT']
          compilers = runpy.run_path(str(root / '.github/scripts/reuse-native-main.py'))['COMPILER_ARCHIVES']
          assert handoff['compiler_archive_sha256'] in compilers
          selection_path = generated / 'compiler-selection.json'
          assert hashlib.sha256(selection_path.read_bytes()).hexdigest() == handoff['compiler_selection_sha256']
          selection = json.loads(selection_path.read_text())
          assert selection['schema'] == 'baton2-linux-compiler-selection-v1'
          assert selection['compiler_archive_sha256'] == handoff['compiler_archive_sha256']
          assert selection['compiler_binary_sha256'] == handoff['compiler_binary_sha256']
          identity = compilers[handoff['compiler_archive_sha256']]
          assert all(selection[key] == value for key, value in identity.items())
          if 'binary_sha256' in identity:
              assert handoff['compiler_binary_sha256'] == identity['binary_sha256']
          manifest_path = generated / 'source-manifest.json'
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == handoff['source_manifest_sha256']
          source = json.loads(manifest_path.read_text())
          c = generated / 'baton2.c'
          assert c.stat().st_size == handoff['generated_c_size']
          assert hashlib.sha256(c.read_bytes()).hexdigest() == handoff['generated_c_sha256']
          producer_checks_path = transfer / 'evidence/producer-checks.json'
          producer_checks = json.loads(producer_checks_path.read_text())
          assert producer_checks == handoff['checks']
          assert all(row['exit_code'] == 0 for row in producer_checks)
          if base_produced:
              # The C was generated from the base commit; the package source is the pull request head.
              # Equal Main production inputs and producer tooling bind the two.
              subprocess.run(['python3', str(root / '.github/scripts/native-producer-route.py'), 'verify-base',
                              '--source', str(root), '--generated', str(generated)], check=True)
              assert [row['label'] for row in producer_checks] == [
                  'base-source-identity', 'pinned-compiler-identity', 'base-lineage-guard',
                  'base-main-cgen', 'main-producer-route']
          else:
              paths = subprocess.check_output(['git', 'ls-files', '-z'], cwd=root).decode().split('\0')
              current = {path: hashlib.sha256((root / path).read_bytes()).hexdigest()
                         for path in paths if path and (root / path).is_file()}
              assert current == source, 'Transferred C producer source differs from package source'
              assert handoff['linux_binary_path'] == 'baton2-linux-x64'
              linux_binary = generated / handoff['linux_binary_path']
              assert linux_binary.is_file() and not linux_binary.is_symlink()
              assert linux_binary.stat().st_size == handoff['linux_binary_size']
              assert hashlib.sha256(linux_binary.read_bytes()).hexdigest() == handoff['linux_binary_sha256']
              main_c_reuse = json.loads((generated / 'main-c-reuse.json').read_text())
              assert main_c_reuse == handoff['main_c_reuse']
              subprocess.run(['python3', str(root / '.github/scripts/reuse-native-main.py'), 'verify-transfer',
                              '--source', str(root), '--generated', str(generated)], check=True)
              assert [row['label'] for row in producer_checks] == [
                  'exact-source-identity', 'pinned-compiler-identity',
                  'main-native-build', 'main-c-reuse-transfer-verification']
              assert producer_checks[2]['argv'] == ['sh', 'bend2/scripts/build-native.sh']
              assert producer_checks[3]['argv'][2] == 'verify-transfer'
              assert producer_checks[3]['argv'][3:6] == ['--source', producer_checks[3]['cwd'], '--generated']
              assert producer_checks[3]['argv'][6].endswith('/generated')
          for row in producer_checks:
              if 'stdout' in row:
                  assert (transfer / 'evidence' / row['stdout']).is_file()
              if 'stderr' in row:
                  assert (transfer / 'evidence' / row['stderr']).is_file()
          (pathlib.Path(os.environ['BATON2_NATIVE_RUN']) / 'generated-c-verification.json').write_text(json.dumps({
              'status': 'verified', 'producer_kind': handoff.get('producer_kind', 'candidate'),
              'source_commit': handoff['source_commit'],
              'consumer_source_commit': os.environ['BATON2_SOURCE_SHA'],
              'generated_c_sha256': handoff['generated_c_sha256'],
              'executed_producer_checks': handoff['checks'], 'producer': handoff
          }, indent=2) + '\n')
          PY

      - name: Build and package native artifact
        shell: bash
        run: |
          set -euo pipefail
          export BUN_JSC_maxPerThreadStackUsage=67108864
          export BATON2_QUEUE_RUN_ROOT="$BATON2_NATIVE_RUN/compile-queue"
          unset BEND_GENERATED_C
          llvm_root="${BATON2_DARWIN_LLVM_ROOT:-/mnt/nvme4tb/ci-runners/baton2-native-homelab/qualifications/code-semantics-d5384042/staged/llvm}"
          sdkroot="${BATON2_DARWIN_SDKROOT:-/mnt/nvme4tb/ci-runners/baton2-native-homelab/toolchains/apple/MacOSX15.5.sdk}"
          sdk_manifest="${sdkroot}.transfer-manifest.json"
          test -r "$llvm_root/bin/clang" && test -x "$llvm_root/bin/clang"
          test -r "$llvm_root/bin/ld64.lld" && test -x "$llvm_root/bin/ld64.lld"
          test -r "$sdk_manifest"
          settings="$BATON2_NATIVE_RUN/build-settings"
          test ! -e "$settings"
          mkdir "$settings"
          printf '%s\n' "$llvm_root/bin/clang" > "$settings/clang-path.txt"
          sha256sum "$llvm_root/bin/clang" > "$settings/clang.sha256"
          printf '%s\n' "$llvm_root/bin/ld64.lld" > "$settings/linker-path.txt"
          sha256sum "$llvm_root/bin/ld64.lld" > "$settings/linker.sha256"
          node --version > "$settings/node.txt"
          python3 --version > "$settings/python.txt"
          uname -a > "$settings/host.txt"
          printf 'GITHUB_SHA=%s\nGITHUB_RUN_ID=%s\nGITHUB_RUN_ATTEMPT=%s\nBUN_JSC_maxPerThreadStackUsage=%s\nBEND_ARGUMENT=%s\nCC=%s\nBEND_GENERATED_C=%s\n' \
            "$BATON2_SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$BUN_JSC_maxPerThreadStackUsage" "$BATON2_NATIVE_RUN/compiler-selection/toolchain-home/bin/bend" \
            "$BATON2_NATIVE_RUN/build-source/bend2/scripts/darwin-arm64-clang.sh" "${BEND_GENERATED_C:-}" > "$settings/environment.txt"
          cp "$BATON2_NATIVE_RUN/build-source/.github/workflows/bend2-native.yml" "$settings/workflow.yml"
          sha256sum "$BATON2_NATIVE_RUN/compiler-selection/toolchain-home/bin/bend" > "$settings/compiler.sha256"
          stat -Lc '%s' "$BATON2_NATIVE_RUN/compiler-selection/toolchain-home/bin/bend" > "$settings/compiler.size"
          file -L "$BATON2_NATIVE_RUN/compiler-selection/toolchain-home/bin/bend" > "$settings/compiler.file"
          sha256sum "$sdk_manifest" > "$settings/sdk-transfer-manifest.sha256"
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["verification"]["destination_tree_sha256"])' "$sdk_manifest" > "$settings/sdk-tree.sha256"
          ulimit -a > "$settings/limits-soft-before.txt"
          ulimit -H -a > "$settings/limits-hard-before.txt"
          requested_stack_kib=65536
          hard_stack_kib=$(ulimit -H -s)
          chosen_stack_kib="$requested_stack_kib"
          case "$hard_stack_kib" in
            unlimited) ;;
            ''|*[!0-9]*)
              printf 'Invalid inherited stack hard limit: %s\n' "$hard_stack_kib" \
                > "$settings/stack-selection.stderr"
              exit 1
              ;;
            *)
              if [ "$hard_stack_kib" -lt "$chosen_stack_kib" ]; then
                chosen_stack_kib="$hard_stack_kib"
              fi
              ;;
          esac
          printf 'requested_kib=%s\ninherited_hard_kib=%s\nchosen_kib=%s\n' \
            "$requested_stack_kib" "$hard_stack_kib" "$chosen_stack_kib" \
            > "$settings/stack-selection.txt"
          stack_status=0
          ulimit -S -s "$chosen_stack_kib" > "$settings/stack-setting.stdout" \
            2> "$settings/stack-setting.stderr" || stack_status=$?
          printf '%s\n' "$stack_status" > "$settings/stack-setting.status"
          ulimit -a > "$settings/limits-soft-after.txt"
          ulimit -H -a > "$settings/limits-hard-after.txt"
          ulimit -s > "$settings/stack-kib.txt"
          test "$stack_status" -eq 0
          test "$(cat "$settings/stack-kib.txt")" = "$chosen_stack_kib"
          package_args=(
            --output "$BATON2_NATIVE_RUN/package"
            --bend "$BATON2_NATIVE_RUN/compiler-selection/toolchain-home/bin/bend"
            --compiler-archive "$BATON2_NATIVE_RUN/compiler-selection/bend-2.0.25-linux-x64.tar.gz"
            --target-system Darwin
            --target-machine arm64
            --darwin-llvm-root "$llvm_root"
            --darwin-sdkroot "$sdkroot"
            --generated-c "$RUNNER_TEMP/baton2-generated-c-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/generated/baton2.c"
            --context-typescript-package "$BATON2_NATIVE_RUN/typescript-runtime/node_modules/typescript"
          )
          runtime_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["binary"]["sha256"])' "$BATON2_NATIVE_RUN/repl-runtime/runtime.json")
          package_args+=(
            --repl-compiler-source "$RUNNER_TEMP/baton2-generated-c-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/generated/repl-source/source"
            --repl-runtime "$BATON2_NATIVE_RUN/repl-runtime/bun"
            --repl-runtime-sha256 "$runtime_sha"
            --repl-runtime-notices "$BATON2_NATIVE_RUN/repl-runtime/Bun-NOTICES"
          )
          if [[ -n "$BATON2_RELEASE_VERSION" ]]; then
            package_args+=(--release-version "$BATON2_RELEASE_VERSION")
          fi
          python3 "$BATON2_NATIVE_RUN/build-source/bend2/scripts/package-native.py" "${package_args[@]}" \
            > "$BATON2_NATIVE_RUN/package-command.stdout" \
            2> "$BATON2_NATIVE_RUN/package-command.stderr"

      - name: Bind producer evidence and finalize the package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, shutil, tarfile
          run = pathlib.Path(os.environ['BATON2_NATIVE_RUN'])
          package = run / 'package'
          manifest = json.loads((package / 'manifest.json').read_text())
          assert manifest['source']['commit'] == os.environ['BATON2_SOURCE_SHA']
          assert not manifest['source']['status'], 'Package source is dirty'
          payload = package / manifest['archive_root']
          provenance = payload / 'share/baton2/generated-c-provenance'
          selected_repl = [row for row in manifest.get('selected_dependencies', []) if row['id'] == 'bend2-repl-compiler']
          assert len(selected_repl) == 1 and selected_repl[0]['required'] is True
          shutil.copyfile(run / 'repl-runtime/runtime.json', provenance / 'repl-runtime.json')
          runtime = json.loads((run / 'repl-runtime/runtime.json').read_text())
          dependency = selected_repl[0]
          compiler_manifest = payload / dependency['path'] / dependency['manifest']
          assert hashlib.sha256(compiler_manifest.read_bytes()).hexdigest() == dependency['sha256']
          compiler = json.loads(compiler_manifest.read_text())
          assert compiler['runtimeSha256'] == runtime['binary']['sha256']
          assert hashlib.sha256((payload / dependency['path'] / 'notices/Bun-NOTICES').read_bytes()).hexdigest() == runtime['notices']['sha256']
          transfer = pathlib.Path(os.environ['RUNNER_TEMP']) / ('baton2-generated-c-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          shutil.copytree(transfer / 'generated', provenance)
          shutil.copytree(transfer / 'evidence', provenance / 'producer-results')
          shutil.copyfile(run / 'generated-c-verification.json', provenance / 'verification.json')
          assets = [{'path': str(path.relative_to(payload)), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                     'size': path.stat().st_size} for path in sorted(provenance.rglob('*')) if path.is_file()]
          manifest['build']['generated_c_provenance'] = {'path': str(provenance.relative_to(payload)), 'assets': assets}
          manifest['binary']['sha256'] = hashlib.sha256((payload / manifest['binary']['path']).read_bytes()).hexdigest()
          for record in manifest['binaries']:
              assert hashlib.sha256((payload / record['path']).read_bytes()).hexdigest() == record['sha256'], record
          manifest['build']['typescript_package_lock_sha256'] = hashlib.sha256((run / 'typescript-runtime/package-lock.json').read_bytes()).hexdigest()
          for path in (payload / 'manifest.json', package / 'manifest.json'):
              path.write_text(json.dumps(manifest, indent=2) + '\n')
          finalize_spec = importlib.util.spec_from_file_location(
              'finalize_native_payload', run / 'bend2/scripts/finalize-native-payload.py')
          finalizer = importlib.util.module_from_spec(finalize_spec)
          finalize_spec.loader.exec_module(finalizer)
          finalize = finalizer.finalize(payload)
          assert finalize['files'] > 0
          result = json.loads((package / 'result.json').read_text())
          archive = package / result['archive']['path']
          replacement = package / (archive.name + '.new')
          with tarfile.open(replacement, 'x:gz') as output:
              output.add(payload, arcname=manifest['archive_root'])
          replacement.replace(archive)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (package / 'SHA256SUMS').write_text(digest + '  ' + archive.name + '\n')
          result['archive']['sha256'] = digest
          (package / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          PY

      - name: Retain native artifact and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-${{ github.event_name == 'workflow_dispatch' && inputs.release_version || 'development' }}-darwin-arm64-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ env.BATON2_NATIVE_RUN }}/package/
            ${{ env.BATON2_NATIVE_RUN }}/compiler-selection/
            ${{ env.BATON2_NATIVE_RUN }}/compile-queue/
            ${{ env.BATON2_NATIVE_RUN }}/build-settings/
            ${{ env.BATON2_NATIVE_RUN }}/generated-c-verification.json
            ${{ env.BATON2_NATIVE_RUN }}/repl-runtime/
            ${{ env.BATON2_NATIVE_RUN }}/typescript-runtime/package-lock.json
            ${{ env.BATON2_NATIVE_RUN }}/typescript-install.stdout
            ${{ env.BATON2_NATIVE_RUN }}/typescript-install.stderr
            ${{ env.BATON2_NATIVE_RUN }}/clone.log
            ${{ env.BATON2_NATIVE_RUN }}/toolchain-selection.*
            ${{ env.BATON2_NATIVE_RUN }}/package-command.stdout
            ${{ env.BATON2_NATIVE_RUN }}/package-command.stderr
          if-no-files-found: error
          include-hidden-files: true

  darwin-arm64-install:
    needs: [darwin-arm64]
    runs-on: [self-hosted, macOS, ARM64, baton2-native-darwin-arm64]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.BATON2_SOURCE_SHA }}
          persist-credentials: false

      - name: Download Darwin package and producer evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baton2-${{ github.event_name == 'workflow_dispatch' && inputs.release_version || 'development' }}-darwin-arm64-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baton2-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify and exercise the installed Darwin artifact
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/baton2-darwin-arm64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/package"
          test "$(wc -l < "$package/SHA256SUMS")" -eq 1
          read -r sha archive_name < "$package/SHA256SUMS"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          test "$archive_name" = "$(basename "$archive_name")"
          [[ "$archive_name" == baton2-*-darwin-arm64-"$BATON2_SOURCE_SHA".tar.gz ]]
          printf '%s  %s\n' "$sha" "$archive_name" | cmp - "$package/SHA256SUMS"
          (cd "$package" && shasum -a 256 -c SHA256SUMS)
          unavailable=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source"]["directory"])' "$package/manifest.json")
          test ! -e "$unavailable"
          python3 "$GITHUB_WORKSPACE/bend2/scripts/smoke-native-artifact.py" \
            --archive "$package/$archive_name" --sha256 "$sha" \
            --manifest "$package/manifest.json" --unavailable-source "$unavailable" \
            --output "$package/smoke" > "$package/smoke.stdout" 2> "$package/smoke.stderr"
          installed_prefix=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["extracted_prefix"])' "$package/smoke/summary.json")
          python3 "$GITHUB_WORKSPACE/bend2/scripts/check-install.py" \
            --prefix "$installed_prefix" --skip-native-compiler-probe \
            --output "$package/install-check" > "$package/install-check.stdout" \
            2> "$package/install-check.stderr"

      - name: Retain Darwin installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-darwin-install-${{ env.BATON2_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/baton2-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}/package/SHA256SUMS
            ${{ runner.temp }}/baton2-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}/package/manifest.json
            ${{ runner.temp }}/baton2-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}/package/*.tar.gz
            ${{ runner.temp }}/baton2-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}/package/smoke/
            ${{ runner.temp }}/baton2-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}/package/install-check/
            ${{ runner.temp }}/baton2-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}/package/*.stdout
            ${{ runner.temp }}/baton2-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}/package/*.stderr
          if-no-files-found: error
          include-hidden-files: true
