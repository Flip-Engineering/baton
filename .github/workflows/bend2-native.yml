name: bend2-native-development

'on':
  pull_request:
    branches: [bend2-rewrite, main]
    paths:
      - 'bend2/src/**'
      - 'bend2/scripts/build-native.sh'
      - 'bend2/scripts/package-native.py'
      - 'docs/bend2/reference/toolchain/install-2.0.25.sh'
  push:
    branches: [bend2-rewrite, main]
    paths:
      - 'bend2/src/**'
      - 'bend2/scripts/build-native.sh'
      - 'bend2/scripts/package-native.py'
      - 'docs/bend2/reference/toolchain/install-2.0.25.sh'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release archive version; leave blank for a development archive'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  darwin-arm64:
    runs-on: macos-15
    env:
      BATON2_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Create owned build clone and install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/baton2-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run"
          mkdir -p "$run/toolchain"
          printf 'BATON2_NATIVE_RUN=%s\n' "$run" >> "$GITHUB_ENV"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$run/build-source" > "$run/clone.log" 2>&1
          git -C "$run/build-source" checkout --detach "$GITHUB_SHA" >> "$run/clone.log" 2>&1
          test "$(git -C "$run/build-source" rev-parse HEAD)" = "$GITHUB_SHA"
          archive="$run/toolchain/bend-2.0.25-darwin-arm64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/bendlang/bend/releases/download/v2.0.25/bend-2.0.25-darwin-arm64.tar.gz \
            -o "$archive" > "$run/toolchain/download.log" 2>&1
          printf 'c5bb22ba029d5909da9c6db82aa037278a66d1cf8a5572f433879f7dcd866c31  %s\n' "$archive" | \
            shasum -a 256 -c - > "$run/toolchain/archive-check.log" 2>&1
          test ! -e "$run/toolchain-home"
          BEND_HOME="$run/toolchain-home" sh "$run/build-source/docs/bend2/reference/toolchain/install-2.0.25.sh" \
            > "$run/toolchain/install.log" 2>&1

      - name: Build and package native artifact
        shell: bash
        run: |
          set -euo pipefail
          export BUN_JSC_maxPerThreadStackUsage=67108864
          unset BEND_GENERATED_C
          settings="$BATON2_NATIVE_RUN/build-settings"
          test ! -e "$settings"
          mkdir "$settings"
          printf 'GITHUB_SHA=%s\nGITHUB_RUN_ID=%s\nGITHUB_RUN_ATTEMPT=%s\nBUN_JSC_maxPerThreadStackUsage=%s\nBEND_ARGUMENT=%s\nCC=%s\nBEND_GENERATED_C=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$BUN_JSC_maxPerThreadStackUsage" "$BATON2_NATIVE_RUN/toolchain-home/bin/bend" \
            "${CC:-clang}" "${BEND_GENERATED_C:-}" > "$settings/environment.txt"
          cp "$BATON2_NATIVE_RUN/build-source/.github/workflows/bend2-native.yml" "$settings/workflow.yml"
          shasum -a 256 "$BATON2_NATIVE_RUN/toolchain-home/bin/bend" > "$settings/compiler.sha256"
          stat -L -f '%z' "$BATON2_NATIVE_RUN/toolchain-home/bin/bend" > "$settings/compiler.size"
          file -L "$BATON2_NATIVE_RUN/toolchain-home/bin/bend" > "$settings/compiler.file"
          ulimit -a > "$settings/limits-soft-before.txt"
          ulimit -H -a > "$settings/limits-hard-before.txt"
          requested_stack_kib=65536
          hard_stack_kib=$(ulimit -H -s)
          chosen_stack_kib="$requested_stack_kib"
          case "$hard_stack_kib" in
            unlimited) ;;
            ''|*[!0-9]*)
              printf 'Invalid inherited stack hard limit: %s\n' "$hard_stack_kib" \
                > "$settings/stack-selection.stderr"
              exit 1
              ;;
            *)
              if [ "$hard_stack_kib" -lt "$chosen_stack_kib" ]; then
                chosen_stack_kib="$hard_stack_kib"
              fi
              ;;
          esac
          printf 'requested_kib=%s\ninherited_hard_kib=%s\nchosen_kib=%s\n' \
            "$requested_stack_kib" "$hard_stack_kib" "$chosen_stack_kib" \
            > "$settings/stack-selection.txt"
          stack_status=0
          ulimit -S -s "$chosen_stack_kib" > "$settings/stack-setting.stdout" \
            2> "$settings/stack-setting.stderr" || stack_status=$?
          printf '%s\n' "$stack_status" > "$settings/stack-setting.status"
          ulimit -a > "$settings/limits-soft-after.txt"
          ulimit -H -a > "$settings/limits-hard-after.txt"
          ulimit -s > "$settings/stack-kib.txt"
          test "$stack_status" -eq 0
          test "$(cat "$settings/stack-kib.txt")" = "$chosen_stack_kib"
          package_args=(
            --output "$BATON2_NATIVE_RUN/package"
            --bend "$BATON2_NATIVE_RUN/toolchain-home/bin/bend"
            --compiler-archive "$BATON2_NATIVE_RUN/toolchain/bend-2.0.25-darwin-arm64.tar.gz"
          )
          if [[ -n "$BATON2_RELEASE_VERSION" ]]; then
            package_args+=(--release-version "$BATON2_RELEASE_VERSION")
          fi
          python3 "$BATON2_NATIVE_RUN/build-source/bend2/scripts/package-native.py" "${package_args[@]}" \
            > "$BATON2_NATIVE_RUN/package-command.stdout" \
            2> "$BATON2_NATIVE_RUN/package-command.stderr"

      - name: Exercise extracted artifact with build path unavailable
        shell: bash
        run: |
          set -euo pipefail
          build="$BATON2_NATIVE_RUN/build-source"
          retained="$BATON2_NATIVE_RUN/build-source-retained"
          test ! -e "$retained"
          mv "$build" "$retained"
          trap 'mv "$retained" "$build"' EXIT
          package="$BATON2_NATIVE_RUN/package"
          sums="$package/SHA256SUMS"
          test "$(wc -l < "$sums")" -eq 1
          read -r sha archive_name < "$sums"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          test "$archive_name" = "$(basename "$archive_name")"
          [[ "$archive_name" == baton2-*-darwin-arm64-"$GITHUB_SHA".tar.gz ]]
          printf '%s  %s\n' "$sha" "$archive_name" | cmp - "$sums"
          (cd "$package" && shasum -a 256 -c SHA256SUMS)
          archive="$package/$archive_name"
          python3 "$GITHUB_WORKSPACE/bend2/scripts/smoke-native-artifact.py" \
            --archive "$archive" --sha256 "$sha" \
            --manifest "$package/manifest.json" \
            --unavailable-source "$build" --output "$BATON2_NATIVE_RUN/smoke" \
            > "$BATON2_NATIVE_RUN/smoke-command.stdout" \
            2> "$BATON2_NATIVE_RUN/smoke-command.stderr"

      - name: Retain native artifact and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-${{ github.event_name == 'workflow_dispatch' && inputs.release_version || 'development' }}-darwin-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.BATON2_NATIVE_RUN }}/package/
            ${{ env.BATON2_NATIVE_RUN }}/smoke/
            ${{ env.BATON2_NATIVE_RUN }}/toolchain/
            ${{ env.BATON2_NATIVE_RUN }}/build-settings/
            ${{ env.BATON2_NATIVE_RUN }}/clone.log
            ${{ env.BATON2_NATIVE_RUN }}/package-command.stdout
            ${{ env.BATON2_NATIVE_RUN }}/package-command.stderr
            ${{ env.BATON2_NATIVE_RUN }}/smoke-command.stdout
            ${{ env.BATON2_NATIVE_RUN }}/smoke-command.stderr
          if-no-files-found: error
          include-hidden-files: true
