name: Bend2 native qualification
run-name: Required Bend2 REPL Darwin dependency preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  darwin-dependency:
    runs-on: macos-15
    steps:
      - name: Checkout exact dependency source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify required compiler dependency on Darwin arm64
        run: python3 .github/scripts/repl-darwin-preflight.py --output "$RUNNER_TEMP/repl-darwin-dependency"
      - name: Retain complete preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repl-darwin-dependency-${{ github.sha }}
          path: ${{ runner.temp }}/repl-darwin-dependency/
          if-no-files-found: error
