name: bend2-native-recovery-darwin

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baton2-native-recovery-darwin-ef0b8a5eb4da5d13f253ebe79b289dc22b2836cb
  cancel-in-progress: false

env:
  BATON2_SOURCE_SHA: ef0b8a5eb4da5d13f253ebe79b289dc22b2836cb
  BATON2_RECOVERY_BUNDLE: /tmp/recovery-c-1165/generated
  BATON2_RECOVERY_DIAGNOSTICS_ROOT: /Users/wahargis/Library/Application Support/Baton/recovery-diagnostics
  BATON2_RECOVERY_PROOF_SHA256: 7c824f00d831fd9a8d0d305b899f6153416973337a1c3248984cd141a1b368a7
  BATON2_RECOVERY_GENERATOR_ROOT: /var/tmp/baton2-compile-queue/toolchains/compiler-main-bounded-indent-20261027/package/bend-2.0.25
  BEND_NO_TELEMETRY: '1'

jobs:
  recovery-darwin-arm64:
    timeout-minutes: 4320
    runs-on: [self-hosted, macOS, ARM64, baton2-native-darwin-arm64]
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
    steps:
      - name: Validate source and runner identity
        run: |
          set -euo pipefail
          test "$BATON2_SOURCE_SHA" = ef0b8a5eb4da5d13f253ebe79b289dc22b2836cb
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          proof="$BATON2_RECOVERY_BUNDLE/recovery-c-reuse.json"
          generated="$BATON2_RECOVERY_BUNDLE/recovery-c-origin/baton-recovery.c"
          original="$BATON2_RECOVERY_BUNDLE/recovery-c-origin/generated.c"
          test -f "$proof"
          test -f "$generated"
          test -f "$original"
          printf '%s  %s\n' "$BATON2_RECOVERY_PROOF_SHA256" "$proof" | shasum -a 256 -c -
          printf '%s  %s\n' \
            e6e5824a25545529f3d94d5f3a69fe184355a642bae3ece292beeb9d45b8f300 "$generated" | \
            shasum -a 256 -c -
          printf '%s  %s\n' \
            2ee44b644f274759ea8d4ad73a6d82bff9be3d57d3ece4304e224887955b4e1e "$original" | \
            shasum -a 256 -c -
          test -f "$BATON2_RECOVERY_GENERATOR_ROOT/fork-manifest.json"

      - name: Checkout exact component source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.BATON2_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout current shared queue source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: .queue-source
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the source contains the portable proof selector
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BATON2_SOURCE_SHA"
          git merge-base --is-ancestor 905f0bfacbc1ef490af156a2f3f3e0bd8efeb49d HEAD
          rg -q 'same_resolved_path' .github/scripts/reuse-native-recovery.py
          rg -q 'validate_source_proof' .github/scripts/reuse-native-recovery.py

      - name: Install pinned Darwin Bend toolchain
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/baton2-recovery-darwin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run"
          mkdir -p "$run/toolchain" "$run/toolchain-home" "$run/artifact"
          printf 'BATON2_RECOVERY_RUN=%s\n' "$run" >> "$GITHUB_ENV"
          archive="$run/toolchain/bend-2.0.25-darwin-arm64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/bendlang/bend/releases/download/v2.0.25/bend-2.0.25-darwin-arm64.tar.gz \
            -o "$archive" > "$run/toolchain/download.log" 2>&1
          printf '%s  %s\n' \
            c5bb22ba029d5909da9c6db82aa037278a66d1cf8a5572f433879f7dcd866c31 "$archive" | \
            shasum -a 256 -c - > "$run/toolchain/archive-check.log" 2>&1
          BEND_HOME="$run/toolchain-home" sh docs/bend2/reference/toolchain/install-2.0.25.sh \
            > "$run/toolchain/install.log" 2>&1
          printf 'BEND=%s\n' "$run/toolchain-home/bin/bend" >> "$GITHUB_ENV"
          shasum -a 256 "$run/toolchain-home/bin/bend" > "$run/toolchain/compiler.sha256"

      - name: Select the maintained Xcode compiler and SDK
        run: |
          set -euo pipefail
          developer_dir=/Applications/Xcode.app/Contents/Developer
          test -d "$developer_dir"
          cc="$(DEVELOPER_DIR="$developer_dir" xcrun --sdk macosx --find clang)"
          sdk="$(DEVELOPER_DIR="$developer_dir" xcrun --sdk macosx --show-sdk-path)"
          test -x "$cc"
          test -d "$sdk"
          printf 'DEVELOPER_DIR=%s\nCC=%s\nSDKROOT=%s\n' \
            "$developer_dir" "$cc" "$sdk" >> "$GITHUB_ENV"
          printf 'Darwin C compiler: %s\nDarwin SDK: %s\n' "$cc" "$sdk" \
            | tee "$BATON2_RECOVERY_RUN/darwin-c-toolchain.txt"

      - name: Verify retained recovery C selection
        run: |
          set -euo pipefail
          unset BEND_LIB
          python3 .github/scripts/reuse-native-recovery.py select \
            --source "$GITHUB_WORKSPACE" \
            --compiler "$BEND" \
            --proof "$BATON2_RECOVERY_BUNDLE/recovery-c-reuse.json" \
            --proof-sha256 "$BATON2_RECOVERY_PROOF_SHA256" \
            --generated-c "$BATON2_RECOVERY_BUNDLE/recovery-c-origin/baton-recovery.c" \
            --generator-root "$BATON2_RECOVERY_GENERATOR_ROOT" \
            --output "$BATON2_RECOVERY_RUN/recovery-c-selection.json" \
            > "$BATON2_RECOVERY_RUN/selection.stdout" \
            2> "$BATON2_RECOVERY_RUN/selection.stderr"
          jq -e '
            .status == "reused" and
            .selected_c_sha256 == "e6e5824a25545529f3d94d5f3a69fe184355a642bae3ece292beeb9d45b8f300" and
            .proof_sha256 == env.BATON2_RECOVERY_PROOF_SHA256 and
            .proof_source_commit == "905f0bfacbc1ef490af156a2f3f3e0bd8efeb49d" and
            .selected_source_commit == env.BATON2_SOURCE_SHA and
            .selected_source_digest == "623b83017eb871c55392a17eb6ac0d727d04c032fb334a45a3f296a7c0388faa" and
            .selected_source_closure_file_count == 79
          ' "$BATON2_RECOVERY_RUN/recovery-c-selection.json"

      - name: Build a queue client for the shared state root
        run: |
          set -euo pipefail
          queue_root="${BATON_COMPILE_QUEUE_ROOT:-/private/var/tmp/baton2-compile-queue}"
          install -d -m 2775 "$queue_root"
          queue_root="$(cd "$queue_root" && pwd -P)"
          queue_group="$(id -gn)"
          queue_uid="$(id -u)"
          queue_owner="$(stat -f '%u' "$queue_root")"
          if [[ "$queue_owner" != "$queue_uid" ]]; then
            printf 'The compile queue state root is not owned by the runner user: %s\n' "$queue_root" >&2
            exit 78
          fi
          chgrp "$queue_group" "$queue_root"
          chmod 2775 "$queue_root"
          if [[ -L "$queue_root/bootstrap-runs" ]]; then
            printf 'The compile queue bootstrap-runs path must be a directory, not a symlink: %s\n' "$queue_root/bootstrap-runs" >&2
            exit 78
          fi
          if [[ -d "$queue_root/bootstrap-runs" ]]; then
            if [[ "$(stat -f '%u' "$queue_root/bootstrap-runs")" != "$queue_uid" ]]; then
              printf 'The compile queue bootstrap-runs directory is not owned by the runner user: %s\n' "$queue_root/bootstrap-runs" >&2
              exit 78
            fi
            chgrp "$queue_group" "$queue_root/bootstrap-runs"
            chmod 2770 "$queue_root/bootstrap-runs"
          fi
          for shared_file in "$queue_root/heavy.lock" "$queue_root/compile-queue-runner"; do
            if [[ -L "$shared_file" ]]; then
              printf 'The compile queue shared file must not be a symlink: %s\n' "$shared_file" >&2
              exit 78
            fi
            if [[ -e "$shared_file" ]]; then
              if [[ ! -f "$shared_file" || "$(stat -f '%u' "$shared_file")" != "$queue_owner" ]]; then
                printf 'The compile queue shared file is not a runner-owned regular file: %s\n' "$shared_file" >&2
                exit 78
              fi
              chgrp "$queue_group" "$shared_file"
            fi
          done
          if [[ -L "$queue_root/keys" ]]; then
            printf 'The compile queue keys path must be a directory, not a symlink: %s\n' "$queue_root/keys" >&2
            exit 78
          fi
          if [[ -d "$queue_root/keys" ]]; then
            if find "$queue_root/keys" -type l -print -quit | grep -q .; then
              printf 'The compile queue keys tree contains a symlink: %s\n' "$queue_root/keys" >&2
              exit 78
            fi
            if find "$queue_root/keys" ! -uid "$queue_uid" -print -quit | grep -q .; then
              printf 'The compile queue key entries include an owner other than the runner user: %s\n' "$queue_root/keys" >&2
              exit 78
            fi
            find "$queue_root/keys" -exec chgrp "$queue_group" {} +
            find "$queue_root/keys" -type d -exec chmod 2770 {} +
          fi
          queue_source="$GITHUB_WORKSPACE/.queue-source"
          queue_source_commit="$(git -C "$queue_source" rev-parse HEAD)"
          test "$queue_source_commit" = "$GITHUB_SHA"
          queue_source_tree="$(git -C "$queue_source" rev-parse 'HEAD^{tree}')"
          queue_client="$BATON2_RECOVERY_RUN/compile-queue-runner"
          BATON_COMPILE_QUEUE_ROOT="$queue_root" \
            BATON_COMPILE_QUEUE_TELEMETRY="$BATON2_RECOVERY_RUN/queue-bootstrap.telemetry" \
            BEND="$BEND" BEND_NO_TELEMETRY=1 \
            sh "$queue_source/bend2/scripts/bootstrap-compile-queue.sh" "$queue_client" \
            > "$BATON2_RECOVERY_RUN/queue-bootstrap.stdout" \
            2> "$BATON2_RECOVERY_RUN/queue-bootstrap.stderr"
          test -d "$queue_root"
          test -x "$queue_client"
          printf 'queue_root=%s\nqueue_group=%s\nqueue_source_commit=%s\nqueue_source_tree=%s\nqueue_client=%s\n' \
            "$queue_root" "$queue_group" "$queue_source_commit" "$queue_source_tree" "$queue_client" \
            > "$BATON2_RECOVERY_RUN/queue-selection.txt"
          shasum -a 256 "$queue_client" > "$BATON2_RECOVERY_RUN/queue-client.sha256"
          printf 'BATON_COMPILE_QUEUE_ROOT=%s\nBATON2_COMPILE_QUEUE_BIN=%s\n' \
            "$queue_root" "$queue_client" >> "$GITHUB_ENV"

      - name: Build only the recovery native component
        env:
          BATON2_RECOVERY_HELPER: '1'
          BATON2_RECOVERY_C_PROOF: ${{ env.BATON2_RECOVERY_BUNDLE }}/recovery-c-reuse.json
          BATON2_RECOVERY_C_PROOF_SHA256: ${{ env.BATON2_RECOVERY_PROOF_SHA256 }}
          BATON2_RECOVERY_GENERATED_C: ${{ env.BATON2_RECOVERY_BUNDLE }}/recovery-c-origin/baton-recovery.c
          BATON2_RECOVERY_C_GENERATOR_ROOT: ${{ env.BATON2_RECOVERY_GENERATOR_ROOT }}
        run: |
          set -euo pipefail
          unset BEND_GENERATED_C
          export BATON2_QUEUE_RUN_ROOT="$BATON2_RECOVERY_RUN/queue-run"
          "$CC" --version > "$BATON2_RECOVERY_RUN/clang.txt"
          git rev-parse HEAD > "$BATON2_RECOVERY_RUN/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$BATON2_RECOVERY_RUN/source-tree.txt"
          python3 bend2/scripts/source-closure.py \
            --source "$GITHUB_WORKSPACE" --commit "$BATON2_SOURCE_SHA" \
            --output "$BATON2_RECOVERY_RUN/source-closure.json" \
            > "$BATON2_RECOVERY_RUN/source-closure.stdout"
          output="$BATON2_RECOVERY_RUN/baton-recovery"
          sh bend2/scripts/build-native.sh \
            bend2/src/coordinator/receive-recovery-focused.bend "$output" \
            > "$BATON2_RECOVERY_RUN/build.stdout" \
            2> "$BATON2_RECOVERY_RUN/build.stderr"
          test -x "$output"
          test -f "$output.c"
          shasum -a 256 "$output" "$output.c" > "$BATON2_RECOVERY_RUN/output.sha256"
          tar -C "$BATON2_RECOVERY_BUNDLE" -czf \
            "$BATON2_RECOVERY_RUN/artifact/recovery-proof-inputs.tar.gz" \
            recovery-c-reuse.json recovery-c-origin
          tar -C "$(dirname "$BATON2_RECOVERY_GENERATOR_ROOT")" -czf \
            "$BATON2_RECOVERY_RUN/artifact/recovery-generator-root.tar.gz" \
            "$(basename "$BATON2_RECOVERY_GENERATOR_ROOT")"

      - name: Bind recovery component evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, shutil, subprocess
          run = pathlib.Path(os.environ['BATON2_RECOVERY_RUN'])
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          selection = json.loads((run / 'recovery-c-selection.json').read_text())
          queue_selection = dict(
              line.partition('=')[::2]
              for line in (run / 'queue-selection.txt').read_text().splitlines())
          proof_path = pathlib.Path(os.environ['BATON2_RECOVERY_BUNDLE']) / 'recovery-c-reuse.json'
          proof = json.loads(proof_path.read_text())
          binary = run / 'baton-recovery'
          generated = run / 'baton-recovery.c'
          queue_client = run / 'compile-queue-runner'
          shutil.copyfile(binary, run / 'artifact/baton-recovery')
          shutil.copyfile(queue_client, run / 'artifact/compile-queue-runner')
          shutil.copyfile(proof_path, run / 'artifact/recovery-c-reuse.json')
          shutil.copyfile(run / 'recovery-c-selection.json', run / 'artifact/recovery-c-selection.json')
          shutil.copyfile(run / 'source-closure.json', run / 'artifact/source-closure.json')
          for name in ('clang.txt', 'darwin-c-toolchain.txt', 'source-commit.txt', 'source-tree.txt', 'source-closure.stdout',
                       'build.stdout', 'build.stderr', 'output.sha256'):
              shutil.copyfile(run / name, run / 'artifact' / name)
          for name in ('queue-bootstrap.telemetry', 'queue-bootstrap.stdout',
                       'queue-bootstrap.stderr', 'queue-selection.txt', 'queue-client.sha256'):
              path = run / name
              if path.is_file():
                  shutil.copyfile(path, run / 'artifact' / name)
          queue_root = run / 'queue-run'
          if queue_root.is_dir():
              shutil.copytree(queue_root, run / 'artifact/queue-run')
          current = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], cwd=root, text=True).strip()
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = {
              'schema': 'baton2-native-component-v1', 'role': 'recovery-helper',
              'platform': {'system': platform.system(), 'machine': platform.machine(), 'artifact': 'darwin-arm64'},
              'source': {'commit': current, 'tree': tree, 'status': ''},
              'source_closure': {'path': 'source-closure.json', 'sha256': digest(run / 'artifact/source-closure.json'),
                                 'files': len(json.loads((run / 'source-closure.json').read_text())['files']),
                                 'recovery_entry_digest': selection['selected_source_digest'],
                                 'recovery_entry_files': selection['selected_source_closure_file_count']},
              'entry': 'bend2/src/coordinator/receive-recovery-focused.bend',
              'build_mode': 'recovery-native-entry',
              'proof': {'path': 'recovery-c-reuse.json', 'sha256': digest(proof_path),
                        'source_commit': proof['current_source_commit'],
                        'source_tree': proof['current_source_tree'],
                        'source_digest': proof['current_source_digest'],
                        'generated_c_sha256': proof['generated_c_sha256'],
                        'selected_c_sha256': selection['selected_c_sha256']},
              'binary': {'path': 'baton-recovery', 'sha256': digest(run / 'artifact/baton-recovery'),
                         'bytes': (run / 'artifact/baton-recovery').stat().st_size},
              'generated_c': {'path': 'recovery-proof-inputs.tar.gz::recovery-c-origin/baton-recovery.c',
                              'sha256': proof['generated_c_sha256'], 'bytes': 54109723},
              'original_cgen_c': {'sha256': proof['captured_cgen']['generated_c_sha256'], 'bytes': 54103848},
              'proof_inputs_bundle': {'path': 'recovery-proof-inputs.tar.gz',
                                      'sha256': digest(run / 'artifact/recovery-proof-inputs.tar.gz')},
              'generator_root_bundle': {'path': 'recovery-generator-root.tar.gz',
                                        'sha256': digest(run / 'artifact/recovery-generator-root.tar.gz'),
                                        'source_commit': proof['captured_cgen']['generator']['source_commit'],
                                        'source_tree': proof['captured_cgen']['generator']['source_tree'],
                                        'manifest_sha256': proof['captured_cgen']['generator']['manifest_sha256']},
              'compiler': {'archive_sha256': 'c5bb22ba029d5909da9c6db82aa037278a66d1cf8a5572f433879f7dcd866c31',
                           'binary_sha256': (run / 'toolchain/compiler.sha256').read_text().split()[0]},
              'queue': {'admission': 'shared compile queue through bend2/scripts/build-native.sh',
                        'client_sha256': (run / 'queue-client.sha256').read_text().split()[0],
                        'client_source_commit': queue_selection['queue_source_commit'],
                        'client_source_tree': queue_selection['queue_source_tree'],
                        'state_root': queue_selection['queue_root'],
                        'state_group': queue_selection['queue_group'],
                        'bootstrap_used': (run / 'queue-bootstrap.telemetry').is_file(),
                        'bootstrap_telemetry_sha256': digest(run / 'queue-bootstrap.telemetry')
                            if (run / 'queue-bootstrap.telemetry').is_file() else None,
                        'evidence_path': 'queue-run',
                        'invocations': sorted(path.name for path in queue_root.glob('invocation.*'))},
          }
          (run / 'artifact/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Retain recovery component artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-recovery-darwin-arm64-ef0b8a5eb4da5d13f253ebe79b289dc22b2836cb-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baton2-recovery-darwin-${{ github.run_id }}-${{ github.run_attempt }}/artifact/
          if-no-files-found: error
          include-hidden-files: true

      - name: Persist recovery failure diagnostics
        if: ${{ failure() || cancelled() }}
        run: |
          set -euo pipefail
          umask 077
          run="${BATON2_RECOVERY_RUN:-$RUNNER_TEMP/baton2-recovery-darwin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}"
          helper="$RUNNER_TEMP/package-recovery-failure-diagnostics.py"
          git cat-file -e "$GITHUB_SHA^{commit}"
          git cat-file -e "$GITHUB_SHA:.github/scripts/package-recovery-failure-diagnostics.py"
          git show "$GITHUB_SHA:.github/scripts/package-recovery-failure-diagnostics.py" > "$helper"
          chmod 700 "$helper"
          python3 "$helper" \
            --run-root "$run" \
            --destination-root "$BATON2_RECOVERY_DIAGNOSTICS_ROOT" \
            --proof "$BATON2_RECOVERY_BUNDLE/recovery-c-reuse.json" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$BATON2_SOURCE_SHA" \
            --proof-sha256 "$BATON2_RECOVERY_PROOF_SHA256"

      - name: Upload recovery failure diagnostics
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton2-recovery-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}-failure-diagnostics
          path: ${{ env.BATON2_RECOVERY_DIAGNOSTICS_ROOT }}/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          include-hidden-files: true
