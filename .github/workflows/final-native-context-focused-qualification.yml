name: Final native and context focused qualification

on:
  push:
    branches:
      - codex/final-native-context-focused-validation-20261008

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: core
            source_sha: 9d1038b302c538edbf6a04c5dde9f2a853b35a8b
            source_tree: 3a6be79b4f0b9e737ff9ab8f4d498e3a9b1ec271
          - product: combined-context
            source_sha: a20b3f9a906bb4bc9f1b344739dfaef41cc704f9
            source_tree: 7012f4947994d5fd1eb0f1e36d36ffc2b10e088b
          - product: primary-removal
            source_sha: 31071dd12dfdacff8000cfd655b41271f15b7241
            source_tree: 690a8a2c6fbfd90358c0dd5041e3257d9233f876
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - name: Check out qualification driver
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check out pinned product source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.source_sha }}
          path: source
      - name: Verify product pins and create owned source clone
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/final-native-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.product }}"
          test ! -e "$evidence"
          mkdir -p "$evidence/logs" "$evidence/toolchain"
          printf 'FINAL_NATIVE_CONTEXT_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          {
            printf 'driver_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'driver_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'product=%s\n' '${{ matrix.product }}'
            printf 'expected_source_sha=%s\n' '${{ matrix.source_sha }}'
            printf 'expected_source_tree=%s\n' '${{ matrix.source_tree }}'
            uname -a
            uname -m
            lsb_release -a
            git --version
          } > "$evidence/logs/identity.txt" 2>&1
          actual_sha="$(git -C source rev-parse HEAD)"
          actual_tree="$(git -C source rev-parse 'HEAD^{tree}')"
          printf 'actual_source_sha=%s\nactual_source_tree=%s\n' "$actual_sha" "$actual_tree" \
            > "$evidence/logs/source-pin.txt"
          test "$actual_sha" = '${{ matrix.source_sha }}'
          test "$actual_tree" = '${{ matrix.source_tree }}'
          git -C source status --short --branch > "$evidence/logs/source-status.txt"
          git clone --no-hardlinks --quiet source owned
          git -C owned checkout --quiet --detach '${{ matrix.source_sha }}'
          test "$(git -C owned rev-parse HEAD)" = '${{ matrix.source_sha }}'
          test "$(git -C owned rev-parse 'HEAD^{tree}')" = '${{ matrix.source_tree }}'
          git -C owned status --short --branch > "$evidence/logs/owned-status.txt"
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Bend 2.0.25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FINAL_NATIVE_CONTEXT_EVIDENCE/curl-shim" "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home"
          cat > "$FINAL_NATIVE_CONTEXT_EVIDENCE/curl-shim/curl" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          output=''
          args=("$@")
          for ((index = 0; index < ${#args[@]}; index++)); do
            if [[ "${args[index]}" == '-o' && $((index + 1)) -lt ${#args[@]} ]]; then
              output="${args[index + 1]}"
            fi
          done
          /usr/bin/curl "${args[@]}"
          if [[ "$output" == */bend-2.0.25-linux-x64.tar.gz ]]; then
            cp "$output" "$BEND_ARCHIVE_CAPTURE"
          fi
          SH
          chmod 0755 "$FINAL_NATIVE_CONTEXT_EVIDENCE/curl-shim/curl"
          export BEND_ARCHIVE_CAPTURE="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/bend-2.0.25-linux-x64.tar.gz"
          PATH="$FINAL_NATIVE_CONTEXT_EVIDENCE/curl-shim:$PATH" \
            BEND_HOME="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home" \
            sh owned/docs/bend2/reference/toolchain/install-2.0.25.sh \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/install.log" 2>&1
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          "$bend" version > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/version.txt"
          test "$(cat "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/version.txt")" = 'bend 2.0.25'
          sha256sum "$bend" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/bend-binary.sha256"
          printf '91c0e2640f8d2e3e73fd3dd62ed4d178ce9a6f7ce8f8980b4dc4abf7a6f9ccd4  %s\n' \
            "$BEND_ARCHIVE_CAPTURE" | sha256sum -c - > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/archive-check.log"
          sha256sum "$BEND_ARCHIVE_CAPTURE" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/archive.sha256"
          tar -tzf "$BEND_ARCHIVE_CAPTURE" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/archive-members.txt"
      - name: Build production Main
        shell: bash
        run: |
          set -euo pipefail
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          mkdir -p owned/.scratch/bend2
          status=0
          set +e
          (cd owned && BEND="$bend" CC=clang sh bend2/scripts/build-native.sh \
            bend2/src/coordinator/main.bend .scratch/bend2/baton2) \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.exit-status"
          test "$status" = 0
      - name: Run core behavior suites
        if: matrix.product == 'core'
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          evidence="$FINAL_NATIVE_CONTEXT_EVIDENCE/logs"
          run_py() {
            local label="$1"; shift
            local status=0
            set +e
            python3 "$@" > "$evidence/$label.stdout" 2> "$evidence/$label.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$evidence/$label.exit-status"
            sha256sum "$evidence/$label.stdout" "$evidence/$label.stderr" \
              "$evidence/$label.exit-status" > "$evidence/$label.sha256"
            return "$status"
          }
          failures=0
          for suite in logs turn process receive configure stop native-observation fixed-coordinator \
            ui-orchestra-native mcp-root mcp-contract mcp-command control-identity shared-instance \
            root-wake muse-root; do
            run_py "$suite" "bend2/test/$suite.py" || failures=$((failures + 1))
          done
          node_status=0
          set +e
          BATON2_REQUIRE_NATIVE_VIEW=1 BATON2_NATIVE_BINARY="$PWD/.scratch/bend2/baton2" \
            node --test bend2/test/context-provider.test.mjs bend2/test/provider-availability.mjs \
              bend2/test/ui-orchestra-server.test.mjs \
            > "$evidence/node-provider-ui.stdout" 2> "$evidence/node-provider-ui.stderr"
          node_status=$?
          set -e
          printf '%s\n' "$node_status" > "$evidence/node-provider-ui.exit-status"
          sha256sum "$evidence/node-provider-ui.stdout" "$evidence/node-provider-ui.stderr" \
            "$evidence/node-provider-ui.exit-status" > "$evidence/node-provider-ui.sha256"
          printf 'suite_failure_count=%s\nnode_status=%s\n' "$failures" "$node_status" \
            > "$evidence/core-summary.txt"
          test "$failures" = 0
          test "$node_status" = 0
      - name: Run combined context checks and fixtures
        if: matrix.product == 'combined-context'
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          evidence="$FINAL_NATIVE_CONTEXT_EVIDENCE/logs"
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          run_recorded() {
            local label="$1"; shift
            local status=0
            set +e
            "$@" > "$evidence/$label.stdout" 2> "$evidence/$label.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$evidence/$label.exit-status"
            sha256sum "$evidence/$label.stdout" "$evidence/$label.stderr" \
              "$evidence/$label.exit-status" > "$evidence/$label.sha256"
            return "$status"
          }
          failures=0
          run_recorded instance-check-only "$bend" bend2/test/instance.bend --check-only \
            || failures=$((failures + 1))
          run_recorded context-lifecycle env BEND="$bend" python3 bend2/test/context-lifecycle.py \
            || failures=$((failures + 1))
          run_recorded shared-instance env BEND="$bend" python3 bend2/test/shared-instance.py \
            || failures=$((failures + 1))
          run_recorded selected-context-package python3 bend2/test/package-selected-context.py \
            || failures=$((failures + 1))
          run_recorded context-project-policy node --test bend2/test/context-project-policy.test.mjs \
            || failures=$((failures + 1))
          run_recorded context-provider node --test bend2/test/context-provider.test.mjs \
            || failures=$((failures + 1))
          printf 'suite_failure_count=%s\n' "$failures" > "$evidence/context-summary.txt"
          test "$failures" = 0
      - name: Run primary removal behavior suites
        if: matrix.product == 'primary-removal'
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          evidence="$FINAL_NATIVE_CONTEXT_EVIDENCE/logs"
          run_py() {
            local label="$1"; shift
            local status=0
            set +e
            python3 "$@" > "$evidence/$label.stdout" 2> "$evidence/$label.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$evidence/$label.exit-status"
            sha256sum "$evidence/$label.stdout" "$evidence/$label.stderr" \
              "$evidence/$label.exit-status" > "$evidence/$label.sha256"
            return "$status"
          }
          failures=0
          for suite in logs turn process receive shared-instance native-observation; do
            run_py "$suite" "bend2/test/$suite.py" || failures=$((failures + 1))
          done
          run_py held-candidate bend2/test/land.py \
            Land.test_target_moving_under_a_held_candidate_blocks_and_keeps_it || failures=$((failures + 1))
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          replay_status=0
          for name in basis cursor vocabulary mutation stop; do
            module="bend2/src/replay/$name.bend"
            label="replay-$name"
            status=0
            set +e
            "$bend" --check-only "$module" \
              > "$evidence/$label.check.stdout" 2> "$evidence/$label.check.stderr"
            status=$?
            if [[ "$status" = 0 ]]; then
              "$bend" "$module" > "$evidence/$label.actual.txt" \
                2> "$evidence/$label.run.stderr"
              status=$?
            fi
            if [[ "$status" = 0 ]]; then cmp "$evidence/$label.actual.txt" "${module%.bend}.expected.txt"; status=$?; fi
            if [[ "$status" = 0 ]]; then
              "$bend" "$module" -o "$evidence/$label.native" \
                > "$evidence/$label.native-build.stdout" 2> "$evidence/$label.native-build.stderr"
              status=$?
            fi
            if [[ "$status" = 0 ]]; then
              "$evidence/$label.native" > "$evidence/$label.native-actual.txt" \
                2> "$evidence/$label.native-run.stderr"
              status=$?
            fi
            if [[ "$status" = 0 ]]; then cmp "$evidence/$label.native-actual.txt" "${module%.bend}.expected.txt"; status=$?; fi
            set -e
            printf '%s\n' "$status" > "$evidence/$label.exit-status"
            if [[ "$status" != 0 ]]; then replay_status=$((replay_status + 1)); fi
          done
          printf 'replay_failure_count=%s\n' "$replay_status" > "$evidence/replay-summary.txt"
          failures=$((failures + replay_status))
          printf 'suite_failure_count=%s\n' "$failures" > "$evidence/primary-summary.txt"
          test "$failures" = 0
      - name: Print failure logs
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for file in "$FINAL_NATIVE_CONTEXT_EVIDENCE"/logs/*.stderr; do
            printf '%s\n' "--- $file ---"
            cat "$file"
          done
          for file in "$FINAL_NATIVE_CONTEXT_EVIDENCE"/logs/*.stdout; do
            printf '%s\n' "--- $file ---"
            cat "$file"
          done
      - name: Retain complete qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-${{ matrix.product }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-native-context-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.product }}/
          if-no-files-found: warn
          retention-days: 14

  primary-darwin-main:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - name: Check out qualification driver
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check out pinned primary source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 31071dd12dfdacff8000cfd655b41271f15b7241
          path: source
      - name: Install pinned Bend and build production Main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = 31071dd12dfdacff8000cfd655b41271f15b7241
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 690a8a2c6fbfd90358c0dd5041e3257d9233f876
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          root="$RUNNER_TEMP/final-native-context-darwin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$root"
          mkdir -p "$root/toolchain" "$root/runtime/bend2"
          printf 'DARWIN_EVIDENCE=%s\n' "$root" >> "$GITHUB_ENV"
          archive="$root/toolchain/bend-2.0.25-darwin-arm64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/bendlang/bend/releases/download/v2.0.25/bend-2.0.25-darwin-arm64.tar.gz \
            -o "$archive" > "$root/toolchain/download.log" 2>&1
          printf 'c5bb22ba029d5909da9c6db82aa037278a66d1cf8a5572f433879f7dcd866c31  %s\n' "$archive" | \
            shasum -a 256 -c - > "$root/toolchain/archive-check.log" 2>&1
          tar -tzf "$archive" > "$root/toolchain/archive-members.txt"
          BEND_HOME="$root/toolchain-home" sh source/docs/bend2/reference/toolchain/install-2.0.25.sh \
            > "$root/toolchain/install.log" 2>&1
          bend="$root/toolchain-home/bin/bend"
          "$bend" version > "$root/toolchain/version.txt"
          test "$(cat "$root/toolchain/version.txt")" = 'bend 2.0.25'
          mkdir -p source/.scratch/bend2
          status=0
          set +e
          (cd source && BEND="$bend" CC=clang sh bend2/scripts/build-native.sh \
            bend2/src/coordinator/main.bend .scratch/bend2/baton2) \
            > "$root/logs-main-build.stdout" 2> "$root/logs-main-build.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$root/logs-main-build.exit-status"
          test "$status" = 0
          cp source/.scratch/bend2/baton2 "$root/runtime/bend2/baton2"
          cp -R source/bend2/ui "$root/runtime/bend2/ui"
          cp -R source/bend2/scripts "$root/runtime/bend2/scripts"
          cp -R source/bend2/context/bend2 "$root/runtime/bend2/context-bend2"
          {
            printf 'source_sha=%s\nsource_tree=%s\n' \
              "$(git -C source rev-parse HEAD)" "$(git -C source rev-parse 'HEAD^{tree}')"
            shasum -a 256 "$root/runtime/bend2/baton2"
          } > "$root/runtime/manifest.txt"
      - name: Retain Darwin build logs and downloadable runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: primary-darwin-main-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/final-native-context-darwin-${{ github.run_id }}-${{ github.run_attempt }}/runtime/
            ${{ runner.temp }}/final-native-context-darwin-${{ github.run_id }}-${{ github.run_attempt }}/logs-main-build.*
            ${{ runner.temp }}/final-native-context-darwin-${{ github.run_id }}-${{ github.run_attempt }}/toolchain/version.txt
            ${{ runner.temp }}/final-native-context-darwin-${{ github.run_id }}-${{ github.run_attempt }}/toolchain/archive-check.log
          if-no-files-found: warn
          retention-days: 14
