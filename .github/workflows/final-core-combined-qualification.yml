name: Consolidated native and context qualification

on:
  push:
    branches:
      - codex/final-native-context-core-combined-validation-20261008
  workflow_dispatch:
    inputs:
      product_run_id:
        description: Existing product build run containing the selected native binaries
        required: true
        type: string
      product_run_attempt:
        description: Attempt containing the selected native binaries
        required: true
        type: string
        default: '1'
      fixture_source_sha:
        description: Published fixture and UI source to exercise with retained native artifacts
        required: false
        type: string
      runtime_suite:
        description: One existing runtime suite to recheck; empty runs the full selection
        required: false
        type: string

permissions:
  actions: read
  contents: read

env:
  BEND_NO_TELEMETRY: '1'
  PRODUCT_SOURCE_SHA: ${{ inputs.fixture_source_sha || 'e178877a59c41e7cd673dd863dfeb7f198d382ca' }}
  PRODUCT_RUN_ID: ${{ inputs.product_run_id || github.run_id }}
  PRODUCT_RUN_ATTEMPT: ${{ inputs.product_run_attempt || github.run_attempt }}
  CANONICAL_DARWIN_RUN_ID: '38024136426'
  CANONICAL_DARWIN_SOURCE_SHA: 'e178877a59c41e7cd673dd863dfeb7f198d382ca'

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: [self-hosted, Linux, X64, baton2-native-linux-x64]
    steps:
      - name: Check out pinned product source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          path: owned
      - name: Prepare build output
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/final-native-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-combined-context"
          mkdir -p "$evidence/logs" "$evidence/toolchain"
          printf 'FINAL_NATIVE_CONTEXT_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          git -C owned rev-parse HEAD > "$evidence/logs/source-commit.txt"
          uname -a > "$evidence/logs/platform.txt"
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Bend 2.0.25
        shell: bash
        run: |
          set -euo pipefail
          BEND_HOME="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home" \
            sh owned/docs/bend2/reference/toolchain/install-2.0.25.sh \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/install.log" 2>&1
          "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" version \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/version.txt"
      - name: Build production Main
        id: main_build
        shell: bash
        run: |
          set -euo pipefail
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          mkdir -p owned/.scratch/bend2
          status=0
          set +e
          (
            cd owned || exit "$?"
            printf 'inherited-soft-stack-kib='
            ulimit -S -s
            printf 'inherited-hard-stack-kib='
            ulimit -H -s
            ulimit -S -s 65536
            printf 'compiler-soft-stack-kib='
            ulimit -S -s
            printf 'BUN_JSC_maxPerThreadStackUsage=67108864\n'
            BUN_JSC_maxPerThreadStackUsage=67108864 BEND="$bend" CC=clang-19 \
              sh bend2/scripts/build-native.sh \
              bend2/src/coordinator/main.bend .scratch/bend2/baton2
          ) \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.exit-status"
          test "$status" = 0
      - name: Build process and instance host test fixtures
        id: host_fixtures
        shell: bash
        run: |
          set -euo pipefail
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          for fixture in process instance; do
            status=0
            set +e
            (cd owned && BEND="$bend" CC=clang-19 sh bend2/scripts/build-native.sh \
              "bend2/test/$fixture.bend" ".scratch/bend2/$fixture-test") \
              > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/$fixture-fixture-build.stdout" \
              2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/$fixture-fixture-build.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" \
              > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/$fixture-fixture-build.exit-status"
            test "$status" = 0
          done
          cp "$bend" owned/.scratch/bend2/bend
          cp -R "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bend2/." owned/.scratch/bend2/
      - name: Retain shared native binaries
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: owned/.scratch/bend2/
          if-no-files-found: error
          retention-days: 14
      - name: Print failure logs
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for file in "$FINAL_NATIVE_CONTEXT_EVIDENCE"/logs/*.stderr; do
            printf '%s\n' "--- $file ---"
            cat "$file"
          done
          for file in "$FINAL_NATIVE_CONTEXT_EVIDENCE"/logs/*.stdout; do
            printf '%s\n' "--- $file ---"
            cat "$file"
          done
      - name: Retain complete qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-combined-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-native-context-${{ github.run_id }}-${{ github.run_attempt }}-combined-context/
          if-no-files-found: warn
          retention-days: 14

  darwin_publication:
    if: ${{ !cancelled() && !inputs.runtime_suite && github.event_name == 'push' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      original_run_json: ${{ steps.publication.outputs.original_run_json }}
    steps:
      - name: Await the original Darwin package publication
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$CANONICAL_DARWIN_RUN_ID" ]]; then
            exit 0
          fi
          original_run="$RUNNER_TEMP/original-darwin-run.json"
          while :; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANONICAL_DARWIN_RUN_ID" \
              > "$original_run"
            status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' \
              "$original_run")
            if [[ "$status" == completed ]]; then
              break
            fi
            sleep 60
          done
          original_run_json=$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])),separators=(",",":")))' "$original_run")
          printf 'original_run_json=%s\n' "$original_run_json" >> "$GITHUB_OUTPUT"
          conclusion=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["conclusion"])' "$original_run")
          printf 'Original Darwin run %s completed with conclusion %s\n' "$CANONICAL_DARWIN_RUN_ID" "$conclusion"
          if [[ "$conclusion" != success ]]; then
            cat "$original_run"
            exit 1
          fi

  darwin:
    if: ${{ !cancelled() && !inputs.runtime_suite && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success') && (github.event_name == 'workflow_dispatch' || needs.darwin_publication.result == 'success') }}
    needs: [build, darwin_publication]
    runs-on: macos-15
    steps:
      - name: Check out product source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          path: owned
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare Darwin output
        shell: bash
        env:
          ORIGINAL_DARWIN_RUN_JSON: ${{ needs.darwin_publication.outputs.original_run_json }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/final-native-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-darwin"
          mkdir -p "$evidence/toolchain"
          printf 'FINAL_NATIVE_CONTEXT_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            printf 'PACKAGE_DIRECTORY=%s/retained/package\n' "$evidence" >> "$GITHUB_ENV"
          else
            printf 'PACKAGE_DIRECTORY=%s/package\n' "$evidence" >> "$GITHUB_ENV"
          fi
          git -C owned rev-parse HEAD > "$evidence/source-commit.txt"
          uname -a > "$evidence/platform.txt"
          if [[ -n "$ORIGINAL_DARWIN_RUN_JSON" ]]; then
            printf '%s\n' "$ORIGINAL_DARWIN_RUN_JSON" > "$evidence/original-darwin-run.json"
          fi
      - name: Download the original Darwin package
        if: ${{ github.event_name == 'workflow_dispatch' || env.CANONICAL_DARWIN_RUN_ID }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('final-native-context-darwin-{0}-{1}', env.PRODUCT_RUN_ID, env.PRODUCT_RUN_ATTEMPT) || format('baton2-development-darwin-arm64-{0}-1', env.CANONICAL_DARWIN_SOURCE_SHA) }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && env.PRODUCT_RUN_ID || env.CANONICAL_DARWIN_RUN_ID }}
          repository: Flip-Engineering/baton
          github-token: ${{ github.token }}
          path: ${{ env.FINAL_NATIVE_CONTEXT_EVIDENCE }}/retained
      - name: Install the selected TypeScript compiler
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-runtime" \
            --ignore-scripts --no-audit --no-fund typescript@5.9.3 \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-install.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-install.stderr"
      - name: Stage published assets with the retained Darwin executable
        if: ${{ github.event_name == 'workflow_dispatch' || env.CANONICAL_DARWIN_RUN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$FINAL_NATIVE_CONTEXT_EVIDENCE/package.stdout" 2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/package.stderr"
          import datetime
          import importlib.util
          import json
          import os
          from pathlib import Path
          import shutil
          import tarfile

          source = Path('owned').resolve()
          evidence = Path(os.environ['FINAL_NATIVE_CONTEXT_EVIDENCE'])
          retained = evidence / 'retained/package'
          output = evidence / 'package'
          output.mkdir()

          def load(name, filename):
              spec = importlib.util.spec_from_file_location(name, source / 'bend2/scripts' / filename)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          package = load('native_package', 'package-native.py')
          smoke = load('native_smoke', 'smoke-native-artifact.py')
          archive = next(retained.glob('baton2-development-darwin-arm64-*.tar.gz'))
          digest = (retained / 'SHA256SUMS').read_text().split()[0]
          smoke.require(smoke.archive_digest(archive) == digest,
                        'Archive does not match the advertised SHA256')
          payload, manifest = smoke.extract(archive, retained / 'manifest.json', output)
          native_source = manifest['binary'].get('source', manifest['source'])
          asset_source = {'directory': str(source), **package.source_identity()}
          shutil.rmtree(payload / 'libexec/baton2')
          package.stage_adapters(payload)
          typescript = source / 'bend2/context/typescript/selected-module.json'
          declaration = json.loads(typescript.read_text())
          module_root = payload / 'lib/context/modules' / package.module_directory_name(declaration['moduleId'])
          if module_root.exists():
              shutil.rmtree(module_root)
          selected = package.stage_typescript_context_module(
              payload, evidence / 'typescript-runtime/node_modules/typescript')
          manifest['selected_modules'] = [item for item in manifest['selected_modules']
                                          if item['path'] != selected['path']] + [selected]
          manifest['binary']['source'] = native_source
          manifest['source'] = asset_source
          manifest['created_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          manifest['assets'] = {
              'path': 'libexec/baton2', 'source': asset_source,
              'retained_archive': {
                  'path': str(archive), 'sha256': digest,
                  'product_run_id': (os.environ['PRODUCT_RUN_ID'] if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                                     else os.environ['CANONICAL_DARWIN_RUN_ID']),
                  'product_run_attempt': (os.environ['PRODUCT_RUN_ATTEMPT'] if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                                         else '1'),
              },
          }
          package.write_json(payload / 'manifest.json', manifest)
          shutil.copyfile(payload / 'manifest.json', output / 'manifest.json')
          if (retained / 'build').is_dir():
              shutil.copytree(retained / 'build', output / 'build')
          destination = output / (manifest['archive_root'] + '-' + asset_source['commit'] + '.tar.gz')
          with tarfile.open(destination, 'x:gz') as packed:
              packed.add(payload, arcname=manifest['archive_root'])
          archive_digest = package.sha256(destination)
          (output / 'SHA256SUMS').write_text(archive_digest + '  ' + destination.name + '\n')
          result = {
              'status': 'packaged', 'source': asset_source, 'native_source': native_source,
              'archive': {'path': destination.name, 'sha256': archive_digest},
              'manifest': {'path': 'manifest.json'},
          }
          package.write_json(output / 'result.json', result)
          print(json.dumps(result), flush=True)
          PY
          printf 'PACKAGE_DIRECTORY=%s/package\n' "$FINAL_NATIVE_CONTEXT_EVIDENCE" >> "$GITHUB_ENV"
      - name: Download generated production C from this build
        if: ${{ github.event_name == 'push' && !env.CANONICAL_DARWIN_RUN_ID }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: final-native-context-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: generated
      - name: Install Bend package notices
        if: ${{ github.event_name == 'push' && !env.CANONICAL_DARWIN_RUN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          BEND_HOME="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home" \
            sh owned/docs/bend2/reference/toolchain/install-2.0.25.sh \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/install.log" 2>&1
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/bendlang/bend/releases/download/v2.0.25/bend-2.0.25-darwin-arm64.tar.gz \
            -o "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/compiler.tar.gz"
      - name: Compile and package Darwin executable
        if: ${{ github.event_name == 'push' && !env.CANONICAL_DARWIN_RUN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          set +e
          python3 owned/bend2/scripts/package-native.py \
            --output "$FINAL_NATIVE_CONTEXT_EVIDENCE/package" \
            --bend "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" \
            --compiler-archive "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/compiler.tar.gz" \
            --context-typescript-package "$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-runtime/node_modules/typescript" \
            --generated-c "$GITHUB_WORKSPACE/generated/baton2.c" \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/package.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/package.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/package.exit-status"
          if [[ "$status" != 0 ]]; then
            cat "$FINAL_NATIVE_CONTEXT_EVIDENCE/package.stderr"
          fi
          exit "$status"
      - name: Exercise extracted Darwin package
        shell: bash
        run: |
          set -euo pipefail
          build="$GITHUB_WORKSPACE/owned"
          retained="$GITHUB_WORKSPACE/owned-retained"
          mv "$build" "$retained"
          trap 'mv "$retained" "$build"' EXIT
          archives=("$PACKAGE_DIRECTORY"/baton2-development-darwin-arm64-*.tar.gz)
          archive="${archives[0]}"
          archive_digest=$(awk '{print $1}' "$PACKAGE_DIRECTORY/SHA256SUMS")
          status=0
          set +e
          python3 "$retained/bend2/scripts/smoke-native-artifact.py" \
            --archive "$archive" --sha256 "$archive_digest" \
            --manifest "$PACKAGE_DIRECTORY/manifest.json" \
            --unavailable-source "$build" --output "$FINAL_NATIVE_CONTEXT_EVIDENCE/smoke" \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/smoke.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/smoke.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/smoke.exit-status"
          if [[ "$status" != 0 ]]; then
            cat "$FINAL_NATIVE_CONTEXT_EVIDENCE/smoke.stderr"
          fi
          exit "$status"
      - name: Retain Darwin package and output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-native-context-${{ github.run_id }}-${{ github.run_attempt }}-darwin/
          if-no-files-found: warn
          retention-days: 14

  runtime:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success') }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.runtime_suite && format('["{0}"]', inputs.runtime_suite) || '["land","recruit","mcp-command","mcp-root","mcp-contract","logs","turn","process","configure","native-observation","fixed-coordinator","control","retained-control","role-guard","messaging","naming","knowledge","native-cli","root-wake","codex-root","muse-root","omp-root","control-identity","shared-instance","ui-orchestra-native","ui-orchestra-browser","node-provider-ui","selected-context-package","observed-usage","stop","receive","receive-output","receive-terminal-boundary"]') }}
    steps:
      - name: Check out pinned product source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          path: owned
      - name: Prepare runtime output
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/final-native-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.suite }}"
          mkdir -p "$evidence/logs"
          printf 'FINAL_NATIVE_CONTEXT_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          {
            printf 'fixture_source_commit=%s\n' "$(git -C owned rev-parse HEAD)"
            printf 'build_run=%s/%s\n' "$PRODUCT_RUN_ID" "$PRODUCT_RUN_ATTEMPT"
            uname -a
          } > "$evidence/logs/runtime.txt"
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Download shared native binaries
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: final-native-context-binaries-${{ env.PRODUCT_RUN_ID }}-${{ env.PRODUCT_RUN_ATTEMPT }}
          run-id: ${{ env.PRODUCT_RUN_ID }}
          repository: Flip-Engineering/baton
          github-token: ${{ github.token }}
          path: owned/.scratch/bend2
      - name: Prepare binaries and test output capture
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 owned/.scratch/bend2/baton2 owned/.scratch/bend2/process-test \
            owned/.scratch/bend2/instance-test owned/.scratch/bend2/bend
          evidence="$FINAL_NATIVE_CONTEXT_EVIDENCE"
          cat > "$evidence/run-recorded.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="$1"
          shift
          evidence="$FINAL_NATIVE_CONTEXT_EVIDENCE/logs"
          status=0
          set +e
          "$@" > >(tee "$evidence/$label.stdout") \
            2> >(tee "$evidence/$label.stderr" >&2)
          status=$?
          wait
          set -e
          printf '%s\n' "$status" > "$evidence/$label.exit-status"
          if [[ "$status" != 0 ]]; then
            printf '%s\n' "--- $label stdout ---"
            cat "$evidence/$label.stdout"
            printf '%s\n' "--- $label stderr ---"
            cat "$evidence/$label.stderr"
          fi
          exit "$status"
          SH
          chmod 0755 "$evidence/run-recorded.sh"
      - name: Run existing Guidance and ACK cases
        if: ${{ !cancelled() && matrix.suite == 'receive' }}
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" receive-guidance \
            env PYTHONUNBUFFERED=1 BEND="$PWD/.scratch/bend2/bend" \
            python3 -u bend2/test/receive.py -v \
              Receive.test_completed_omp_attempt_replay_leaves_guidance_for_current_native \
              Receive.test_guidance_arrives_while_retained_native_is_silent \
              Receive.test_failed_continuation_retains_original_input_for_retry
      - name: Retain Guidance and ACK output before recovery and the full suite
        if: ${{ always() && matrix.suite == 'receive' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-receive-guidance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FINAL_NATIVE_CONTEXT_EVIDENCE }}/logs/receive-guidance.*
          if-no-files-found: warn
          retention-days: 14
      - name: Run existing provider continuation cases before observer recovery
        if: ${{ !cancelled() && matrix.suite == 'receive' }}
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" receive-provider-continuation \
            env PYTHONUNBUFFERED=1 BEND="$PWD/.scratch/bend2/bend" \
            python3 -u bend2/test/receive.py -v \
              Receive.test_codex_direct_hands_off_to_the_next_profile_and_resumes_the_same_native \
              Receive.test_codex_direct_chains_two_handoffs_with_distinct_reports \
              Receive.test_codex_recovered_direct_hands_off_to_the_next_profile \
              Receive.test_omp_direct_retries_the_same_conversation_after_a_rate_refusal \
              Receive.test_omp_rate_error_continues_same_conversation_without_new_account \
              Receive.test_omp_direct_continues_after_a_settled_socket_closure \
              Receive.test_omp_socket_closure_continues_the_accepted_task \
              Receive.test_muse_transport_timeout_continues_the_accepted_task \
              Receive.test_omp_usage_window_exhaustion_keeps_its_account_failure
      - name: Retain provider continuation output before observer recovery and the full suite
        if: ${{ always() && matrix.suite == 'receive' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-receive-provider-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FINAL_NATIVE_CONTEXT_EVIDENCE }}/logs/receive-provider-continuation.*
          if-no-files-found: warn
          retention-days: 14
      - name: Run existing observer recovery cases
        if: ${{ !cancelled() && matrix.suite == 'receive' }}
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" receive-observer-recovery \
            env PYTHONUNBUFFERED=1 BEND="$PWD/.scratch/bend2/bend" \
            python3 -u bend2/test/receive.py -v \
              Receive.test_completed_orphan_observer_recovers_original_and_pending_input \
              Receive.test_completed_orphan_observer_recovery_preserves_explicit_stop \
              Receive.test_completed_live_keeper_observer_handoff_recovers_original_and_pending_input
      - name: Retain observer recovery output before the full suite
        if: ${{ always() && matrix.suite == 'receive' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-receive-observer-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FINAL_NATIVE_CONTEXT_EVIDENCE }}/logs/receive-observer-recovery.*
          if-no-files-found: warn
          retention-days: 14
      - name: Run existing coordinator failure isolation case before the full suite
        if: ${{ !cancelled() && matrix.suite == 'fixed-coordinator' }}
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" fixed-coordinator-isolation \
            env PYTHONUNBUFFERED=1 BEND="$PWD/.scratch/bend2/bend" \
            python3 -u bend2/test/fixed-coordinator.py -v \
              FixedCoordinator.test_12_failed_session_keeps_other_sessions_and_subscription_active
      - name: Retain coordinator failure isolation output before the full suite
        if: ${{ always() && matrix.suite == 'fixed-coordinator' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-fixed-coordinator-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FINAL_NATIVE_CONTEXT_EVIDENCE }}/logs/fixed-coordinator-isolation.*
          if-no-files-found: warn
          retention-days: 14
      - name: Run selected suite
        id: suite
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          case '${{ matrix.suite }}' in
            ui-orchestra-browser)
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" ui-orchestra-browser \
                env PYTHONUNBUFFERED=1 BATON2_REQUIRE_NATIVE_VIEW=1 BATON2_NATIVE_BINARY="$PWD/.scratch/bend2/baton2" \
                python3 -u bend2/test/ui-orchestra-browser.py -v
              ;;
            node-provider-ui)
              trap 'if test -d .scratch/cdp-lane; then cp -R .scratch/cdp-lane "$FINAL_NATIVE_CONTEXT_EVIDENCE/runtime-cdp"; fi' EXIT
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" node-provider-ui \
                env BATON2_REQUIRE_NATIVE_VIEW=1 BATON2_NATIVE_BINARY="$PWD/.scratch/bend2/baton2" \
                node --test bend2/test/context-provider.test.mjs bend2/test/provider-availability.mjs \
                  bend2/test/ui-orchestra-server.test.mjs bend2/test/context-project-policy.test.mjs
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" runtime-cdp \
                node bend2/context/runtime/cdp-tests.mjs
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" runtime-values \
                env BATON_RUNTIME_EVIDENCE_DIR="$FINAL_NATIVE_CONTEXT_EVIDENCE/runtime-values" \
                node --test bend2/tests/runtime/values.test.mjs bend2/tests/runtime/observations.test.mjs \
                  bend2/tests/runtime/source-maps.test.mjs bend2/tests/runtime/cdp-composition.test.mjs
              ;;
            selected-context-package)
              cat > "$FINAL_NATIVE_CONTEXT_EVIDENCE/build-selected-clang.sh" <<'SH'
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/baton-context-llvm.asc > /dev/null
          printf '%s\n' 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' \
            | sudo tee /etc/apt/sources.list.d/baton-context-llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-20 llvm-20-dev libclang-20-dev libclang-cpp20-dev
          clang-20 --version
          build="$FINAL_NATIVE_CONTEXT_EVIDENCE/clang-build"
          runtime="$FINAL_NATIVE_CONTEXT_EVIDENCE/clang-runtime"
          cmake -S bend2/context/clang/extractor -B "$build" -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm \
            -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON '-DCMAKE_INSTALL_RPATH=$ORIGIN/lib'
          cmake --build "$build" --target context-clang-20
          mkdir -p "$runtime/lib"
          cp "$build/context-clang-20" "$runtime/context-clang-20"
          ldd "$runtime/context-clang-20" \
            | tee "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/selected-clang-linked-libraries.txt"
          ldd "$runtime/context-clang-20" | awk '/=> \// {print $3}' \
            | while IFS= read -r library; do cp -L "$library" "$runtime/lib/"; done
          SH
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" selected-clang-build \
                bash "$FINAL_NATIVE_CONTEXT_EVIDENCE/build-selected-clang.sh"
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" selected-typescript-install \
                npm install --prefix "$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-runtime" \
                  --ignore-scripts --no-audit --no-fund typescript@5.9.3
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" selected-context-package \
                env PYTHONUNBUFFERED=1 \
                BATON2_CONTEXT_CLANG="$FINAL_NATIVE_CONTEXT_EVIDENCE/clang-runtime" \
                BATON2_CONTEXT_TYPESCRIPT="$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-runtime/node_modules/typescript" \
                python3 -u bend2/test/package-selected-context.py -v
              ;;
            retained-control)
              if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
                "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" process-fixture-build \
                  env BEND="$PWD/.scratch/bend2/bend" CC=clang \
                  sh bend2/scripts/build-native.sh bend2/test/process.bend .scratch/bend2/process-test
              fi
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" retained-control \
                env PYTHONUNBUFFERED=1 BEND="$PWD/.scratch/bend2/bend" \
                python3 -u bend2/test/retained-control.py -v
              ;;
            *)
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" '${{ matrix.suite }}' \
                env PYTHONUNBUFFERED=1 BEND="$PWD/.scratch/bend2/bend" \
                python3 -u "bend2/test/${{ matrix.suite }}.py" -v
              ;;
          esac
      - name: Retain suite failure output
        if: ${{ always() && steps.suite.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/final-native-context-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}/logs/
            /tmp/fixed676-*/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain suite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-native-context-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}/
          if-no-files-found: warn
          retention-days: 14
