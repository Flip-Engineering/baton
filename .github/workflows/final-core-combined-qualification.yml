name: Consolidated native and context qualification

on:
  push:
    branches:
      - codex/final-native-context-core-combined-validation-20261008
  workflow_dispatch:
    inputs:
      product_run_id:
        description: Existing product build run containing the selected native binaries
        required: true
        type: string
      product_run_attempt:
        description: Attempt containing the selected native binaries
        required: true
        type: string
        default: '1'
      fixture_source_sha:
        description: Published fixture and UI source to exercise with retained native artifacts
        required: false
        type: string

permissions:
  actions: read
  contents: read

env:
  BEND_NO_TELEMETRY: '1'
  PRODUCT_SOURCE_SHA: ${{ inputs.fixture_source_sha || 'b4a859ed0246dec1ba5468034114f321843aed66' }}
  PRODUCT_RUN_ID: ${{ inputs.product_run_id || github.run_id }}
  PRODUCT_RUN_ATTEMPT: ${{ inputs.product_run_attempt || github.run_attempt }}

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: [self-hosted, Linux, X64, baton2-native-linux-x64]
    steps:
      - name: Check out pinned product source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          path: owned
      - name: Prepare build output
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/final-native-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-combined-context"
          mkdir -p "$evidence/logs" "$evidence/toolchain"
          printf 'FINAL_NATIVE_CONTEXT_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          git -C owned rev-parse HEAD > "$evidence/logs/source-commit.txt"
          uname -a > "$evidence/logs/platform.txt"
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Bend 2.0.25
        shell: bash
        run: |
          set -euo pipefail
          BEND_HOME="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home" \
            sh owned/docs/bend2/reference/toolchain/install-2.0.25.sh \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/install.log" 2>&1
          "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" version \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/version.txt"
      - name: Build production Main
        id: main_build
        shell: bash
        run: |
          set -euo pipefail
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          mkdir -p owned/.scratch/bend2
          status=0
          set +e
          (
            cd owned || exit "$?"
            printf 'inherited-soft-stack-kib='
            ulimit -S -s
            printf 'inherited-hard-stack-kib='
            ulimit -H -s
            ulimit -S -s 65536
            printf 'compiler-soft-stack-kib='
            ulimit -S -s
            printf 'BUN_JSC_maxPerThreadStackUsage=67108864\n'
            BUN_JSC_maxPerThreadStackUsage=67108864 BEND="$bend" CC=clang-19 \
              sh bend2/scripts/build-native.sh \
              bend2/src/coordinator/main.bend .scratch/bend2/baton2
          ) \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.exit-status"
          test "$status" = 0
      - name: Build process and instance host test fixtures
        id: host_fixtures
        shell: bash
        run: |
          set -euo pipefail
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          for fixture in process instance; do
            status=0
            set +e
            (cd owned && BEND="$bend" CC=clang-19 sh bend2/scripts/build-native.sh \
              "bend2/test/$fixture.bend" ".scratch/bend2/$fixture-test") \
              > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/$fixture-fixture-build.stdout" \
              2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/$fixture-fixture-build.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" \
              > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/$fixture-fixture-build.exit-status"
            test "$status" = 0
          done
          cp "$bend" owned/.scratch/bend2/bend
          cp -R "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bend2/." owned/.scratch/bend2/
      - name: Retain shared native binaries
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: owned/.scratch/bend2/
          if-no-files-found: error
          retention-days: 14
      - name: Print failure logs
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for file in "$FINAL_NATIVE_CONTEXT_EVIDENCE"/logs/*.stderr; do
            printf '%s\n' "--- $file ---"
            cat "$file"
          done
          for file in "$FINAL_NATIVE_CONTEXT_EVIDENCE"/logs/*.stdout; do
            printf '%s\n' "--- $file ---"
            cat "$file"
          done
      - name: Retain complete qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-combined-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-native-context-${{ github.run_id }}-${{ github.run_attempt }}-combined-context/
          if-no-files-found: warn
          retention-days: 14

  darwin:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success') }}
    needs: build
    runs-on: macos-15
    steps:
      - name: Check out product source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          path: owned
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare Darwin output
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/final-native-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-darwin"
          mkdir -p "$evidence/toolchain"
          printf 'FINAL_NATIVE_CONTEXT_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            printf 'PACKAGE_DIRECTORY=%s/retained/package\n' "$evidence" >> "$GITHUB_ENV"
          else
            printf 'PACKAGE_DIRECTORY=%s/package\n' "$evidence" >> "$GITHUB_ENV"
          fi
          git -C owned rev-parse HEAD > "$evidence/source-commit.txt"
          uname -a > "$evidence/platform.txt"
      - name: Download retained Darwin package for fixture recheck
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: final-native-context-darwin-${{ env.PRODUCT_RUN_ID }}-${{ env.PRODUCT_RUN_ATTEMPT }}
          run-id: ${{ env.PRODUCT_RUN_ID }}
          repository: Flip-Engineering/baton
          github-token: ${{ github.token }}
          path: ${{ env.FINAL_NATIVE_CONTEXT_EVIDENCE }}/retained
      - name: Download generated production C from this build
        if: ${{ github.event_name == 'push' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: final-native-context-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: generated
      - name: Install Bend package notices
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          BEND_HOME="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home" \
            sh owned/docs/bend2/reference/toolchain/install-2.0.25.sh \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/install.log" 2>&1
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/bendlang/bend/releases/download/v2.0.25/bend-2.0.25-darwin-arm64.tar.gz \
            -o "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/compiler.tar.gz"
      - name: Install the selected TypeScript compiler
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-runtime" \
            --ignore-scripts --no-audit --no-fund typescript@5.9.3 \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-install.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-install.stderr"
      - name: Compile and package Darwin executable
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          set +e
          python3 owned/bend2/scripts/package-native.py \
            --output "$FINAL_NATIVE_CONTEXT_EVIDENCE/package" \
            --bend "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" \
            --compiler-archive "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/compiler.tar.gz" \
            --context-typescript-package "$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-runtime/node_modules/typescript" \
            --generated-c "$GITHUB_WORKSPACE/generated/baton2.c" \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/package.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/package.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/package.exit-status"
          if [[ "$status" != 0 ]]; then
            cat "$FINAL_NATIVE_CONTEXT_EVIDENCE/package.stderr"
          fi
          exit "$status"
      - name: Exercise extracted Darwin package
        shell: bash
        run: |
          set -euo pipefail
          build="$GITHUB_WORKSPACE/owned"
          retained="$GITHUB_WORKSPACE/owned-retained"
          mv "$build" "$retained"
          trap 'mv "$retained" "$build"' EXIT
          archives=("$PACKAGE_DIRECTORY"/baton2-development-darwin-arm64-*.tar.gz)
          archive="${archives[0]}"
          archive_digest=$(awk '{print $1}' "$PACKAGE_DIRECTORY/SHA256SUMS")
          status=0
          set +e
          python3 "$retained/bend2/scripts/smoke-native-artifact.py" \
            --archive "$archive" --sha256 "$archive_digest" \
            --manifest "$PACKAGE_DIRECTORY/manifest.json" \
            --unavailable-source "$build" --output "$FINAL_NATIVE_CONTEXT_EVIDENCE/smoke" \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/smoke.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/smoke.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/smoke.exit-status"
          if [[ "$status" != 0 ]]; then
            cat "$FINAL_NATIVE_CONTEXT_EVIDENCE/smoke.stderr"
          fi
          exit "$status"
      - name: Retain Darwin package and output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-native-context-${{ github.run_id }}-${{ github.run_attempt }}-darwin/
          if-no-files-found: warn
          retention-days: 14

  runtime:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success') }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON('["land","recruit","mcp-command","mcp-root","mcp-contract","logs","turn","process","configure","native-observation","fixed-coordinator","control","retained-control","role-guard","messaging","naming","knowledge","native-cli","root-wake","codex-root","muse-root","omp-root","control-identity","shared-instance","ui-orchestra-native","ui-orchestra-browser","node-provider-ui","selected-context-package","observed-usage","stop","receive","receive-output","receive-terminal-boundary"]') }}
    steps:
      - name: Check out pinned product source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          path: owned
      - name: Prepare runtime output
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/final-native-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.suite }}"
          mkdir -p "$evidence/logs"
          printf 'FINAL_NATIVE_CONTEXT_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          {
            printf 'fixture_source_commit=%s\n' "$(git -C owned rev-parse HEAD)"
            printf 'build_run=%s/%s\n' "$PRODUCT_RUN_ID" "$PRODUCT_RUN_ATTEMPT"
            uname -a
          } > "$evidence/logs/runtime.txt"
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Download shared native binaries
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: final-native-context-binaries-${{ env.PRODUCT_RUN_ID }}-${{ env.PRODUCT_RUN_ATTEMPT }}
          run-id: ${{ env.PRODUCT_RUN_ID }}
          repository: Flip-Engineering/baton
          github-token: ${{ github.token }}
          path: owned/.scratch/bend2
      - name: Prepare binaries and test output capture
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 owned/.scratch/bend2/baton2 owned/.scratch/bend2/process-test \
            owned/.scratch/bend2/instance-test owned/.scratch/bend2/bend
          evidence="$FINAL_NATIVE_CONTEXT_EVIDENCE"
          cat > "$evidence/run-recorded.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="$1"
          shift
          evidence="$FINAL_NATIVE_CONTEXT_EVIDENCE/logs"
          status=0
          set +e
          "$@" > >(tee "$evidence/$label.stdout") \
            2> >(tee "$evidence/$label.stderr" >&2)
          status=$?
          wait
          set -e
          printf '%s\n' "$status" > "$evidence/$label.exit-status"
          if [[ "$status" != 0 ]]; then
            printf '%s\n' "--- $label stdout ---"
            cat "$evidence/$label.stdout"
            printf '%s\n' "--- $label stderr ---"
            cat "$evidence/$label.stderr"
          fi
          exit "$status"
          SH
          chmod 0755 "$evidence/run-recorded.sh"
      - name: Run selected suite
        id: suite
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          case '${{ matrix.suite }}' in
            ui-orchestra-browser)
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" ui-orchestra-browser \
                env PYTHONUNBUFFERED=1 BATON2_REQUIRE_NATIVE_VIEW=1 BATON2_NATIVE_BINARY="$PWD/.scratch/bend2/baton2" \
                python3 -u bend2/test/ui-orchestra-browser.py -v
              ;;
            node-provider-ui)
              trap 'if test -d .scratch/cdp-lane; then cp -R .scratch/cdp-lane "$FINAL_NATIVE_CONTEXT_EVIDENCE/runtime-cdp"; fi' EXIT
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" node-provider-ui \
                env BATON2_REQUIRE_NATIVE_VIEW=1 BATON2_NATIVE_BINARY="$PWD/.scratch/bend2/baton2" \
                node --test bend2/test/context-provider.test.mjs bend2/test/provider-availability.mjs \
                  bend2/test/ui-orchestra-server.test.mjs bend2/test/context-project-policy.test.mjs
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" runtime-cdp \
                node bend2/context/runtime/cdp-tests.mjs
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" runtime-values \
                env BATON_RUNTIME_EVIDENCE_DIR="$FINAL_NATIVE_CONTEXT_EVIDENCE/runtime-values" \
                node --test bend2/tests/runtime/values.test.mjs bend2/tests/runtime/observations.test.mjs \
                  bend2/tests/runtime/source-maps.test.mjs bend2/tests/runtime/cdp-composition.test.mjs
              ;;
            selected-context-package)
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" selected-typescript-install \
                npm install --prefix "$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-runtime" \
                  --ignore-scripts --no-audit --no-fund typescript@5.9.3
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" selected-context-package \
                env PYTHONUNBUFFERED=1 \
                BATON2_CONTEXT_TYPESCRIPT="$FINAL_NATIVE_CONTEXT_EVIDENCE/typescript-runtime/node_modules/typescript" \
                python3 -u bend2/test/package-selected-context.py -v
              ;;
            *)
              "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" '${{ matrix.suite }}' \
                env PYTHONUNBUFFERED=1 BEND="$PWD/.scratch/bend2/bend" \
                python3 -u "bend2/test/${{ matrix.suite }}.py" -v
              ;;
          esac
      - name: Retain suite failure output
        if: ${{ always() && steps.suite.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/final-native-context-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}/logs/
            /tmp/fixed676-*/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain suite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-native-context-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}/
          if-no-files-found: warn
          retention-days: 14
