name: Consolidated native and context qualification

on:
  push:
    branches:
      - codex/final-native-context-core-combined-validation-20261008

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: combined-context
            source_sha: dd6e18083c161500fefc1bee0a07d4c3b99bc022
            source_tree: 8bd700a93aa1b4715ea189b966c6a4a2efabd155
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - name: Check out qualification driver
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check out pinned product source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.source_sha }}
          path: source
      - name: Verify product pins and create owned source clone
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/final-native-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.product }}"
          test ! -e "$evidence"
          mkdir -p "$evidence/logs" "$evidence/toolchain"
          printf 'FINAL_NATIVE_CONTEXT_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          cat > "$evidence/run-recorded.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="$1"
          shift
          evidence="$FINAL_NATIVE_CONTEXT_EVIDENCE/logs"
          status=0
          set +e
          "$@" > "$evidence/$label.stdout" 2> "$evidence/$label.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$evidence/$label.exit-status"
          sha256sum "$evidence/$label.stdout" "$evidence/$label.stderr" \
            "$evidence/$label.exit-status" > "$evidence/$label.sha256"
          exit "$status"
          SH
          chmod 0755 "$evidence/run-recorded.sh"
          {
            printf 'driver_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'driver_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'product=%s\n' '${{ matrix.product }}'
            printf 'expected_source_sha=%s\n' '${{ matrix.source_sha }}'
            printf 'expected_source_tree=%s\n' '${{ matrix.source_tree }}'
            uname -a
            uname -m
            lsb_release -a
            git --version
          } > "$evidence/logs/identity.txt" 2>&1
          actual_sha="$(git -C source rev-parse HEAD)"
          actual_tree="$(git -C source rev-parse 'HEAD^{tree}')"
          printf 'actual_source_sha=%s\nactual_source_tree=%s\n' "$actual_sha" "$actual_tree" \
            > "$evidence/logs/source-pin.txt"
          test "$actual_sha" = '${{ matrix.source_sha }}'
          test "$actual_tree" = '${{ matrix.source_tree }}'
          git -C source status --short --branch > "$evidence/logs/source-status.txt"
          git clone --no-hardlinks --quiet source owned
          git -C owned checkout --quiet --detach '${{ matrix.source_sha }}'
          test "$(git -C owned rev-parse HEAD)" = '${{ matrix.source_sha }}'
          test "$(git -C owned rev-parse 'HEAD^{tree}')" = '${{ matrix.source_tree }}'
          git -C owned status --short --branch > "$evidence/logs/owned-status.txt"
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Bend 2.0.25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FINAL_NATIVE_CONTEXT_EVIDENCE/curl-shim" "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home"
          cat > "$FINAL_NATIVE_CONTEXT_EVIDENCE/curl-shim/curl" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          output=''
          args=("$@")
          for ((index = 0; index < ${#args[@]}; index++)); do
            if [[ "${args[index]}" == '-o' && $((index + 1)) -lt ${#args[@]} ]]; then
              output="${args[index + 1]}"
            fi
          done
          /usr/bin/curl "${args[@]}"
          if [[ "$output" == */bend-2.0.25-linux-x64.tar.gz ]]; then
            cp "$output" "$BEND_ARCHIVE_CAPTURE"
          fi
          SH
          chmod 0755 "$FINAL_NATIVE_CONTEXT_EVIDENCE/curl-shim/curl"
          export BEND_ARCHIVE_CAPTURE="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/bend-2.0.25-linux-x64.tar.gz"
          PATH="$FINAL_NATIVE_CONTEXT_EVIDENCE/curl-shim:$PATH" \
            BEND_HOME="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home" \
            sh owned/docs/bend2/reference/toolchain/install-2.0.25.sh \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/install.log" 2>&1
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          "$bend" version > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/version.txt"
          test "$(cat "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/version.txt")" = 'bend 2.0.25'
          sha256sum "$bend" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/bend-binary.sha256"
          printf '91c0e2640f8d2e3e73fd3dd62ed4d178ce9a6f7ce8f8980b4dc4abf7a6f9ccd4  %s\n' \
            "$BEND_ARCHIVE_CAPTURE" | sha256sum -c - > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/archive-check.log"
          sha256sum "$BEND_ARCHIVE_CAPTURE" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/archive.sha256"
          tar -tzf "$BEND_ARCHIVE_CAPTURE" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain/archive-members.txt"
      - name: Check Python and browser JavaScript syntax
        id: syntax
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          status=0
          set +e
          python3 -m compileall -q bend2/test \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/python-compileall.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/python-compileall.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/python-compileall.exit-status"
          sha256sum "$FINAL_NATIVE_CONTEXT_EVIDENCE"/logs/python-compileall.* \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/python-compileall.sha256"
          test "$status" = 0
          status=0
          set +e
          node --check bend2/test/ui-orchestra-browser.mjs \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/browser-js-check.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/browser-js-check.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/browser-js-check.exit-status"
          sha256sum "$FINAL_NATIVE_CONTEXT_EVIDENCE"/logs/browser-js-check.* \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/browser-js-check.sha256"
          test "$status" = 0
      - name: Build production Main
        id: main_build
        shell: bash
        run: |
          set -euo pipefail
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          mkdir -p owned/.scratch/bend2
          status=0
          set +e
          (cd owned && BEND="$bend" CC=clang sh bend2/scripts/build-native.sh \
            bend2/src/coordinator/main.bend .scratch/bend2/baton2) \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.stdout" \
            2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/main-build.exit-status"
          test "$status" = 0
      - name: Build process and instance host test fixtures
        id: host_fixtures
        shell: bash
        run: |
          set -euo pipefail
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          for fixture in process instance; do
            status=0
            set +e
            (cd owned && BEND="$bend" CC=clang sh bend2/scripts/build-native.sh \
              "bend2/test/$fixture.bend" ".scratch/bend2/$fixture-test") \
              > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/$fixture-fixture-build.stdout" \
              2> "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/$fixture-fixture-build.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" \
              > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/$fixture-fixture-build.exit-status"
            test "$status" = 0
          done
      - name: Run landing test
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" land env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/land.py
      - name: Run MCP command test
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          bend="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend"
          "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" mcp-command \
            env BEND="$bend" python3 bend2/test/mcp-command.py
      - name: Run MCP root tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" mcp-root env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/mcp-root.py
      - name: Run MCP contract tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" mcp-contract env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/mcp-contract.py
      - name: Run Logs tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" logs env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/logs.py
      - name: Run Turn tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" turn env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/turn.py
      - name: Run Process tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" process env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/process.py
      - name: Run Receive tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" receive env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/receive.py
      - name: Run Receive output tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" receive-output env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/receive-output.py
      - name: Run Receive terminal boundary tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" receive-terminal-boundary env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/receive-terminal-boundary.py
      - name: Run Configure tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" configure env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/configure.py
      - name: Run Stop tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" stop env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/stop.py
      - name: Run Native observation tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" native-observation env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/native-observation.py
      - name: Run Fixed coordinator tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" fixed-coordinator env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/fixed-coordinator.py
      - name: Run Control tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" control env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/control.py
      - name: Run Retained control tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" retained-control env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/retained-control.py
      - name: Run Role guard tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" role-guard env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/role-guard.py
      - name: Run Root wake tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" root-wake env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/root-wake.py
      - name: Run Codex root tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" codex-root env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/codex-root.py
      - name: Run Muse root tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" muse-root env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/muse-root.py
      - name: Run OMP root tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" omp-root env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/omp-root.py
      - name: Run Control identity tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" control-identity env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/control-identity.py
      - name: Run Shared instance tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" shared-instance env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/shared-instance.py
      - name: Run UI native tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" ui-orchestra-native env BEND="$FINAL_NATIVE_CONTEXT_EVIDENCE/toolchain-home/bin/bend" python3 bend2/test/ui-orchestra-native.py
      - name: Run UI browser tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          { command -v chromium || command -v chromium-browser || command -v google-chrome || true; node --version; } \
            > "$FINAL_NATIVE_CONTEXT_EVIDENCE/logs/browser-runtime.txt" 2>&1
          "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" ui-orchestra-browser \
            env BATON2_REQUIRE_NATIVE_VIEW=1 BATON2_NATIVE_BINARY="$PWD/.scratch/bend2/baton2" \
            python3 bend2/test/ui-orchestra-browser.py
      - name: Run MCP and provider UI tests
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd owned
          "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" node-provider-ui \
            env BATON2_REQUIRE_NATIVE_VIEW=1 BATON2_NATIVE_BINARY="$PWD/.scratch/bend2/baton2" \
            node --test bend2/test/context-provider.test.mjs bend2/test/provider-availability.mjs \
              bend2/test/ui-orchestra-server.test.mjs bend2/test/context-project-policy.test.mjs
      - name: Run selected context package test
        if: always() && steps.syntax.outcome == 'success' && steps.main_build.outcome == 'success' && steps.host_fixtures.outcome == 'success'
        shell: bash
        run: cd owned && "$FINAL_NATIVE_CONTEXT_EVIDENCE/run-recorded.sh" selected-context-package python3 bend2/test/package-selected-context.py
      - name: Print failure logs
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for file in "$FINAL_NATIVE_CONTEXT_EVIDENCE"/logs/*.stderr; do
            printf '%s\n' "--- $file ---"
            cat "$file"
          done
          for file in "$FINAL_NATIVE_CONTEXT_EVIDENCE"/logs/*.stdout; do
            printf '%s\n' "--- $file ---"
            cat "$file"
          done
      - name: Retain complete qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-native-context-${{ matrix.product }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-native-context-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.product }}/
          if-no-files-found: warn
          retention-days: 14
