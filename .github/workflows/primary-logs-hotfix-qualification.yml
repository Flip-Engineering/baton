name: Primary Logs hotfix qualification

on:
  push:
    branches:
      - codex/primary-logs-no-budgets-qualification-20261008

permissions:
  contents: read

jobs:
  logs-and-turn:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: primary53
            source_sha: 53a2356ab6e397c129253f1f53525219390dc63b
            source_tree: 797661732f302eee07c4847905b462c00fe8df2f
            migration: target
          - product: logs-hotfix
            source_sha: 5e434c3968728a78f81cfc1719f5680a25917e73
            source_tree: 745763833b721c905db1cdca0d7059cb9dbdf839
            migration: candidate
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - name: Check out qualification driver
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check out pinned source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.source_sha }}
          path: source
      - name: Record pins and create owned source clone
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/primary-logs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.product }}"
          test ! -e "$evidence"
          mkdir -p "$evidence/logs" "$evidence/toolchain"
          printf 'PRIMARY_LOGS_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          {
            printf 'driver_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'driver_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'expected_source_sha=%s\n' '${{ matrix.source_sha }}'
            printf 'expected_source_tree=%s\n' '${{ matrix.source_tree }}'
            printf 'product=%s\n' '${{ matrix.product }}'
            uname -a
            uname -m
            lsb_release -a
            git --version
          } > "$evidence/logs/identity.txt" 2>&1
          actual_sha="$(git -C source rev-parse HEAD)"
          actual_tree="$(git -C source rev-parse 'HEAD^{tree}')"
          printf 'actual_source_sha=%s\nactual_source_tree=%s\n' "$actual_sha" "$actual_tree" \
            > "$evidence/logs/source-pin.txt"
          test "$actual_sha" = '${{ matrix.source_sha }}'
          test "$actual_tree" = '${{ matrix.source_tree }}'
          git -C source status --short --branch > "$evidence/logs/source-status.txt"
          git clone --no-hardlinks --quiet source owned
          git -C owned checkout --quiet --detach '${{ matrix.source_sha }}'
          test "$(git -C owned rev-parse HEAD)" = '${{ matrix.source_sha }}'
          test "$(git -C owned rev-parse 'HEAD^{tree}')" = '${{ matrix.source_tree }}'
          git -C owned status --short --branch > "$evidence/logs/owned-status.txt"
      - name: Install pinned Bend 2.0.25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PRIMARY_LOGS_EVIDENCE/curl-shim" "$PRIMARY_LOGS_EVIDENCE/toolchain-home"
          cat > "$PRIMARY_LOGS_EVIDENCE/curl-shim/curl" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          output=''
          args=("$@")
          for ((index = 0; index < ${#args[@]}; index++)); do
            if [[ "${args[index]}" == '-o' && $((index + 1)) -lt ${#args[@]} ]]; then
              output="${args[index + 1]}"
            fi
          done
          /usr/bin/curl "${args[@]}"
          if [[ "$output" == */bend-2.0.25-linux-x64.tar.gz ]]; then
            cp "$output" "$BEND_ARCHIVE_CAPTURE"
          fi
          SH
          chmod 0755 "$PRIMARY_LOGS_EVIDENCE/curl-shim/curl"
          export BEND_ARCHIVE_CAPTURE="$PRIMARY_LOGS_EVIDENCE/toolchain/bend-2.0.25-linux-x64.tar.gz"
          PATH="$PRIMARY_LOGS_EVIDENCE/curl-shim:$PATH" \
            BEND_HOME="$PRIMARY_LOGS_EVIDENCE/toolchain-home" \
            sh owned/docs/bend2/reference/toolchain/install-2.0.25.sh \
            > "$PRIMARY_LOGS_EVIDENCE/toolchain/install.log" 2>&1
          bend="$PRIMARY_LOGS_EVIDENCE/toolchain-home/bin/bend"
          "$bend" version > "$PRIMARY_LOGS_EVIDENCE/toolchain/version.txt"
          test "$(cat "$PRIMARY_LOGS_EVIDENCE/toolchain/version.txt")" = 'bend 2.0.25'
          sha256sum "$bend" > "$PRIMARY_LOGS_EVIDENCE/toolchain/bend-binary.sha256"
          printf '91c0e2640f8d2e3e73fd3dd62ed4d178ce9a6f7ce8f8980b4dc4abf7a6f9ccd4  %s\n' \
            "$BEND_ARCHIVE_CAPTURE" | sha256sum -c - > "$PRIMARY_LOGS_EVIDENCE/toolchain/archive-check.log"
          sha256sum "$BEND_ARCHIVE_CAPTURE" > "$PRIMARY_LOGS_EVIDENCE/toolchain/archive.sha256"
          tar -tzf "$BEND_ARCHIVE_CAPTURE" > "$PRIMARY_LOGS_EVIDENCE/toolchain/archive-members.txt"
      - name: Build production Main
        shell: bash
        run: |
          set -euo pipefail
          bend="$PRIMARY_LOGS_EVIDENCE/toolchain-home/bin/bend"
          mkdir -p owned/.scratch/bend2
          set +e
          (cd owned && BEND="$bend" CC=clang sh bend2/scripts/build-native.sh \
            bend2/src/coordinator/main.bend .scratch/bend2/baton2) \
            > "$PRIMARY_LOGS_EVIDENCE/logs/build.stdout" \
            2> "$PRIMARY_LOGS_EVIDENCE/logs/build.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$PRIMARY_LOGS_EVIDENCE/logs/build.exit-status"
          test "$status" = 0
      - name: Run selected Logs and Turn behavior on target and candidate
        shell: bash
        run: |
          set -euo pipefail
          common_logs=(
            Logs.test_default_policy_drops_snapshot_frames_and_keeps_evidence
            Logs.test_diagnostic_level_keeps_snapshot_frames
            Logs.test_quiet_level_keeps_terminal_and_unclassified_frames_alone
            Logs.test_cleanup_removes_only_reported_settled_attempt_diagnostics
            Logs.test_attempt_without_durable_turn_record_is_retained
            Logs.test_failed_native_turn_retains_attempt_diagnostics
            Logs.test_attempt_with_pending_input_is_retained
            Logs.test_diagnostic_policy_retains_attempt_files
            Logs.test_attempt_cleanup_rejects_symlink_diagnostic_file
            Logs.test_interrupted_tool_call_keeps_only_its_last_update
            Logs.test_message_start_is_kept_only_without_its_message_end
            Logs.test_abrupt_observer_exit_preserves_latest_incomplete_frame
            Logs.test_later_direct_turn_preserves_an_earlier_checkpoint
            Logs.test_unfinished_assistant_message_keeps_latest_update
            Logs.test_unwritable_log_reports_the_failure_and_keeps_the_report
          )
          if [[ '${{ matrix.migration }}' == candidate ]]; then
            common_logs+=(
              Logs.test_policy_read_and_level_setting
              Logs.test_existing_policy_migrates_to_level_only_schema_and_keeps_registry
              Logs.test_failed_migration_preserves_original_rows_and_refuses_success
              Logs.test_cleanup_during_a_live_turn_keeps_registered_output
            )
          else
            common_logs+=(Logs.test_cleanup_during_a_live_turn_keeps_the_live_log)
          fi
          run_test() {
            local label="$1"
            shift
            local status=0
            set +e
            (cd owned && python3 bend2/test/logs.py "$@") \
              > "$PRIMARY_LOGS_EVIDENCE/logs/$label.stdout" \
              2> "$PRIMARY_LOGS_EVIDENCE/logs/$label.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$PRIMARY_LOGS_EVIDENCE/logs/$label.exit-status"
            sha256sum "$PRIMARY_LOGS_EVIDENCE/logs/$label.stdout" \
              "$PRIMARY_LOGS_EVIDENCE/logs/$label.stderr" \
              "$PRIMARY_LOGS_EVIDENCE/logs/$label.exit-status" \
              > "$PRIMARY_LOGS_EVIDENCE/logs/$label.sha256"
            return "$status"
          }
          logs_status=0
          turn_status=0
          run_test logs-selected "${common_logs[@]}" || logs_status=$?
          run_test turn-complete || turn_status=$?
          printf 'logs_status=%s\nturn_status=%s\n' "$logs_status" "$turn_status" \
            > "$PRIMARY_LOGS_EVIDENCE/logs/summary.txt"
          if [[ "$logs_status" != 0 || "$turn_status" != 0 ]]; then exit 1; fi
      - name: Print failure logs
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for file in "$PRIMARY_LOGS_EVIDENCE"/logs/*.stderr; do
            printf '%s\n' "--- $file ---"
            cat "$file"
          done
          for file in "$PRIMARY_LOGS_EVIDENCE"/logs/*.stdout; do
            printf '%s\n' "--- $file ---"
            cat "$file"
          done
      - name: Retain full qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: primary-logs-${{ matrix.product }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/primary-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.product }}/
          if-no-files-found: warn
          retention-days: 14
