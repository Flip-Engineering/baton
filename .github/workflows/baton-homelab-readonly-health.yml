name: baton-homelab-readonly-health

'on':
  push:
    branches: [codex/baton-homelab-readonly-health-20261018]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baton-homelab-readonly-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-health:
    timeout-minutes: 5
    runs-on:
      group: baton2-native-homelab
      labels: [self-hosted, Linux, X64, baton2-native-linux-x64]
    steps:
      - name: Capture bounded read-only host state
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/baton-host-health-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$output"
          (umask 077 && mkdir "$output")
          export BATON_HOST_HEALTH_OUTPUT="$output"
          printf 'BATON_HOST_HEALTH_OUTPUT=%s\n' "$output" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import datetime, json, os, pathlib, re, subprocess

          output = pathlib.Path(os.environ['BATON_HOST_HEALTH_OUTPUT'])
          records = []

          def read_file(label, path, limit=8192):
              try:
                  data = pathlib.Path(path).read_bytes()[:limit]
                  value = data.decode('utf-8', 'replace')
                  (output / (label + '.txt')).write_text(value)
                  print('== ' + label)
                  print(value.rstrip())
                  records.append({'name': label, 'status': 'read', 'bytes': len(data)})
              except Exception as error:
                  message = type(error).__name__ + ': ' + str(error)[:160]
                  (output / (label + '.txt')).write_text(message + '\n')
                  print('== ' + label + ' unavailable: ' + message)
                  records.append({'name': label, 'status': 'unavailable', 'detail': message})

          def run(label, argv, timeout=4, max_bytes=12000, filter_lines=None):
              try:
                  result = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                          timeout=timeout, check=False, text=True, errors='replace')
                  text = result.stdout[:max_bytes]
                  if filter_lines is not None:
                      text = '\n'.join(line for line in text.splitlines() if filter_lines.search(line)) + '\n'
                  (output / (label + '.txt')).write_text(text)
                  print('== ' + label + ' exit=' + str(result.returncode))
                  print(text.rstrip() or '(no matching output)')
                  records.append({'name': label, 'status': 'completed', 'exit_code': result.returncode,
                                  'bytes': len(text.encode('utf-8'))})
              except subprocess.TimeoutExpired:
                  (output / (label + '.txt')).write_text('timed out after ' + str(timeout) + ' seconds\n')
                  print('== ' + label + ' timed out after ' + str(timeout) + ' seconds')
                  records.append({'name': label, 'status': 'timeout', 'timeout_seconds': timeout})
              except Exception as error:
                  message = type(error).__name__ + ': ' + str(error)[:160]
                  (output / (label + '.txt')).write_text(message + '\n')
                  print('== ' + label + ' unavailable: ' + message)
                  records.append({'name': label, 'status': 'unavailable', 'detail': message})

          print('captured_utc=' + datetime.datetime.now(datetime.timezone.utc).isoformat())
          read_file('boot-id', '/proc/sys/kernel/random/boot_id', 128)
          read_file('uptime', '/proc/uptime', 256)
          try:
              mem = pathlib.Path('/proc/meminfo').read_text()
              selected = '\n'.join(line for line in mem.splitlines()
                                   if line.startswith(('MemTotal:', 'MemAvailable:', 'SwapTotal:', 'SwapFree:'))) + '\n'
              (output / 'memory.txt').write_text(selected)
              print('== memory')
              print(selected.rstrip())
              records.append({'name': 'memory', 'status': 'read'})
          except Exception as error:
              print('== memory unavailable: ' + type(error).__name__)
              records.append({'name': 'memory', 'status': 'unavailable'})
          read_file('memory-pressure', '/proc/pressure/memory', 2048)
          run('namespace-and-pid1', ['/bin/sh', '-c', 'printf "self_pid_namespace="; readlink /proc/self/ns/pid; printf "pid1_namespace="; readlink /proc/1/ns/pid; printf "pid1_comm="; cat /proc/1/comm; grep -E "^(Name|NSpid):" /proc/1/status'], timeout=4)
          run('largest-processes-by-comm', ['/usr/bin/ps', '-eo', 'pid,ppid,uid,comm,rss', '--sort=-rss'], timeout=4, max_bytes=1400,
              filter_lines=re.compile(r'^(\s*PID\b|\s*\d+)'))
          run('ssh-service-state', ['/usr/bin/systemctl', 'show', 'ssh.service',
              '-p', 'LoadState', '-p', 'ActiveState', '-p', 'SubState', '-p', 'MainPID', '-p', 'Result', '--no-pager'], timeout=4)
          run('sshd-service-alias-state', ['/usr/bin/systemctl', 'show', 'sshd.service',
              '-p', 'LoadState', '-p', 'ActiveState', '-p', 'SubState', '-p', 'MainPID', '-p', 'Result', '--no-pager'], timeout=4)
          run('runner-service-state', ['/usr/bin/systemctl', 'list-units', '--type=service', '--state=running',
              '--no-legend', '--no-pager', 'actions.runner*'], timeout=4, max_bytes=3000)

          def safe_journal(label, argv, pattern):
              try:
                  result = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                          timeout=4, check=False, text=True, errors='replace')
                  rows = []
                  for raw in result.stdout.splitlines():
                      try:
                          item = json.loads(raw)
                          message = str(item.get('MESSAGE', ''))
                          if pattern.search(message):
                              message = re.sub(r'(?<![\w.])(?:\d{1,3}\.){3}\d{1,3}(?![\w.])', '[address]', message)
                              rows.append('ts=' + str(item.get('__REALTIME_TIMESTAMP', '')) +
                                          ' pid=' + str(item.get('_PID', '')) +
                                          ' priority=' + str(item.get('PRIORITY', '')) +
                                          ' message=' + message[:400])
                      except (ValueError, TypeError):
                          continue
                  text = '\n'.join(rows[-20:]) + ('\n' if rows else '(no matching error records)\n')
                  (output / (label + '.txt')).write_text(text)
                  print('== ' + label + ' exit=' + str(result.returncode))
                  print(text.rstrip())
                  records.append({'name': label, 'status': 'completed', 'exit_code': result.returncode,
                                  'records': len(rows)})
              except subprocess.TimeoutExpired:
                  (output / (label + '.txt')).write_text('timed out after 4 seconds\n')
                  print('== ' + label + ' timed out after 4 seconds')
                  records.append({'name': label, 'status': 'timeout', 'timeout_seconds': 4})
              except Exception as error:
                  message = type(error).__name__ + ': ' + str(error)[:160]
                  (output / (label + '.txt')).write_text(message + '\n')
                  print('== ' + label + ' unavailable: ' + message)
                  records.append({'name': label, 'status': 'unavailable', 'detail': message})

          journal_filter = re.compile(r'(?i)(oom|out of memory|killed process|nvrm|xid|gpu|panic|watchdog|segfault)')
          ssh_filter = re.compile(r'(?i)(error|failed|failure|pam|session|listen|bind|authentication|banner|disconnect)')
          safe_journal('kernel-errors', ['/usr/bin/journalctl', '-k', '-b', '-p', 'err..emerg', '-n', '80', '--no-pager', '-o', 'json'], journal_filter)
          safe_journal('ssh-errors', ['/usr/bin/journalctl', '-b', '-u', 'ssh.service', '-p', 'warning..emerg', '-n', '60', '--no-pager', '-o', 'json'], ssh_filter)
          (output / 'summary.json').write_text(json.dumps({'schema': 'baton-host-health-v1', 'records': records}, indent=2) + '\n')
          PY
      - name: Preserve bounded host snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baton-host-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BATON_HOST_HEALTH_OUTPUT }}/
          if-no-files-found: error
