name: Native context managed successor focused gate

on:
  push:
    branches:
      - codex/validate-native-context-managed-successor-luna-20261007

permissions:
  contents: read

jobs:
  native-context-managed-successor:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - name: Check out validation driver
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check out immutable candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 3a7503d52545dea6bb781097dbc322a7f1793bbe
          path: candidate
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/native-context-managed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run"
          mkdir -p "$run/toolchain" "$run/evidence"
          printf 'NATIVE_CONTEXT_RUN=%s\n' "$run" >> "$GITHUB_ENV"
          printf '%s\n' "$run" > "$run/evidence/run-directory.txt"
      - name: Verify candidate source and record runtime
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git -C candidate rev-parse HEAD)"
          actual_tree="$(git -C candidate rev-parse 'HEAD^{tree}')"
          printf '%s\n' "$actual_commit" | tee "$NATIVE_CONTEXT_RUN/evidence/source-commit.txt"
          printf '%s\n' "$actual_tree" | tee "$NATIVE_CONTEXT_RUN/evidence/source-tree.txt"
          git -C candidate status --short --branch > "$NATIVE_CONTEXT_RUN/evidence/source-status.txt"
          printf 'expected_commit=%s\nactual_commit=%s\n' \
            3a7503d52545dea6bb781097dbc322a7f1793bbe "$actual_commit"
          if [[ "$actual_commit" != 3a7503d52545dea6bb781097dbc322a7f1793bbe ]]; then exit 1; fi
          printf 'expected_tree=%s\nactual_tree=%s\n' \
            4015ddf05d416c2a8090be4ef7e41ecf3df69a89 "$actual_tree"
          if [[ "$actual_tree" != 4015ddf05d416c2a8090be4ef7e41ecf3df69a89 ]]; then exit 1; fi
          shasum -a 256 \
            candidate/bend2/src/coordinator/main.bend \
            candidate/bend2/src/context/native.bend \
            candidate/bend2/src/context/native-managed-query.bend \
            candidate/bend2/src/context/native-managed-query-laws.bend \
            candidate/bend2/src/coordinator/turn.bend \
            candidate/bend2/src/host/process-spawn.c \
            candidate/bend2/src/host/process.bend \
            candidate/bend2/scripts/context-provider.mjs \
            candidate/bend2/scripts/context-query-artifact.mjs \
            candidate/bend2/scripts/context-query-artifact.test.mjs \
            candidate/bend2/test/shared-instance.py \
            candidate/bend2/test/context-lifecycle.py \
            candidate/bend2/test/ui-orchestra-server.test.mjs \
            candidate/bend2/test/package-selected-context.py \
            candidate/bend2/context/bend2/acquisition.test.mjs \
            candidate/bend2/context/bend2/frontend-adapter.test.mjs \
            candidate/bend2/context/bend2/native-provider.test.mjs \
            candidate/bend2/context/bend2/source-binding.test.mjs \
            candidate/bend2/context/bend2/worktree-capture.test.mjs \
            candidate/bend2/tests/context-lifecycle.bend \
            > "$NATIVE_CONTEXT_RUN/evidence/source-files.sha256"
          {
            uname -a
            uname -m
            xcodebuild -version
            xcrun --find clang
            clang --version
            python3 --version
            node --version
            git --version
            sqlite3 --version
          } > "$NATIVE_CONTEXT_RUN/evidence/runtime.txt" 2>&1
          clang_path="$(xcrun --find clang)"
          shasum -a 256 "$clang_path" > "$NATIVE_CONTEXT_RUN/evidence/clang-binary.sha256"
          shasum -a 256 "$(command -v python3)" > "$NATIVE_CONTEXT_RUN/evidence/python-binary.sha256"
      - name: Install pinned Bend 2.0.25
        shell: bash
        run: |
          set -euo pipefail
          archive="$NATIVE_CONTEXT_RUN/toolchain/bend-2.0.25-darwin-arm64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/bendlang/bend/releases/download/v2.0.25/bend-2.0.25-darwin-arm64.tar.gz \
            -o "$archive" > "$NATIVE_CONTEXT_RUN/toolchain/download.log" 2>&1
          printf 'c5bb22ba029d5909da9c6db82aa037278a66d1cf8a5572f433879f7dcd866c31  %s\n' "$archive" | \
            shasum -a 256 -c - > "$NATIVE_CONTEXT_RUN/toolchain/archive-check.log" 2>&1
          tar -tzf "$archive" > "$NATIVE_CONTEXT_RUN/toolchain/archive-members.txt"
          BEND_HOME="$NATIVE_CONTEXT_RUN/toolchain-home" sh candidate/docs/bend2/reference/toolchain/install-2.0.25.sh \
            > "$NATIVE_CONTEXT_RUN/toolchain/install.log" 2>&1
          bend="$NATIVE_CONTEXT_RUN/toolchain-home/bin/bend"
          "$bend" version | tee "$NATIVE_CONTEXT_RUN/toolchain/version.txt"
          test "$("$bend" version)" = 'bend 2.0.25'
          shasum -a 256 "$bend" > "$NATIVE_CONTEXT_RUN/toolchain/bend-binary.sha256"
          shasum -a 256 "$archive" > "$NATIVE_CONTEXT_RUN/toolchain/archive.sha256"
      - name: Run selected context JavaScript and package tests
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          node --test bend2/context/bend2/*.test.mjs \
            bend2/scripts/context-query-artifact.test.mjs \
            bend2/test/context-project-policy.test.mjs \
            bend2/test/context-provider.test.mjs \
            2>&1 | tee "$NATIVE_CONTEXT_RUN/evidence/context-javascript.log"
          python3 bend2/test/package-selected-context.py \
            2>&1 | tee "$NATIVE_CONTEXT_RUN/evidence/package-selected-context.log"
      - name: Build production Main
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          mkdir -p .scratch/bend2
          BEND="$NATIVE_CONTEXT_RUN/toolchain-home/bin/bend" CC=clang \
            sh bend2/scripts/build-native.sh bend2/src/coordinator/main.bend .scratch/bend2/baton2 \
            2>&1 | tee "$NATIVE_CONTEXT_RUN/evidence/main-build.log"
          shasum -a 256 .scratch/bend2/baton2 .scratch/bend2/baton2.c \
            > "$NATIVE_CONTEXT_RUN/evidence/main-artifacts.sha256"
      - name: Run required native public view acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          BATON2_REQUIRE_NATIVE_VIEW=1 \
          BATON2_NATIVE_BINARY="$PWD/.scratch/bend2/baton2" \
            node --test bend2/test/ui-orchestra-server.test.mjs \
            2>&1 | tee "$NATIVE_CONTEXT_RUN/evidence/native-public-view.log"
      - name: Build and run shared instance controls
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          BEND="$NATIVE_CONTEXT_RUN/toolchain-home/bin/bend" CC=clang \
            sh bend2/scripts/build-native.sh bend2/test/instance.bend .scratch/bend2/instance-test \
            2>&1 | tee "$NATIVE_CONTEXT_RUN/evidence/instance-build.log"
          python3 bend2/test/shared-instance.py \
            2>&1 | tee "$NATIVE_CONTEXT_RUN/evidence/shared-instance.log"
      - name: Run managed context store lifecycle suite
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          BEND="$NATIVE_CONTEXT_RUN/toolchain-home/bin/bend" python3 bend2/test/context-lifecycle.py \
            2>&1 | tee "$NATIVE_CONTEXT_RUN/evidence/context-lifecycle.log"
      - name: Run context artifact and provider suites
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          node --test bend2/scripts/context-query-artifact.test.mjs \
            2>&1 | tee "$NATIVE_CONTEXT_RUN/evidence/context-query-artifact.log"
          node --test bend2/test/context-provider.test.mjs \
            2>&1 | tee "$NATIVE_CONTEXT_RUN/evidence/context-provider.log"
      - name: Retain exact-source focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-context-managed-successor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.NATIVE_CONTEXT_RUN }}/evidence/
            ${{ env.NATIVE_CONTEXT_RUN }}/toolchain/
          if-no-files-found: error
          retention-days: 30
