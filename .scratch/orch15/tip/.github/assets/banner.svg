<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Baton — cross-harness agent orchestration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A14"/>
      <stop offset="100%" stop-color="#10101E"/>
    </linearGradient>
    <linearGradient id="b-hat" x1="420" y1="60" x2="530" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B4FA8"/>
      <stop offset="1" stop-color="#1B2452"/>
    </linearGradient>
    <linearGradient id="b-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5B45C"/>
      <stop offset="1" stop-color="#8E6230"/>
    </linearGradient>
    <linearGradient id="b-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F26D5B"/>
      <stop offset="1" stop-color="#A63F35"/>
    </linearGradient>
    <linearGradient id="b-cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83C8BF"/>
      <stop offset="1" stop-color="#315F6E"/>
    </linearGradient>
    <linearGradient id="b-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B07CD8"/>
      <stop offset="1" stop-color="#5E3A8C"/>
    </linearGradient>
    <linearGradient id="b-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BC8A4"/>
      <stop offset="1" stop-color="#2F6B52"/>
    </linearGradient>
    <linearGradient id="b-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C8CFF"/>
      <stop offset="1" stop-color="#2E3E8C"/>
    </linearGradient>
    <filter id="b-shadow" filterUnits="userSpaceOnUse" x="-30" y="-50" width="170" height="200" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF8FA3" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="900" height="400" fill="url(#bg)"/>

  <!-- wordmark -->
  <text x="64" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="12" fill="#EAEAEA">BATON</text>
  <text x="66" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#8B8B8B">CROSS-HARNESS AGENT ORCHESTRATION</text>
  <text x="66" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#6B6B6B">One conductor. Full-harness workers.</text>
  <text x="66" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#6B6B6B">Real messaging, telemetry, mid-flight steering.</text>

  <!-- music staff flowing under everything -->
  <g stroke="#3A3A4E" stroke-width="1" fill="none" opacity="0.5">
    <path d="M50 320 C 230 300, 420 350, 620 310 S 840 280, 870 288"/>
    <path d="M50 332 C 230 312, 420 362, 620 322 S 840 292, 870 300"/>
    <path d="M50 344 C 230 324, 420 374, 620 334 S 840 304, 870 312"/>
  </g>

  <!-- constellation lanes: baton-tip magic to the fleet chips -->
  <g stroke="#9B59B6" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="594" y1="152" x2="714" y2="106"/>
    <line x1="594" y1="152" x2="714" y2="156"/>
    <line x1="594" y1="152" x2="714" y2="206"/>
    <line x1="594" y1="152" x2="714" y2="256"/>
    <line x1="594" y1="152" x2="714" y2="306"/>
    <line x1="594" y1="152" x2="714" y2="356"/>
  </g>

  <!-- Flip, conducting (the real mascot — Fantasia hat + baton) -->
  <g transform="translate(400 138) scale(1.9)" filter="url(#b-shadow)">
    <!-- the character (docs/assets/brand/mascot-smile.svg) -->
    <ellipse cx="50" cy="52" rx="46" ry="42" fill="#FF8FA3"/>
    <ellipse cx="50" cy="54" rx="38" ry="34" fill="#FFF0F3"/>
    <text x="22" y="56" font-size="6" fill="#FFD700" text-anchor="middle">✦</text>
    <text x="78" y="56" font-size="6" fill="#FFD700" text-anchor="middle">✦</text>
    <circle cx="32" cy="54" r="1.2" fill="#E94560" fill-opacity="0.3"/>
    <circle cx="36" cy="56" r="1.2" fill="#E94560" fill-opacity="0.3"/>
    <circle cx="34" cy="58" r="1.2" fill="#E94560" fill-opacity="0.3"/>
    <circle cx="64" cy="54" r="1.2" fill="#E94560" fill-opacity="0.3"/>
    <circle cx="68" cy="56" r="1.2" fill="#E94560" fill-opacity="0.3"/>
    <circle cx="66" cy="58" r="1.2" fill="#E94560" fill-opacity="0.3"/>
    <circle cx="36" cy="46" r="7" fill="white"/>
    <circle cx="39" cy="46" r="4.5" fill="#C93550"/>
    <circle cx="40.5" cy="44.5" r="1.5" fill="white"/>
    <circle cx="64" cy="46" r="7" fill="white"/>
    <circle cx="67" cy="46" r="4.5" fill="#C93550"/>
    <circle cx="68.5" cy="44.5" r="1.5" fill="white"/>
    <path d="M38 62 Q50 74 62 62" stroke="#C93550" stroke-width="4" stroke-linecap="round" fill="none"/>
    <ellipse cx="50" cy="69" rx="4" ry="5" fill="#FF8A80"/>
    <ellipse cx="24" cy="58" rx="8" ry="5" fill="#FF8FA3" fill-opacity="0.4"/>
    <ellipse cx="76" cy="58" rx="8" ry="5" fill="#FF8FA3" fill-opacity="0.4"/>
    <!-- sorcerer hat (Fantasia) -->
    <path d="M28 16 C30 -2 40 -18 52 -26 C54 -12 66 -2 78 2 C64 10 44 14 28 16 Z" fill="url(#b-hat)" stroke="#1B2452" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M18 18 C34 8 68 8 84 16 C82 22 70 24 50 24 C30 24 20 22 18 18 Z" fill="url(#b-hat)" stroke="#1B2452" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M42 -4 l1.6 3.9 3.9 1.6 -3.9 1.6 -1.6 3.9 -1.6 -3.9 -3.9 -1.6 3.9 -1.6 z" fill="#FFE9A8"/>
    <path d="M58 -12 l1.3 3.2 3.2 1.3 -3.2 1.3 -1.3 3.2 -1.3 -3.2 -3.2 -1.3 3.2 -1.3 z" fill="#FFE9A8"/>
    <path d="M33 6 a4.5 4.5 0 1 0 4 7 a3.2 3.2 0 1 1 -4 -7 z" fill="#FFE9A8"/>
    <!-- raised paw + conductor's baton -->
    <circle cx="86" cy="60" r="6" fill="#FF8FA3" stroke="#C93550" stroke-width="2"/>
    <path d="M86 60 L95 32" stroke="#D9B38C" stroke-width="4" stroke-linecap="round"/>
    <path d="M95 32 L101 16" stroke="#EAEAEA" stroke-width="3.5" stroke-linecap="round"/>
    <!-- sparkles off the baton tip -->
    <path d="M101 4 L102.8 8.2 L107 10 L102.8 11.8 L101 16 L99.2 11.8 L95 10 L99.2 8.2 Z" fill="#FFD700"/>
    <path d="M89 -1 L90.2 2.2 L93.5 3.5 L90.2 4.8 L89 8 L87.8 4.8 L84.5 3.5 L87.8 2.2 Z" fill="#FFD700"/>
  </g>

  <!-- the fleet: six harness chips -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
    <g>
      <rect x="714" y="88" width="58" height="36" rx="9" fill="url(#b-red)" stroke="#292313" stroke-width="3"/>
      <text x="743" y="110" fill="#FFFDF7">Claude</text>
    </g>
    <g>
      <rect x="714" y="138" width="58" height="36" rx="9" fill="url(#b-green)" stroke="#292313" stroke-width="3"/>
      <text x="743" y="160" fill="#FFFDF7">Codex</text>
    </g>
    <g>
      <rect x="714" y="188" width="58" height="36" rx="9" fill="url(#b-violet)" stroke="#292313" stroke-width="3"/>
      <text x="743" y="210" fill="#FFFDF7">GLM</text>
    </g>
    <g>
      <rect x="714" y="238" width="58" height="36" rx="9" fill="#17171D" stroke="#4A4A55" stroke-width="3"/>
      <text x="743" y="260" fill="#EAEAEA">Grok</text>
    </g>
    <g>
      <rect x="714" y="288" width="58" height="36" rx="9" fill="url(#b-deep)" stroke="#292313" stroke-width="3"/>
      <text x="743" y="310" fill="#FFFDF7">DeepSeek</text>
    </g>
    <g>
      <rect x="714" y="338" width="58" height="36" rx="9" fill="url(#b-cool)" stroke="#292313" stroke-width="3"/>
      <text x="743" y="360" fill="#FFFDF7">Kimi</text>
    </g>
  </g>

  <text x="743" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="10" letter-spacing="2" fill="#6B6B6B" text-anchor="middle">THE FLEET</text>
</svg>
