      <path d="M28 16 C30 -2 40 -18 52 -26 C54 -12 66 -2 78 2 C64 10 44 14 28 16 Z"/>
      <path d="M18 18 C34 8 68 8 84 16 C82 22 70 24 50 24 C30 24 20 22 18 18 Z"/>
