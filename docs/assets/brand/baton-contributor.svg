      <path d="M79 62 C79 56 82 53.5 86 53.5 C91 53.5 94 57 94 62 C94 66 91 68 86 68 H83 C80 68 78.5 66 79 62 Z" fill="#FF8FA3" stroke="#C93550" stroke-width="2.2" stroke-linejoin="round"/>
