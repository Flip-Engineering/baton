<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Flip - Baton contributor avatar</title>
  <defs>
    <linearGradient id="field-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14141F"/>
      <stop offset="1" stop-color="#1D1D2E"/>
    </linearGradient>
    <linearGradient id="hat-gradient" x1="150" y1="70" x2="330" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B4FA8"/>
      <stop offset="1" stop-color="#1B2452"/>
    </linearGradient>
  </defs>
  <g id="field" data-layer="field">
    <rect width="512" height="512" rx="112" fill="url(#field-gradient)"/>
  </g>
  <g id="character" transform="translate(106 118) scale(3)">
    <g id="face" data-layer="face">
