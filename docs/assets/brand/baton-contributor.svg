      <ellipse cx="50" cy="54" rx="38" ry="34" fill="#FFF0F3"/>
      <g id="freckles" fill="#E94560" fill-opacity="0.3">
        <circle cx="32" cy="54" r="1.2"/><circle cx="36" cy="56" r="1.2"/><circle cx="34" cy="58" r="1.2"/>
        <circle cx="64" cy="54" r="1.2"/><circle cx="68" cy="56" r="1.2"/><circle cx="66" cy="58" r="1.2"/>
      </g>
      <g id="eyes" data-layer="eyes">
        <circle cx="36" cy="46" r="7" fill="#FFFFFF"/>
        <circle cx="39" cy="46" r="4.5" fill="#C93550"/>
        <circle cx="40.5" cy="44.5" r="1.5" fill="#FFFFFF"/>
        <circle cx="64" cy="46" r="7" fill="#FFFFFF"/>
        <circle cx="67" cy="46" r="4.5" fill="#C93550"/>
        <circle cx="68.5" cy="44.5" r="1.5" fill="#FFFFFF"/>
      </g>
      <g id="expression" data-layer="expression">
        <path d="M38 62 Q50 74 62 62" stroke="#C93550" stroke-width="4" stroke-linecap="round" fill="none"/>
        <ellipse cx="50" cy="69" rx="4" ry="5" fill="#FF8A80"/>
        <ellipse cx="24" cy="58" rx="8" ry="5" fill="#FF8FA3" fill-opacity="0.4"/>
        <ellipse cx="76" cy="58" rx="8" ry="5" fill="#FF8FA3" fill-opacity="0.4"/>
